<html lang="es">
<head>

<title>Vida Financiera</title>
<style>
:root{
  --bg:#0e1116; --surface:#161a21; --surface2:#1e232c; --line:#2a303b;
  --text:#e8eaee; --muted:#a3abb9; --faint:#707988;
  --accent:#4fb3a9; --accent-ink:#06201d; --accent-soft:rgba(79,179,169,.14);
  --pos:#5cc98a; --neg:#ef7070; --warn:#e7b24a;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650}
h1{font-size:20px} h2{font-size:16px} h3{font-size:14px;color:var(--muted);font-weight:600}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;max-width:560px;margin:0 auto}
.top .sub{color:var(--faint);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card.soft{background:var(--surface2)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row+.row{margin-top:8px}
.col{display:flex;flex-direction:column;gap:2px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px} .tiny{font-size:12px}
.big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.mid{font-size:20px;font-weight:650}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface2);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:17px;font-weight:650;margin-top:2px}
.bar{height:8px;background:var(--surface2);border-radius:6px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.over>i{background:var(--neg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600}
a.btn{text-decoration:none;color:var(--text)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--neg);border-color:rgba(239,112,112,.4)}
.btn.block{width:100%}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45}
.link{background:none;border:0;color:var(--accent);padding:0;cursor:pointer;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll .chip{flex:none;white-space:nowrap}
body.sheet-open{overflow:hidden}
.chips.scroll::-webkit-scrollbar{display:none}
.chip.x{padding-right:8px}
label.f{display:block;margin:12px 0 4px;font-size:13px;color:var(--muted)}
input.i,select.i,textarea.i{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--accent)}
input.money{font-size:28px;font-weight:700;text-align:center;padding:12px}
.hint{font-size:12px;color:var(--faint);margin-top:4px}
.sep{height:1px;background:var(--line);margin:12px 0}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.list .it .grow{flex:1;min-width:0}
.list .it .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.day{font-size:12px;color:var(--faint);margin:14px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.badge.bad{color:var(--neg);border-color:rgba(239,112,112,.45)}
.badge.ok{color:var(--pos);border-color:rgba(92,201,138,.45)}
.badge.w{color:var(--warn);border-color:rgba(231,178,74,.45)}
.status{display:flex;gap:12px;align-items:center}
.status .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.status.verde .ic{background:rgba(92,201,138,.16);color:var(--pos)}
.status.amarillo .ic{background:rgba(231,178,74,.16);color:var(--warn)}
.status.rojo .ic{background:rgba(239,112,112,.16);color:var(--neg)}
.alert{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:6px 0}
.alert b{flex:none}
nav.bot{position:fixed;left:0;right:0;bottom:0;background:rgba(14,17,22,.96);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:5;backdrop-filter:blur(8px)}
nav.bot button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--faint);font-size:10.5px;padding:4px 2px;cursor:pointer;flex:1;min-width:0}
details.dt summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;margin-top:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}

nav.bot .add svg{width:26px;height:26px}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding-bottom:40px}
.sheet.hidden{display:none}
.sheet .hd{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);z-index:2}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#2b313c;color:var(--text);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px}
.pins{display:flex;gap:12px;height:18px}
.pins i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pins i.f{background:var(--accent);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:600;cursor:pointer}
.pad button.ghost{border:0;background:none;font-size:14px;color:var(--muted)}
.catbars .r{margin:10px 0}
.catbars .r .row{font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td{padding:6px 0;border-bottom:1px solid var(--line)}
table.t td:last-child{text-align:right}
.empty{color:var(--faint);font-size:14px;padding:6px 0}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>

<body>
<div id="app"></div>
<div id="sheet" class="sheet hidden"></div>
<div id="toast" class="toast"></div>
<script>
'use strict';
/* =========================================================
   Vida Financiera — fase 1
   Datos guardados solo en este celular (IndexedDB).
   ========================================================= */

// ---------- almacenamiento ----------
const DB_NAME = 'vidafin', STORE = 'kv';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function dbGet(k){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction(STORE,'readonly').objectStore(STORE).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function dbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}

// ---------- utilidades ----------
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addD = (s,n) => { const d = pd(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffD = (a,b) => Math.round((pd(b)-pd(a))/864e5);
const lastDay = (y,m) => new Date(y,m,0).getDate();
const hoy = () => window.__HOY || ymd(new Date());
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const miles = n => String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const $$ = n => (Math.round(n||0) < 0 ? '−' : '') + '$' + miles(n||0);
const num = s => { const v = String(s??'').replace(/[^\d]/g,''); return v ? Number(v) : 0; };
const norm = t => String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
const fcorta = s => { const d = pd(s); return `${d.getDate()} ${MESES[d.getMonth()]}`; };
const flarga = s => { const d = pd(s); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`; };
const pct = (a,b) => b > 0 ? Math.max(0, Math.min(100, a/b*100)) : 0;

// ---------- estado por defecto ----------
function estadoInicial(){
  const t = hoy();
  return {
    version: 1, creado: t,
    settings: { pinHash:null, salt:null, lockMin:3, lastBackup:null, quincenaMonto:null, cierres:{}, onboarded:false },
    cuentas: [
      { id:'bancolombia', nombre:'Bancolombia', saldoInicial:null },
      { id:'nequi', nombre:'Nequi', saldoInicial:null },
      { id:'efectivo', nombre:'Efectivo', saldoInicial:null },
    ],
    categorias: {
      ingreso: [
        { id:'nomina', nombre:'Nómina', subs:['Quincena'] },
        { id:'comision', nombre:'Comisión', subs:[] },
        { id:'prima', nombre:'Prima', subs:[] },
        { id:'extra', nombre:'Trabajos extra', subs:['Freelance','Proyectos por fuera'] },
        { id:'ventas', nombre:'Ventas / negocio', subs:[] },
        { id:'rendimientos', nombre:'Rendimientos', subs:[] },
        { id:'cadena', nombre:'Cadena recibida', subs:[], real:false, sistema:true },
        { id:'regalo', nombre:'Regalo', subs:[] },
        { id:'otro_i', nombre:'Otro', subs:[] },
      ],
      gasto: [
        { id:'vivienda', nombre:'Vivienda', subs:['Arriendo','Internet','Luz','Agua','Gas','Aseo y cosas del hogar'] },
        { id:'comunicaciones', nombre:'Comunicaciones', subs:['Plan celular'] },
        { id:'alimentacion', nombre:'Alimentación', subs:['Desayuno','Almuerzo','Cena','Mercado','Domicilios','Café y snacks'] },
        { id:'antojos', nombre:'Antojos', subs:['Tintos extra','Dulces y snacks','Gaseosas','Comida extra'] },
        { id:'transporte', nombre:'Transporte', subs:['Recarga TuLlave','Taxi o app','Viaje fuera de la ciudad'] },
        { id:'personal', nombre:'Personal', subs:['Ropa y calzado','Aseo personal','Peluquería'] },
        { id:'salud', nombre:'Salud', subs:['Medicamentos','Citas y exámenes'] },
        { id:'mascota', nombre:'Mascota', subs:['Comida','Veterinario','Accesorios'] },
        { id:'pareja', nombre:'Pareja y salidas', subs:['Salidas','Regalos'] },
        { id:'entretenimiento', nombre:'Entretenimiento', subs:['Suscripciones','Eventos y planes','Viajes'] },
        { id:'educacion', nombre:'Educación', subs:['Cursos','Libros'] },
        { id:'familia', nombre:'Familia', subs:['Apoyo a familia'] },
        { id:'trabajo', nombre:'Trabajo', subs:['Gastos no reembolsados'] },
        { id:'financieros', nombre:'Financieros', subs:['4x1000','Cuotas de manejo','Intereses y mora'] },
        { id:'otros', nombre:'Otros', subs:['Imprevistos','Sin clasificar'] },
      ],
    },
    supervivencia: [
      { id:'s1', nombre:'Transporte', porDia:7200, cat:'transporte' },
      { id:'s2', nombre:'Desayuno', porDia:9000, cat:'alimentacion' },
      { id:'s3', nombre:'Almuerzo', porDia:20000, cat:'alimentacion' },
      { id:'s4', nombre:'Cena', porDia:15000, cat:'alimentacion' },
    ],
    fijos: [],
    deudas: [],
    metas: [],
    porCobrar: [],
    bolsillos: [
      { id:'emergencia', nombre:'Fondo de emergencia', tipo:'emergencia', aporte:20000, inicial:0, sistema:true },
      { id:'cadena', nombre:'Cadena', tipo:'cadena', aporte:100000, recibes:1100000, fechaEntrega:'2026-12-15', fechaFin:'2026-12-30', inicial:null, sistema:true },
    ],
    movs: [],
  };
}

let S = null;            // estado
let view = 'inicio';     // pantalla actual
let movMes = null;       // mes filtrado en movimientos
let movFiltro = { tipo:'', cat:'', cuenta:'' };
let bloqueado = true;
let hiddenAt = 0;

async function guardar(){ await dbSet('state', S); }

// ---------- tipos de movimiento ----------
const TIPOS = {
  gasto:     { l:'Gasto' },
  ingreso:   { l:'Ingreso' },
  pago:      { l:'Pago de deuda' },
  apartar:   { l:'Apartar' },
  sacar:     { l:'Sacar de bolsillo' },
  prestamo:  { l:'Préstamo recibido' },
  reintegro: { l:'Reintegro' },
  transfer:  { l:'Transferencia' },
  cadena:    { l:'Aporte a cadena' },
  prestado:  { l:'Préstamo dado' },
  cobro:     { l:'Cobro recibido' },
};
const catDe = (tipo,id) => (S.categorias[tipo]||[]).find(c=>c.id===id);
const catNombre = (id) => (catDe('gasto',id)||catDe('ingreso',id)||{}).nombre || id || '';
const cuentaNombre = id => (S.cuentas.find(c=>c.id===id)||{}).nombre || '—';

// ---------- quincenas ----------
const nom15 = (y,m) => `${y}-${pad(m)}-15`;
const nom30 = (y,m) => `${y}-${pad(m)}-${pad(Math.min(30,lastDay(y,m)))}`;
function nominales(s){
  const d = pd(s); const out=[];
  for(let k=-2;k<=2;k++){ let y=d.getFullYear(), m=d.getMonth()+1+k; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} out.push(nom15(y,m), nom30(y,m)); }
  return out.sort();
}
const nominalCercana = s => nominales(s).reduce((b,n)=>Math.abs(diffD(s,n))<Math.abs(diffD(s,b))?n:b);
const nominalSiguiente = n => nominales(n).find(x=>x>n);
const nominalUltima = s => nominales(s).filter(x=>x<=s).pop();

function quincenaDe(fecha, movs){
  const pagos = movs.filter(m=>m.tipo==='ingreso'&&m.catId==='nomina').map(m=>m.fecha).sort();
  const L = pagos.filter(f=>f<=fecha).pop();
  const N = nominalUltima(fecha);
  let start, own;
  if (L && L >= addD(N,-5)) { start = L; own = nominalCercana(L); }
  else { start = N; own = N; }
  const nxt = nominalSiguiente(own);
  let end = addD(nxt,-1);
  const temprano = pagos.find(f=>f>start && f>=addD(nxt,-5) && f<=nxt);
  if (temprano) end = addD(temprano,-1);
  return { start, end, own, tipo: own.slice(8)==='15' ? '15' : '30', dias: diffD(start,end)+1 };
}

// ---------- cálculo central ----------
function calcular(){
  const T = hoy();
  const movs = [...S.movs].sort((a,b)=> a.fecha<b.fecha?-1 : a.fecha>b.fecha?1 : a.creado-b.creado);
  const saldo = {}; S.cuentas.forEach(c=> saldo[c.id] = Number(c.saldoInicial||0));
  const bal = {};
  S.bolsillos.forEach(b=> bal[b.id] = Number(b.inicial||0));
  (S.metas||[]).forEach(mt=> bal[mt.id] = Number(mt.inicial||0));
  let reponer = 0;
  const add = (id,v) => { if (id in saldo) saldo[id] += v; };
  const take = (k,v) => { bal[k] = Math.max(0,(bal[k]||0)-v); };
  for (const m of movs){
    const a = Number(m.monto)||0;
    switch(m.tipo){
      case 'ingreso': add(m.cuentaId,a); if (m.catId==='cadena') bal.cadena = 0; break;
      case 'prestamo': case 'reintegro': add(m.cuentaId,a); break;
      case 'gasto': case 'pago': if (m.previo) break; add(m.cuentaId,-a); if (m.bolsillo) take(m.bolsillo,a); break;
      case 'cadena': add(m.cuentaId,-a); bal.cadena = (bal.cadena||0)+a; break;
      case 'prestado': add(m.cuentaId,-a); break;
      case 'cobro': add(m.cuentaId,a); break;
      case 'transfer': add(m.cuentaId,-a); add(m.cuentaDestinoId,a); break;
      case 'apartar': bal[m.bolsillo] = (bal[m.bolsillo]||0)+a; if (m.bolsillo==='emergencia') reponer = Math.max(0,reponer-a); break;
      case 'sacar': take(m.bolsillo,a); if (m.bolsillo==='emergencia') reponer += a; break;
    }
  }
  const saldoTotal = Object.values(saldo).reduce((s,v)=>s+v,0);
  const apartado = Object.entries(bal).filter(([k])=>k!=='cadena').reduce((s,[,v])=>s+v,0);

  // supervivencia
  const grupos = {};
  S.supervivencia.forEach(r=>{ const g = grupos[r.cat] || (grupos[r.cat] = { cat:r.cat, porDia:0, rubros:[] }); g.porDia += Number(r.porDia)||0; g.rubros.push(r.nombre); });
  // la supervivencia cuenta desde el día en que empezaste a usar la app (la primera quincena va a medias)
  // Reserva diaria: se aparta lo que queda de HOY + lo de los días que faltan.
  // Lo que no gastaste en días pasados deja de estar reservado y se muestra como ahorro de la quincena.
  const superv = (q) => { const ini = S.creado > q.start ? S.creado : q.start; const dias = Math.max(0, diffD(ini,q.end)+1); return Object.values(grupos).map(g=>{
    const pres = g.porDia*dias; let gast = 0, gastHoy = 0, gastAntes = 0;
    movs.forEach(m=>{ if (m.fecha>=ini && m.fecha<=q.end && m.catId===g.cat){ let v = 0; if (m.tipo==='gasto' && !m.bolsillo && !m.previo) v = +m.monto; if (m.tipo==='reintegro') v = -m.monto; gast += v; if (m.fecha===T) gastHoy += v; else if (m.fecha<T) gastAntes += v; } });
    const enCurso = T>=ini && T<=q.end;
    const diasAntes = enCurso ? diffD(ini,T) : dias;              // días ya pasados de la quincena
    const diasDespues = enCurso ? diffD(T,q.end) : 0;             // días que faltan después de hoy
    const hoyRest = enCurso ? g.porDia - gastHoy : 0;
    const ahorro = g.porDia*diasAntes - gastAntes;                // + ahorraste, − te pasaste (días pasados)
    const reservaQ = enCurso ? Math.max(0,hoyRest) + g.porDia*diasDespues : 0;
    return { ...g, nombre: catNombre(g.cat), pres, gast, rest: pres-gast, dias, ini, gastHoy, hoyRest, ahorro, reservaQ, diasDespues, enCurso };
  }); };
  const q = quincenaDe(T, movs);
  const diasRest = Math.max(1, diffD(T,q.end)+1);
  const sv = superv(q);
  const reservado = sv.reduce((s,g)=>s+g.reservaQ,0);
  const ahorroSv = sv.reduce((s,g)=>s+g.ahorro,0);
  const disponible = saldoTotal - apartado - reservado;
  const libreDia = disponible > 0 ? disponible/diasRest : 0;

  // deudas
  const mesAct = T.slice(0,7);
  const [ty,tm] = T.split('-').map(Number);
  const dueEn = (y,m,dia) => `${y}-${pad(m)}-${pad(Math.min(dia,lastDay(y,m)))}`;
  const sigMes = (y,m) => m===12 ? [y+1,1] : [y,m+1];
  const deudas = S.deudas.map(d=>{
    const aj = (d.ajustes||[]);
    const conocido = d.saldoInicial!=null && d.saldoInicial!=='';
    const base = aj.length ? aj[aj.length-1] : { fecha:d.fechaInicio, saldo: conocido ? +d.saldoInicial : null, creado:d.creado };
    const despues = p => p.fecha>base.fecha || (p.fecha===base.fecha && p.creado>base.creado);
    const todos = movs.filter(m=>m.tipo==='pago'&&m.deudaId===d.id);
    const pagos = todos.filter(m=>!m.previo);
    const aumentos = movs.filter(m=>m.tipo==='prestamo'&&m.deudaId===d.id&&m.id!==d.origenMov&&despues(m)).reduce((s,m)=>s+ +m.monto,0);
    const saldoAct = base.saldo==null ? null : base.saldo + aumentos - pagos.filter(despues).reduce((s,m)=>s+ +m.monto,0);
    const totalPagado = pagos.reduce((s,m)=>s+ +m.monto,0);
    const intereses = aj.reduce((s,a)=>s+Math.max(0,a.diferencia||0),0);
    const pagadoMes = todos.filter(m=>m.fecha.slice(0,7)===mesAct).reduce((s,m)=>s+ +m.monto,0);
    let prox = null, atrasada = false, atrasadoMonto = 0, cuotasAtrasadas = 0, pagadoProx = false;
    const cuota = +d.cuota||0;
    if (d.tipo==='obligatoria' && d.diaPago && cuota>0){
      // cuotas que ya debieron pagarse: las vencidas al cargar la deuda + cada fecha de pago que pasó desde entonces
      let [y,m] = d.fechaInicio.split('-').map(Number); let vencidasDesde = 0;
      while (true){ const f = dueEn(y,m,d.diaPago); if (f >= T) break; if (f > d.fechaInicio) vencidasDesde++; [y,m] = sigMes(y,m); }
      const esperado = ((+d.vencidasIni||0) + vencidasDesde) * cuota;
      const pagado = todos.reduce((s,x)=>s+ +x.monto,0);
      let credito = pagado - esperado;
      atrasadoMonto = Math.max(0,-credito);
      if (saldoAct!=null) atrasadoMonto = Math.min(atrasadoMonto, Math.max(0,saldoAct));
      cuotasAtrasadas = Math.ceil(atrasadoMonto/cuota - 1e-9);
      atrasada = atrasadoMonto > 0.5;
      let nd = dueEn(ty,tm,d.diaPago); if (nd < T){ const [a,b] = sigMes(ty,tm); nd = dueEn(a,b,d.diaPago); }
      if (!atrasada && credito >= cuota){ pagadoProx = true; const [a,b] = sigMes(...nd.split('-').slice(0,2).map(Number)); nd = dueEn(a,b,d.diaPago); }
      prox = nd;
    }
    let tmes = 0;
    if (d.tasa) tmes = d.tasaTipo==='EA' ? Math.pow(1+d.tasa/100,1/12)-1 : d.tasa/100;
    const cerrada = saldoAct!=null && saldoAct <= 0.5;
    const fechaCierre = cerrada && pagos.length ? pagos[pagos.length-1].fecha : null;
    const prioridad = d.prioridad || (d.tipo==='obligatoria' ? 'alta' : 'media');
    return { ...d, prioridad, saldoAct, saldoConocido: saldoAct!=null, totalPagado, intereses, pagadoMes, cuotaMes:cuota, prox, atrasada, atrasadoMonto, cuotasAtrasadas, pagadoProx, tmes, interesEst: (saldoAct||0)*tmes, cerrada, fechaCierre, bolsillo: bal['deuda:'+d.id]||0, progreso: saldoAct==null ? 0 : pct(totalPagado, totalPagado+Math.max(0,saldoAct)) };
  });
  const activas = deudas.filter(d=>!d.cerrada);

  // fijos + deudas obligatorias (plan)
  const apartadoEnQ = key => movs.filter(m=>m.tipo==='apartar'&&m.bolsillo===key&&m.fecha>=q.start&&m.fecha<=q.end).reduce((s,m)=>s+ +m.monto,0);
  const vence = dia => { const d1 = `${ty}-${pad(tm)}-${pad(Math.min(dia,lastDay(ty,tm)))}`; return d1; };
  const plan = [
    ...S.fijos.map(f=>{
      const key = 'fijo:'+f.id;
      const pagadoMes = movs.filter(m=>m.tipo==='gasto'&&m.bolsillo===key&&m.fecha.slice(0,7)===mesAct).reduce((s,m)=>s+ +m.monto,0);
      const pagado = pagadoMes >= (+f.monto) - 0.5;
      let prox = vence(+f.diaPago);
      if (pagado){ let y=ty,m=tm+1; if(m>12){m=1;y++;} prox = `${y}-${pad(m)}-${pad(Math.min(+f.diaPago,lastDay(y,m)))}`; }
      return { key, kind:'fijo', ref:f, nombre:f.nombre, monto:+f.monto, dia:+f.diaPago, q15:+f.q15||0, q30:+f.q30||0, pagado, pagadoMes, prox, atrasado: !pagado && T>prox };
    }),
    ...activas.filter(d=>d.tipo==='obligatoria').map(d=>({ key:'deuda:'+d.id, kind:'deuda', ref:d, nombre:d.nombre, monto: +d.cuota || 0, dia:+d.diaPago, q15:+d.q15||0, q30:+d.q30||0, pagado: d.pagadoProx, pagadoMes:0, prox:d.prox, atrasado:d.atrasada, atrasadoMonto:d.atrasadoMonto })),
  ].map(p=>{
    // la parte de esta quincena es para el próximo pago que cae desde el inicio de la quincena;
    // si el pago de este mes ya se hizo y caía dentro de esta quincena, esa parte ya se usó.
    const dueThis = p.dia ? `${ty}-${pad(tm)}-${pad(Math.min(p.dia,lastDay(ty,tm)))}` : null;
    const porcion = (p.pagado && dueThis && dueThis >= q.start) ? 0 : (q.tipo==='15' ? p.q15 : p.q30);
    const enQ = apartadoEnQ(p.key);
    const b0 = bal[p.key]||0;
    const venceEnQ = !!p.prox && p.prox <= q.end;   // si el próximo pago cae antes de la siguiente quincena, toca tener todo ya
    const faltaQ = venceEnQ ? Math.max(0, p.monto-b0) : Math.max(0, porcion-enQ);
    return { ...p, bal: b0, porcion: venceEnQ ? p.monto : porcion, venceEnQ, apartadoQ: enQ, faltaQ, faltaPago: p.pagado ? 0 : Math.max(0, p.monto-b0) };
  }).sort((a,b)=> (a.prox||'9') < (b.prox||'9') ? -1 : 1);

  // fondos
  const basicos = Object.values(grupos).reduce((s,g)=>s+g.porDia*30,0) + S.fijos.reduce((s,f)=>s+(+f.monto||0),0) + activas.filter(d=>d.tipo==='obligatoria').reduce((s,d)=>s+(+d.cuota||0),0);
  const emerg = S.bolsillos.find(b=>b.id==='emergencia');
  const cadena = S.bolsillos.find(b=>b.id==='cadena');
  const emergQ = apartadoEnQ('emergencia');
  const cadenaQ = movs.filter(m=>m.tipo==='cadena'&&m.fecha>=q.start&&m.fecha<=q.end).reduce((s,m)=>s+ +m.monto,0);
  const cadenaActiva = cadena && T <= (cadena.fechaFin||'0000');
  const qParcial = S.creado > q.start; // primera quincena: lo aportado antes va en "lo que llevabas"
  const cadenaPend = cadenaActiva && !qParcial && cadenaQ < cadena.aporte;
  const otrosB = S.bolsillos.filter(b=>!b.sistema).map(b=>({ ...b, bal: bal[b.id]||0, apartadoQ: apartadoEnQ(b.id) }));

  // mes: gastos por categoría
  const enR = (m,a,b) => m.fecha>=a.start && m.fecha<=a.end;
  const porCat = qq => { const r = {}; movs.forEach(m=>{ if (!enR(m,qq)) return; if (m.tipo==='gasto' && !m.previo) r[m.catId]=(r[m.catId]||0)+ +m.monto; if (m.tipo==='reintegro') r[m.catId]=(r[m.catId]||0)- +m.monto; }); return r; };
  const qAnt = quincenaDe(addD(q.start,-1), movs);
  const catMes = porCat(q), catPrev = porCat(qAnt);
  const ingresosMes = movs.filter(m=>m.tipo==='ingreso'&&enR(m,q)&&(catDe('ingreso',m.catId)||{}).real!==false).reduce((s,m)=>s+ +m.monto,0);
  const gastosMes = Object.values(catMes).reduce((s,v)=>s+v,0);
  const pagosMes = movs.filter(m=>m.tipo==='pago'&&!m.previo&&enR(m,q)).reduce((s,m)=>s+ +m.monto,0);

  // cierre de la quincena anterior
  let cierre = null;
  const qPrev = quincenaDe(addD(q.start,-1), movs);
  if (S.creado <= qPrev.end && !S.settings.cierres[qPrev.start]){
    const svp = superv(qPrev); const sob = svp.reduce((s,g)=>s+g.rest,0);
    if (sob > 0) cierre = { q:qPrev, sobrante: sob };
  }

  // metas
  const metas = (S.metas||[]).map(mt=>({ ...mt, bal: bal[mt.id]||0, falta: Math.max(0,(+mt.costo||0)-(bal[mt.id]||0)), lista: (bal[mt.id]||0) >= (+mt.costo||0) && (+mt.costo||0)>0 })).sort((a,b)=>(a.orden||99)-(b.orden||99));
  metas.forEach(mt=>{ const pre = mt.despuesDe && metas.find(x=>x.id===mt.despuesDe); mt.bloqueada = !!(pre && !pre.lista && !pre.cumplida); mt.preNombre = pre ? pre.nombre : ''; });
  // me deben
  const porCobrar = (S.porCobrar||[]).map(pc=>{ const dado = movs.filter(m=>m.tipo==='prestado'&&m.cobrarId===pc.id).reduce((s,m)=>s+ +m.monto,0); const cobrado = movs.filter(m=>m.tipo==='cobro'&&m.cobrarId===pc.id).reduce((s,m)=>s+ +m.monto,0); return { ...pc, dado, cobrado, saldo: dado-cobrado }; });
  // reto de supervivencia
  let reto = null;
  if (S.settings.reto){
    const r = S.settings.reto; const catsR = new Set([...Object.keys(grupos),'antojos']);
    const dias = T>=r.desde ? diffD(r.desde,T)+1 : 0;
    const porSub = {}; let total = 0;
    movs.forEach(m=>{ if (m.fecha<r.desde||m.fecha>T||!catsR.has(m.catId)) return; let v=0; if (m.tipo==='gasto'&&!m.bolsillo&&!m.previo) v=+m.monto; if (m.tipo==='reintegro') v=-m.monto; if (!v) return; total+=v; const k = catNombre(m.catId)+(m.sub?' › '+m.sub:''); porSub[k]=(porSub[k]||0)+v; });
    const prom = dias ? total/dias : 0;
    const top = Object.entries(porSub).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>({ k, v, dia: dias? v/dias : 0 }));
    reto = { ...r, dias, total, prom, top, empezo: dias>0 };
  }

  // alertas
  const alertas = [];
  porCobrar.filter(pc=>pc.saldo>0&&pc.fechaEsperada&&pc.fechaEsperada<T).forEach(pc=> alertas.push({ n:'amarillo', t:`${pc.persona} te iba a pagar el ${fcorta(pc.fechaEsperada)} (${$$(pc.saldo)}).` }));
  metas.filter(mt=>!mt.cumplida&&mt.fechaLimite&&mt.falta>0&&diffD(T,mt.fechaLimite)>=0&&diffD(T,mt.fechaLimite)<=7).forEach(mt=> alertas.push({ n:'amarillo', t:`${mt.nombre} es el ${fcorta(mt.fechaLimite)} y faltan ${$$(mt.falta)} por apartar.` }));
  activas.filter(d=>d.atrasada).forEach(d=> alertas.push({ n:'rojo', t:`${d.nombre}: ${d.cuotasAtrasadas} ${d.cuotasAtrasadas===1?'cuota atrasada':'cuotas atrasadas'} por ${$$(d.atrasadoMonto)}.` }));
  activas.filter(d=>d.tipo!=='obligatoria'&&d.fechaFinal&&d.saldoAct>0).forEach(d=>{ const dd = diffD(T,d.fechaFinal); if (dd<0) alertas.push({ n:'rojo', t:`Quedaste de pagarle a ${d.nombre} el ${fcorta(d.fechaFinal)} (${$$(d.saldoAct)}).` }); else if (dd<=3) alertas.push({ n:'amarillo', t:`${dd===0?'Hoy':dd===1?'Mañana':`En ${dd} días`} le tienes que pagar a ${d.nombre}: ${$$(d.saldoAct)}.` }); });
  plan.filter(p=>p.kind==='fijo'&&p.atrasado).forEach(p=> alertas.push({ n:'rojo', t:`${p.nombre}: vencía el ${fcorta(p.prox)} y no está registrado como pagado.` }));
  if (disponible < 0){
    const hasta = fcorta(addD(q.end,1));
    if (apartado <= 0) alertas.push({ n:'rojo', t:`Lo que tienes (${$$(saldoTotal)}) no alcanza para la supervivencia que queda (${$$(reservado)}). Te faltan ${$$(-disponible)} para llegar al ${hasta}.` });
    else alertas.push({ n:'rojo', t:`Te faltan ${$$(-disponible)}: lo que tienes (${$$(saldoTotal)}) no cubre lo apartado (${$$(apartado)}) más la supervivencia que queda (${$$(reservado)}).` });
  }
  plan.filter(p=>!p.pagado && p.faltaPago>0 && p.prox && diffD(T,p.prox)>=0 && diffD(T,p.prox)<=5).forEach(p=> alertas.push({ n:'amarillo', t:`${p.nombre} se paga el ${fcorta(p.prox)} y faltan ${$$(p.faltaPago)} por apartar.` }));
  sv.filter(g=>g.ahorro+Math.min(0,g.hoyRest)<0).forEach(g=> alertas.push({ n:'amarillo', t:`${g.nombre}: en esta quincena vas ${$$(-(g.ahorro+Math.min(0,g.hoyRest)))} por encima de tu presupuesto diario.` }));
  if (reponer > 0) alertas.push({ n:'amarillo', t:`Sacaste ${$$(reponer)} del fondo de emergencia. Repónlo cuando puedas.` });
  if (cadena && cadena.inicial==null && cadenaActiva) alertas.push({ n:'info', t:'Falta anotar cuánto llevas aportado a la cadena (Plan → Cadena).' });
  if (S.deudas.length===0) alertas.push({ n:'info', t:'Aún no has cargado tus deudas (pestaña Deudas).' });
  if (S.fijos.length===0) alertas.push({ n:'info', t:'Aún no has cargado tus gastos fijos (pestaña Plan).' });

  const meses = basicos>0 ? (bal.emergencia||0)/basicos : 0;
  let estado = 'verde', razon = 'Todo al día.';
  if (alertas.some(a=>a.n==='rojo')) { estado='rojo'; razon = alertas.find(a=>a.n==='rojo').t; }
  else if (meses < 1 || alertas.some(a=>a.n==='amarillo')) { estado='amarillo'; razon = alertas.find(a=>a.n==='amarillo')?.t || `El fondo de emergencia cubre ${meses.toFixed(1).replace('.',',')} meses; la primera meta es 1 mes.`; }

  return { T, movs, saldo, saldoTotal, bal, apartado, q, diasRest, sv, reservado, ahorroSv, disponible, libreDia, deudas, activas, plan, basicos, meses, emerg, cadena, emergQ, cadenaQ, cadenaActiva, cadenaPend, qParcial, otrosB, reponer, catMes, catPrev, qAnt, ingresosMes, gastosMes, pagosMes, cierre, alertas, estado, razon, metas, porCobrar, reto };
}

// ---------- render principal ----------
function render(){
  const app = document.getElementById('app');
  if (!S.settings.onboarded){ app.innerHTML = onboarding(); return; }
  if (bloqueado){ app.innerHTML = pantallaPin('unlock'); return; }
  const C = calcular();
  let body = '';
  if (view==='inicio') body = vInicio(C);
  else if (view==='movs') body = vMovs(C);
  else if (view==='plan') body = vPlan(C);
  else if (view==='deudas') body = vDeudas(C);
  else if (view==='mas') body = vMas(C);
  else if (view==='futuro') body = vFuturo(C);
  const tab = (id,l) => `<button class="${view===id?'on':''}" data-a="nav" data-v="${id}">${IC[id]}<span>${l}</span></button>`;
  app.innerHTML = body + `<nav class="bot">${tab('inicio','Inicio')}${tab('movs','Movs')}<button class="add" data-a="nuevo" aria-label="Registrar movimiento">${IC.add}</button>${tab('plan','Plan')}${tab('futuro','Futuro')}${tab('deudas','Deudas')}</nav>`;

  const proxDev = dFlex.filter(d=>d.fechaFinal).sort((a,b)=>a.fechaFinal<b.fechaFinal?-1:1)[0];

  return `

    ${C.cierre ? `<div class="card soft"><b>Cerró la ${quincenaNombre(C.cierre.q)}</b><div class="small muted" style="margin:4px 0 10px">Te sobraron ${$$(C.cierre.sobrante)} de supervivencia. ¿A dónde los mandas?</div><div class="chips"><button class="btn sm pri" data-a="cierre" data-d="emergencia">Al fondo de emergencia</button>${C.otrosB.map(b=>`<button class="btn sm" data-a="cierre" data-d="${b.id}">A ${esc(b.nombre)}</button>`).join('')}<button class="btn sm" data-a="cierre" data-d="">Dejarlos libres</button></div></div>` : ''}
    ${sinBackup ? `<div class="card soft row"><span class="small">${S.settings.lastBackup ? `Tu último respaldo fue hace ${diffD(S.settings.lastBackup,C.T)} días.` : 'Aún no has hecho ningún respaldo.'}</span><button class="btn sm pri" data-a="backup">Respaldar</button></div>` : ''}
    <div class="card">
      <div class="small muted">Disponible libre</div>
      <div class="big ${C.disponible<0?'neg':''}">${$$(C.disponible)}</div>

      <div class="grid2" style="margin-top:12px">
        <div class="kpi"><div class="l">Saldo real</div><div class="v">${$$(C.saldoTotal)}</div></div>
        <div class="kpi"><div class="l">Apartado + supervivencia</div><div class="v">${$$(C.apartado+C.reservado)}</div></div>
      </div>
    </div>
    <div class="card">
      <div class="row"><div class="col"><h2>${quincenaNombre(q)}</h2><span class="small muted">${fcorta(q.start)} – ${fcorta(q.end)} · quedan ${C.diasRest} ${C.diasRest===1?'día':'días'}</span></div><button class="btn sm pri" data-a="repartir">Repartir</button></div>

    </div>
    <div class="grid2">
      <div class="card" style="margin:0;cursor:pointer" data-a="nav" data-v="deudas"><div class="small muted">Con cuota (bancos)</div><div class="mid">${$$(dOblig.reduce((s,d)=>s+Math.max(0,d.saldoAct||0),0))}</div><div class="tiny faint">${vencidoDeuda?`<span class="neg">vencido ${$$(vencidoDeuda)}</span> · `:''}${dOblig.length} ${dOblig.length===1?'deuda':'deudas'}${dOblig.some(d=>!d.saldoConocido)?` (${dOblig.filter(d=>!d.saldoConocido).length} sin saldo)`:''}${proxDeuda?` · próxima ${fcorta(proxDeuda.prox)}`:''}</div></div>
      <div class="card" style="margin:0;cursor:pointer" data-a="nav" data-v="deudas"><div class="small muted">De palabra</div><div class="mid">${$$(dFlex.reduce((s,d)=>s+Math.max(0,d.saldoAct||0),0))}</div><div class="tiny faint">${dFlex.length} ${dFlex.length===1?'persona':'personas'}${proxDev?` · devolver ${fcorta(proxDev.fechaFinal)} (${esc(proxDev.nombre)})`:''}${C.porCobrar.some(pc=>pc.saldo>0)?`<br><span class="pos">Te deben ${$$(C.porCobrar.reduce((s,pc)=>s+Math.max(0,pc.saldo),0))}</span>`:''}</div></div>
    </div>
    <div class="grid2" style="margin-top:10px">
      <div class="card" style="margin:0"><div class="small muted">Fondo de emergencia</div><div class="mid">${$$(C.bal.emergencia||0)}</div><div class="tiny faint">${C.basicos>0?`cubre ${C.meses.toFixed(1).replace('.',',')} meses`:'carga tus fijos para calcular'}</div></div>

    ${C.alertas.length ? `<div class="card"><h2>Alertas</h2>${C.alertas.map(a=>`<div class="alert"><b class="${a.n==='rojo'?'neg':a.n==='amarillo'?'warn':'faint'}">${a.n==='rojo'?'✕':a.n==='amarillo'?'!':'i'}</b><span>${esc(a.t)}</span></div>`).join('')}</div>` : ''}
    <div class="card">

      <div class="catbars">${cats.length ? cats.map(([id,v])=>{ const p = C.catPrev[id]||0; const dlt = p ? Math.round((v-p)/p*100) : null; return `<div class="r"><div class="row"><span>${esc(catNombre(id))}</span><span><b>${$$(v)}</b>${dlt!==null?` <span class="tiny ${dlt>0?'warn':'faint'}">${dlt>0?'+':''}${dlt}% vs quincena anterior</span>`:''}</span></div><div class="bar"><i style="width:${pct(v,maxCat)}%"></i></div></div>`; }).join('') : '<div class="empty">Aún no hay gastos en esta quincena.</div>'}</div>
    </div>
    <div class="card">
      <h2>Cuentas</h2>
      ${S.cuentas.map(c=>`<div class="row" style="margin-top:10px"><span>${esc(c.nombre)}</span><b>${$$(C.saldo[c.id])}</b></div>`).join('')}
    </div>
  </div>`;
}
function quincenaNombre(q){ return `Quincena del ${q.tipo}`; }
function svRow(g,C){
  const neto = g.ahorro + Math.min(0,g.hoyRest);
  return `<div style="margin-top:10px"><div class="row"><span class="col"><span>${esc(g.nombre)}</span><span class="tiny faint">${$$(g.porDia)}/día</span></span><span class="col" style="align-items:flex-end"><b class="${g.hoyRest<0?'neg':''}">${$$(g.hoyRest)}</b><span class="tiny faint">${g.hoyRest<0?'te pasaste hoy':'te quedan hoy'}</span></span></div><div class="bar ${g.hoyRest<0?'over':''}"><i style="width:${g.hoyRest<0?100:pct(g.hoyRest,g.porDia)}%"></i></div><div class="tiny faint" style="margin-top:3px">Hoy gastaste ${$$(g.gastHoy)}${neto!==0?` · en la quincena vas <b class="${neto>0?'pos':'neg'}">${neto>0?'ahorrando ':'pasado '}${$$(Math.abs(neto))}</b>`:''}</div></div>`;
}

// ---------- MOVIMIENTOS ----------
function descMov(m){
  switch(m.tipo){
    case 'gasto': case 'ingreso': case 'reintegro': return `${catNombre(m.catId)}${m.sub?' › '+m.sub:''}`;
    case 'pago': return `Pago · ${(S.deudas.find(d=>d.id===m.deudaId)||{}).nombre||'deuda'}`;
    case 'apartar': return `Apartado · ${bolsilloNombre(m.bolsillo)}`;
    case 'sacar': return `Sacado · ${bolsilloNombre(m.bolsillo)}`;
    case 'prestamo': return `Préstamo de ${m.acreedor||''}`;
    case 'transfer': return `${cuentaNombre(m.cuentaId)} → ${cuentaNombre(m.cuentaDestinoId)}`;
    case 'cadena': return 'Aporte a cadena';
    case 'prestado': return `Le prestaste a ${(S.porCobrar.find(p=>p.id===m.cobrarId)||{}).persona||''}`;
    case 'cobro': return `${(S.porCobrar.find(p=>p.id===m.cobrarId)||{}).persona||''} te pagó`;
  }
  return m.tipo;
}
function signoMov(m){ if (m.previo) return 0; return ({ingreso:1,prestamo:1,reintegro:1,cobro:1,gasto:-1,pago:-1,cadena:-1,prestado:-1})[m.tipo]||0; }
function bolsilloNombre(k){
  if (!k) return '';
  if (k.startsWith('fijo:')) return (S.fijos.find(f=>'fijo:'+f.id===k)||{}).nombre||'fijo';
  if (k.startsWith('deuda:')) return (S.deudas.find(d=>'deuda:'+d.id===k)||{}).nombre||'deuda';
  const mt = (S.metas||[]).find(x=>x.id===k); if (mt) return mt.nombre;
  return (S.bolsillos.find(b=>b.id===k)||{}).nombre||k;
}
function vMovs(C){
  if (!movMes) movMes = C.T.slice(0,7);
  const [y,m] = movMes.split('-').map(Number);
  let list = C.movs.filter(x=>x.fecha.slice(0,7)===movMes);
  if (movFiltro.tipo) list = list.filter(x=>x.tipo===movFiltro.tipo);
  if (movFiltro.cat) list = list.filter(x=>x.catId===movFiltro.cat);
  if (movFiltro.cuenta) list = list.filter(x=>x.cuentaId===movFiltro.cuenta||x.cuentaDestinoId===movFiltro.cuenta);
  list = list.slice().reverse();
  const porDia = {}; list.forEach(x=>(porDia[x.fecha]=porDia[x.fecha]||[]).push(x));
  const cats = [...S.categorias.gasto, ...S.categorias.ingreso];
  return `
  <div class="top"><h1>Movimientos</h1><span></span></div>
  <div class="wrap">
    <div class="row"><button class="btn sm" data-a="mes" data-d="-1">‹</button><b>${MESES_L[m-1]} ${y}</b><button class="btn sm" data-a="mes" data-d="1">›</button></div>
    <div class="grid2" style="margin-top:10px;grid-template-columns:1fr 1fr 1fr">
      <select class="i" data-a-change="filtro" data-k="tipo"><option value="">Tipo</option>${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}" ${movFiltro.tipo===k?'selected':''}>${v.l}</option>`).join('')}</select>
      <select class="i" data-a-change="filtro" data-k="cat"><option value="">Categoría</option>${cats.map(c=>`<option value="${c.id}" ${movFiltro.cat===c.id?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select>
      <select class="i" data-a-change="filtro" data-k="cuenta"><option value="">Cuenta</option>${S.cuentas.map(c=>`<option value="${c.id}" ${movFiltro.cuenta===c.id?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select>
    </div>
    <div class="list">
    ${Object.keys(porDia).length ? Object.entries(porDia).map(([f,xs])=>`<div class="day">${flarga(f)}</div>${xs.map(x=>{ const s = signoMov(x); return `<div class="it" data-a="editar" data-id="${x.id}"><span class="dot" style="background:${s>0?'var(--pos)':s<0?'var(--neg)':'var(--faint)'}"></span><div class="grow"><div class="t">${esc(descMov(x))}</div><div class="tiny faint t">${x.previo?'Pagado antes de usar la app · no afecta el saldo':TIPOS[x.tipo].l}${x.cuentaId&&x.tipo!=='transfer'?' · '+esc(cuentaNombre(x.cuentaId)):''}${x.nota?' · '+esc(x.nota):''}</div></div><b class="${s>0?'pos':''}">${s>0?'+':s<0?'−':''}${$$(x.monto)}</b></div>`; }).join('')}`).join('') : '<div class="empty" style="padding:20px 0">No hay movimientos con estos filtros.</div>'}
    </div>
  </div>`;
}

  <div class="wrap">
    <div class="card">
      <div class="row"><h2>Supervivencia diaria</h2><button class="link small" data-a="editSuperv">Editar</button></div>
      <div class="small muted" style="margin-top:4px">Se aparta primero, cada quincena: ${$$(C.sv.reduce((s,g)=>s+g.porDia,0))} por día × ${C.sv[0]?C.sv[0].dias:q.dias} días = <b style="color:var(--text)">${$$(C.sv.reduce((s,g)=>s+g.pres,0))}</b>.${C.sv[0]&&C.sv[0].dias<q.dias?' <span class="tiny faint">(empezaste a mitad de quincena; se cuenta desde ese día)</span>':''}</div>

      ${C.plan.length ? C.plan.map(p=>`<div class="it" style="padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer" data-a="${p.kind==='fijo'?'fijo':'deudaEdit'}" data-id="${p.ref.id}">
        <div class="row"><div class="col"><span>${esc(p.nombre)} ${p.kind==='deuda'?'<span class="badge">cuota</span>':''}</span><span class="tiny faint">${$$(p.monto)} · día ${p.dia||'—'} · esta quincena: ${$$(p.porcion)}${p.apartadoQ?` (apartado ${$$(p.apartadoQ)})`:''}</span></div>${p.pagado?'<span class="badge ok">Pagado</span>':p.atrasado?'<span class="badge bad">Atrasado</span>':`<span class="small"><b>${$$(p.bal)}</b><span class="faint"> / ${$$(p.monto)}</span></span>`}</div>
        ${p.pagado?'':`<div class="bar"><i style="width:${pct(p.bal,p.monto)}%"></i></div>${p.kind==='fijo'?`<div class="row" style="margin-top:8px"><span></span><button class="btn sm" data-a="yaPague" data-key="${p.key}">Ya lo pagué este mes</button></div>`:''}`}
      </div>`).join('') : '<div class="empty" style="margin-top:8px">Agrega tu arriendo, internet, celular y demás fijos. Las deudas obligatorias (cuota mensual fija) aparecen aquí solas.</div>'}
    </div>
    <div class="card">
      <div class="row"><h2>Fondo de emergencia</h2><button class="link small" data-a="bolsillo" data-id="emergencia">Editar</button></div>
      <div class="row" style="margin-top:8px"><span class="mid">${$$(C.bal.emergencia||0)}</span><span class="small muted">${C.basicos>0?`cubre ${C.meses.toFixed(1).replace('.',',')} de 6 meses`:''}</span></div>
      ${C.basicos>0?`<div class="bar"><i style="width:${pct(C.meses,6)}%"></i></div><div class="tiny faint" style="margin-top:4px">1 mes = ${$$(C.basicos)} (supervivencia + fijos + cuotas). Etapas: 1 → 3 → 6 meses.</div>`:''}
      <div class="small muted" style="margin-top:8px">Aporte mínimo: ${$$(e.aporte)} por quincena · esta quincena: ${$$(C.emergQ)}</div>
      ${C.reponer>0?`<div class="small warn" style="margin-top:6px">Pendiente reponer ${$$(C.reponer)}.</div>`:''}
    </div>
    ${cad ? `<div class="card">
      <div class="row"><h2>Cadena</h2><button class="link small" data-a="bolsillo" data-id="cadena">Editar</button></div>
      <div class="small muted" style="margin-top:6px">${$$(cad.aporte)} cada quincena hasta el ${fcorta(cad.fechaFin)}. Recibes ${$$(cad.recibes)} el ${fcorta(cad.fechaEntrega)}.</div>
      <div class="row" style="margin-top:8px"><span>Llevas aportado</span><b>${cad.inicial==null?'<span class="warn">Por anotar</span>':$$(C.bal.cadena||0)}</b></div>
      ${C.cadenaActiva?`<div class="row" style="margin-top:6px"><span class="small">Esta quincena</span>${C.cadenaPend?`<button class="btn sm" data-a="nuevo" data-tipo="cadena">Registrar aporte</button>`:C.qParcial&&C.cadenaQ<cad.aporte?'<span class="tiny faint">Va en lo que llevabas aportado</span>':'<span class="badge ok">Aportado</span>'}</div>`:''}

    <div class="card">

      ${C.otrosB.length ? C.otrosB.map(b=>`<div class="row" style="margin-top:10px;cursor:pointer" data-a="bolsillo" data-id="${b.id}"><div class="col"><span>${esc(b.nombre)}</span><span class="tiny faint">${b.aporte?`${$$(b.aporte)} por quincena`:'sin aporte fijo'}${b.objetivo?` · objetivo ${$$(b.objetivo)}`:''}</span></div><b>${$$(b.bal)}</b></div>`).join('') : ''}

// ---------- DEUDAS ----------
function vDeudas(C){
  const act = C.activas.slice().sort((a,b)=> (b.atrasada-a.atrasada) || ((a.prox||'9')<(b.prox||'9')?-1:1));
  const cerr = C.deudas.filter(d=>d.cerrada);
  const conTasa = act.filter(d=>d.tmes>0).sort((a,b)=>b.tmes-a.tmes);
  const total = act.reduce((s,d)=>s+Math.max(0,d.saldoAct||0),0);
  const sinSaldo = act.filter(d=>!d.saldoConocido).length;
  const vencido = act.reduce((s,d)=>s+(d.atrasadoMonto||0),0);
  return `
  <div class="top"><div><h1>Deudas</h1><div class="sub">Total ${$$(total)}${sinSaldo?` + ${sinSaldo} sin saldo`:''}${vencido?` · <span class="neg">vencido ${$$(vencido)}</span>`:''}</div></div><button class="btn sm pri" data-a="deudaEdit">+ Deuda</button></div>
  <div class="wrap">
    ${conTasa.length ? `<div class="card soft small">Si te sobra plata para abonar extra, empieza por <b>${esc(conTasa[0].nombre)}</b>: es la de tasa más alta (${(conTasa[0].tmes*100).toFixed(2).replace('.',',')} % mensual).</div>`:''}
    ${act.length ? [['obligatoria','Con cuota fija (bancos y entidades)'],['flexible','De palabra (personas, sin cuota fija)']].map(([tp,tit])=>{ const grp = act.filter(d=>(d.tipo==='obligatoria')===(tp==='obligatoria')); if (!grp.length) return ''; const sub = grp.reduce((s,d)=>s+Math.max(0,d.saldoAct||0),0); return `<div class="row" style="margin:16px 0 4px"><h3>${tit}</h3><span class="small"><b>${$$(sub)}</b>${grp.some(d=>!d.saldoConocido)?' <span class="tiny faint">+ sin saldo</span>':''}</span></div>` + grp.map(d=>`<div class="card">
      <div class="row"><div class="col"><h2>${esc(d.nombre)}</h2><span class="tiny faint">${esc(d.acreedor||'')}${d.acreedor?' · ':''}${d.tipo==='obligatoria'?'Obligatoria mensual':'Flexible'} · prioridad <b class="${d.prioridad==='alta'?'neg':d.prioridad==='media'?'warn':''}">${d.prioridad}</b></span></div>${d.atrasada?'<span class="badge bad">Atrasada</span>':d.tipo==='obligatoria'&&d.prox?'<span class="badge ok">Al día</span>':d.fechaFinal?(d.fechaFinal<C.T?'<span class="badge bad">Vencida</span>':`<span class="badge w">Devolver ${fcorta(d.fechaFinal)}</span>`):'<span class="badge">Sin fecha</span>'}</div>
      <div class="row" style="margin-top:10px"><span class="mid">${d.saldoConocido?$$(d.saldoAct):'<span class="warn" style="font-size:16px">Saldo por confirmar</span>'}</span><span class="small muted">pagado ${$$(d.totalPagado)}</span></div>
      ${d.saldoConocido?`<div class="bar"><i style="width:${d.progreso}%"></i></div>`:''}
      <table class="t" style="margin-top:8px">
        ${d.atrasada?`<tr><td class="neg">Atrasado</td><td class="neg">${$$(d.atrasadoMonto)} (${d.cuotasAtrasadas} ${d.cuotasAtrasadas===1?'cuota':'cuotas'})</td></tr>`:''}${d.tipo==='obligatoria'?`<tr><td>Cuota</td><td>${$$(d.cuota)} · día ${d.diaPago}</td></tr><tr><td>Próximo pago</td><td>${d.prox?fcorta(d.prox):'—'}</td></tr><tr><td>Apartado</td><td>${$$(d.bolsillo)}</td></tr>`:`<tr><td>Apartado para pagarla</td><td>${$$(d.bolsillo)} de ${$$(d.saldoAct)}</td></tr>`}
        ${d.tmes>0?`<tr><td>Interés estimado del mes</td><td>≈ ${$$(d.interesEst)}</td></tr>`:''}
        ${d.intereses>0?`<tr><td>Intereses y costos pagados</td><td>${$$(d.intereses)}</td></tr>`:''}
        ${d.fechaFinal?`<tr><td>${d.tipo==='obligatoria'?'Fecha final':'Devolver a más tardar'}</td><td class="${d.tipo!=='obligatoria'&&d.fechaFinal<C.T?'neg':''}">${fcorta(d.fechaFinal)}</td></tr>`:''}
      </table>
      ${d.notas?`<div class="tiny faint" style="margin-top:6px">${esc(d.notas)}</div>`:''}
      <div class="chips" style="margin-top:10px"><button class="btn sm pri" data-a="nuevo" data-tipo="pago" data-deuda="${d.id}">Pagar</button><button class="btn sm" data-a="nuevo" data-tipo="apartar" data-bolsillo="deuda:${d.id}">Apartar</button><button class="btn sm" data-a="extracto" data-id="${d.id}">${d.saldoConocido?'Actualizar con extracto':'Poner saldo del extracto'}</button><button class="btn sm" data-a="deudaEdit" data-id="${d.id}">Editar</button></div>
    </div>`).join(''); }).join('') : `<div class="card empty">No tienes deudas activas cargadas. Usa “+ Deuda” para agregarlas con el saldo de tu último extracto.</div>`}

let obPaso = 0, pinBuf = '', pinPrimero = '', pinModo = 'unlock', pinMsg = '';
function onboarding(){
  if (obPaso===0) return `<div class="lock"><h1 style="font-size:26px">Vida Financiera</h1><p class="muted" style="text-align:center;max-width:320px">Anotas en un solo lugar y lo demás se calcula solo: supervivencia, fijos, deudas y lo que puedes gastar. Tus datos se quedan en este celular.</p><button class="btn pri" data-a="ob" data-d="1">Empezar</button><button class="link small" data-a="restore">Tengo un respaldo</button><input type="file" id="fileRestore" accept=".json,application/json" style="display:none"></div>`;
  if (obPaso===1) return pantallaPin('crear');
  if (obPaso===2) return `<div class="wrap"><div class="top" style="padding-left:0"><h1>Saldos de hoy</h1></div><p class="small muted">Escribe cuánto tienes hoy en cada cuenta, antes de anotar cualquier movimiento. Si no usas alguna, pon 0. Luego puedes agregar o renombrar cuentas.</p>${S.cuentas.map(c=>`<label class="f">${esc(c.nombre)}</label><input class="i money" style="font-size:20px" inputmode="numeric" data-money id="ob-${c.id}" placeholder="$0">`).join('')}<div class="hint" id="obErr"></div><button class="btn pri block" style="margin-top:18px" data-a="obSaldos">Guardar y entrar</button></div>`;
  return '';
}
function pantallaPin(modo){
  pinModo = modo;
  const titulo = { unlock:'Ingresa tu PIN', crear: pinPrimero?'Repite tu PIN':'Crea un PIN de 4 a 6 dígitos', actual:'PIN actual', nuevo: pinPrimero?'Repite el nuevo PIN':'Nuevo PIN (4 a 6 dígitos)' }[modo];
  const n = Math.max(4, pinBuf.length);
  const puedeOk = modo!=='unlock' && pinBuf.length>=4;
  return `<div class="lock"><h2>${titulo}</h2><div class="pins" id="pins">${Array.from({length: modo==='unlock'?Math.max(4,pinBuf.length):6},(_,i)=>`<i class="${i<pinBuf.length?'f':''}"></i>`).join('')}</div><div class="small ${pinMsg?'neg':'faint'}" style="min-height:20px">${esc(pinMsg)}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(k=>`<button data-a="pk" data-k="${k}">${k}</button>`).join('')}<button class="ghost" data-a="pk" data-k="del">Borrar</button><button data-a="pk" data-k="0">0</button><button class="ghost" data-a="pk" data-k="ok" ${modo==='unlock'||puedeOk?'':'disabled'}>OK</button></div>
  ${modo==='nuevo'||modo==='actual'?'<button class="link small" data-a="pinCancel">Cancelar</button>':''}</div>`;
}
async function hashPin(pin, salt){ const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt+':'+pin)); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function pinTecla(k){
  pinMsg = '';
  if (k==='del'){ pinBuf = pinBuf.slice(0,-1); return rerenderPin(); }
  if (k==='ok') return pinOk();
  if (pinBuf.length>=6) return;
  pinBuf += k;
  if (pinModo==='unlock' && pinBuf.length>=4){
    const h = await hashPin(pinBuf, S.settings.salt);
    if (h===S.settings.pinHash){ bloqueado = false; pinBuf=''; render(); return; }
    if (pinBuf.length===6){ pinMsg='PIN incorrecto'; pinBuf=''; rerenderPin(true); return; }
  }
  if (pinModo==='actual' && pinBuf.length>=4){
    const h = await hashPin(pinBuf, S.settings.salt);
    if (h===S.settings.pinHash){ pinBuf=''; pinPrimero=''; pinModo='nuevo'; return rerenderPin(); }
    if (pinBuf.length===6){ pinMsg='PIN incorrecto'; pinBuf=''; return rerenderPin(true); }
  }
  rerenderPin();
}
async function pinOk(){
  if (pinModo==='unlock'){ const h = await hashPin(pinBuf, S.settings.salt); if (h===S.settings.pinHash){ bloqueado=false; pinBuf=''; render(); } else { pinMsg='PIN incorrecto'; pinBuf=''; rerenderPin(true);} return; }
  if (pinModo==='actual'){ const h = await hashPin(pinBuf, S.settings.salt); pinBuf=''; if (h===S.settings.pinHash){ pinPrimero=''; pinModo='nuevo'; } else pinMsg='PIN incorrecto'; return rerenderPin(!!pinMsg); }
  if (pinBuf.length<4) return;
  if (!pinPrimero){ pinPrimero = pinBuf; pinBuf=''; return rerenderPin(); }
  if (pinPrimero!==pinBuf){ pinMsg='No coinciden. Empieza de nuevo.'; pinPrimero=''; pinBuf=''; return rerenderPin(true); }
  S.settings.salt = uid(); S.settings.pinHash = await hashPin(pinBuf, S.settings.salt);
  pinBuf=''; pinPrimero='';
  await guardar();
  if (!S.settings.onboarded){ obPaso = 2; render(); return; }
  cerrarSheet(); toast('PIN cambiado'); render();
}
function rerenderPin(shake){
  const target = document.getElementById('sheet').classList.contains('hidden') ? document.getElementById('app') : document.getElementById('sheet');
  target.innerHTML = pantallaPin(pinModo);
  if (shake){ const p = target.querySelector('#pins'); p && p.classList.add('shake'); }
}

function opcionesBolsillo(C, incluirFlex=true){
  const o = [];
  C.plan.filter(p=>incluirFlex || p.kind==='fijo').forEach(p=>o.push({ v:p.key, l:`${p.nombre} (${$$(p.bal)})` }));
  if (incluirFlex) C.activas.filter(d=>d.tipo!=='obligatoria').forEach(d=>o.push({ v:'deuda:'+d.id, l:`Para pagar ${d.nombre} (${$$(d.bolsillo)})` }));
  o.push({ v:'emergencia', l:`Fondo de emergencia (${$$(C.bal.emergencia||0)})` });
  C.otrosB.forEach(b=>o.push({ v:b.id, l:`${b.nombre} (${$$(b.bal)})` }));
  C.metas.filter(mt=>!mt.cumplida).forEach(mt=>o.push({ v:mt.id, l:`Meta: ${mt.nombre} (${$$(mt.bal)})` }));
  return o;
}

function leerForm(){
  const g = id => document.getElementById(id);
  if (g('fMonto')) F.monto = String(num(g('fMonto').value));
  if (g('fFecha')) F.fecha = g('fFecha').value || hoy();
  if (g('fNota')) F.nota = g('fNota').value.trim();
  if (g('fBolsillo')) F.bolsillo = g('fBolsillo').value;
  if (g('fAcreedor')) F.acreedor = g('fAcreedor').value.trim();
  if (g('fCuota')) F.cuota = String(num(g('fCuota').value));
  if (g('fDia')) F.dia = g('fDia').value.replace(/[^\d]/g,'');
  if (g('fDevolver')) F.devolver = g('fDevolver').value;
  if (g('fPersona')) F.persona = g('fPersona').value.trim();
  if (g('fEsperada')) F.esperada = g('fEsperada').value;
}
function autoBolsillo(){
  if (F.tipo!=='gasto' || F.bolsilloManual) return;
  const f = S.fijos.find(x=>x.catId===F.catId && x.sub && x.sub===F.sub);
  F.bolsillo = f ? 'fijo:'+f.id : '';
}
async function guardarForm(){
  leerForm();
  const err = m => { const e = document.getElementById('fErr'); if (e) e.textContent = m; };
  const monto = num(F.monto);
  if (!monto) return err('Escribe el monto.');
  const t = F.tipo;
  if ((t==='gasto'||t==='ingreso'||t==='reintegro') && !F.catId) return err('Escoge la categoría.');
  if ((t==='gasto'||t==='ingreso'||t==='reintegro'||t==='pago'||t==='prestamo'||t==='cadena'||t==='transfer'||t==='prestado'||t==='cobro') && !F.cuentaId) return err('Escoge la cuenta.');
  if (t==='prestado' && !F.persona) return err('Escribe a quién le prestaste.');
  if (t==='cobro' && !F.cobrarId) return err('Escoge quién te pagó.');
  if (t==='pago' && !F.deudaId) return err('Escoge la deuda.');
  if ((t==='apartar'||t==='sacar') && !F.bolsillo) return err('Escoge el bolsillo.');
  if (t==='sacar' && !F.nota) return err('Escribe el motivo.');
  if (t==='transfer' && F.cuentaId===F.cuentaDestinoId) return err('Las cuentas deben ser distintas.');
  if (t==='prestamo' && !F.acreedor) return err('Escribe quién te prestó.');
  if (t==='prestamo' && F.dtipo==='obligatoria' && (!num(F.cuota) || !num(F.dia) || num(F.dia)>31)) return err('Escribe la cuota y el día de pago (1 a 31).');
  if (t==='sacar'){ const C = calcular(); const disp = C.bal[F.bolsillo]||0; const previo = F.editId ? (+(S.movs.find(m=>m.id===F.editId)||{}).monto||0) : 0; if (monto > disp + previo) return err(`Ese bolsillo solo tiene ${$$(disp+previo)}.`); }

  const m = F.editId ? S.movs.find(x=>x.id===F.editId) : { id:uid(), creado:Date.now() };
  Object.assign(m, { tipo:t, monto, fecha:F.fecha, nota:F.nota });
  ['catId','sub','cuentaId','cuentaDestinoId','deudaId','bolsillo','acreedor','cobrarId'].forEach(k=>delete m[k]);
  if (t==='prestado'){
    m.cuentaId=F.cuentaId; let pc = S.porCobrar.find(x=>norm(x.persona)===norm(F.persona));
    if (!pc){ pc = { id:'pc_'+uid(), persona:F.persona }; S.porCobrar.push(pc); }
    if (F.esperada) pc.fechaEsperada = F.esperada;
    m.cobrarId = pc.id;
  }
  if (t==='cobro'){ m.cuentaId=F.cuentaId; m.cobrarId=F.cobrarId; }
  if (t==='gasto'||t==='ingreso'||t==='reintegro'){ m.catId=F.catId; if (F.sub) m.sub=F.sub; m.cuentaId=F.cuentaId; if (t==='gasto' && F.bolsillo) m.bolsillo=F.bolsillo; }
  if (t==='pago'){ m.deudaId=F.deudaId; m.cuentaId=F.cuentaId; m.bolsillo='deuda:'+F.deudaId; }
  if (t==='apartar'||t==='sacar'){ m.bolsillo=F.bolsillo; }
  if (t==='cadena'){ m.cuentaId=F.cuentaId; }
  if (t==='transfer'){ m.cuentaId=F.cuentaId; m.cuentaDestinoId=F.cuentaDestinoId; }
  if (t==='prestamo'){
    m.cuentaId=F.cuentaId; m.acreedor=F.acreedor;
    let d = S.deudas.find(x=>x.origenMov===m.id);
    const sumado = m.deudaId && S.deudas.find(x=>x.id===m.deudaId && x.origenMov!==m.id);
    const existe = !F.editId && S.deudas.find(x=>x.tipo==='flexible' && norm(x.acreedor)===norm(F.acreedor));
    if (sumado || (!d && existe)){ m.deudaId = (sumado||existe).id; if (F.devolver) (sumado||existe).fechaFinal = F.devolver; if (!F.editId) S.movs.push(m); await guardar(); cerrarSheet(); toast(F.editId?'Cambios guardados':`Sumado a lo que le debes a ${(sumado||existe).acreedor}`); render(); return; }
    if (!d){ d = { id:uid(), origenMov:m.id, ajustes:[], notas:'Creada desde un préstamo recibido.' }; S.deudas.push(d); }
    const cuota = num(F.cuota);
    if (F.devolver) d.fechaFinal = F.devolver;
    Object.assign(d, { nombre:F.acreedor, acreedor:F.acreedor, saldoInicial:monto, fechaInicio:F.fecha, creado:m.creado, tipo:F.dtipo, cuota: F.dtipo==='obligatoria'?cuota:0, diaPago: F.dtipo==='obligatoria'?num(F.dia):0, q15: Math.floor(cuota/2), q30: cuota-Math.floor(cuota/2) });
    m.deudaId = d.id;
  }
  if (!F.editId) S.movs.push(m);
  await guardar(); cerrarSheet(); toast(F.editId?'Cambios guardados':'Guardado'); render();
}
async function borrarMov(){
  const m = S.movs.find(x=>x.id===F.editId); if (!m) return;
  if (m.tipo==='prestamo'){
    const d = S.deudas.find(x=>x.origenMov===m.id);
    if (d && S.movs.some(x=>x.tipo==='prestamo'&&x.deudaId===d.id&&x.id!==m.id)) { document.getElementById('fErr').textContent='A esta deuda se le sumaron otros préstamos. Borra primero esos.'; return; }
    if (d && S.movs.some(x=>x.tipo==='pago'&&x.deudaId===d.id)) { document.getElementById('fErr').textContent='Esta deuda ya tiene pagos. Borra primero los pagos.'; return; }
    if (d && !confirm('Se borra el préstamo y la deuda que creó. ¿Seguro?')) return;
    if (!d && !confirm('¿Eliminar este préstamo? Se resta de lo que le debes.')) return;
    if (d) S.deudas = S.deudas.filter(x=>x!==d);
  } else if (!confirm('¿Eliminar este movimiento?')) return;
  S.movs = S.movs.filter(x=>x!==m);
  await guardar(); cerrarSheet(); toast('Eliminado'); render();
}

// ----- repartir quincena -----
let R = null;
function abrirRepartir(){
  const C = calcular();
  const items = [];
  C.plan.filter(p=>p.faltaQ>0 && !p.pagado).forEach(p=>items.push({ key:p.key, nombre:p.nombre, monto:p.faltaQ, tipo:'apartar', on:true, det:`le toca ${$$(p.porcion)} esta quincena` }));
  C.plan.filter(p=>p.pagado && p.faltaQ>0).forEach(p=>items.push({ key:p.key, nombre:p.nombre, monto:p.faltaQ, tipo:'apartar', on:true, det:'para el pago del próximo mes' }));
  C.activas.filter(d=>d.atrasada).sort((a,b)=>prioN(a.prioridad)-prioN(b.prioridad)||b.tmes-a.tmes).forEach(d=>{ const f = Math.max(0, d.atrasadoMonto - d.bolsillo); if (f>0) items.push({ key:'deuda:'+d.id, nombre:`Ponerte al día: ${d.nombre}`, monto:f, tipo:'apartar', on:false, det:`${d.cuotasAtrasadas} ${d.cuotasAtrasadas===1?'cuota vencida':'cuotas vencidas'} · márcalo si te alcanza` }); });
  const em = Math.max(0, C.emerg.aporte - C.emergQ);
  if (em>0) items.push({ key:'emergencia', nombre:'Fondo de emergencia', monto:em, tipo:'apartar', on:true, det:'aporte mínimo' });
  C.otrosB.forEach(b=>{ const f = Math.max(0,(+b.aporte||0)-b.apartadoQ); if (f>0) items.push({ key:b.id, nombre:b.nombre, monto:f, tipo:'apartar', on:true, det:'aporte por quincena' }); });
  C.metas.filter(mt=>!mt.cumplida&&mt.fechaLimite&&mt.fechaLimite>=C.T&&mt.falta>0&&mt.fechaLimite<=addD(C.q.end,16)).forEach(mt=> items.push({ key:mt.id, nombre:mt.nombre, monto:mt.falta, tipo:'apartar', on:true, det:`es el ${fcorta(mt.fechaLimite)}` }));
  const sigMeta = C.metas.filter(mt=>!mt.cumplida&&!mt.fechaLimite&&!mt.bloqueada&&mt.falta>0)[0];
  if (sigMeta) items.push({ key:sigMeta.id, nombre:`Meta: ${sigMeta.nombre}`, monto:0, tipo:'apartar', on:false, det:'pon lo que te sobre, si te sobra', meta:true });
  if (C.cadena && C.cadenaPend) items.push({ key:'cadena', nombre:'Aporte a la cadena', monto:C.cadena.aporte-C.cadenaQ, tipo:'cadena', on:true, det:'sale plata real', cuentaId:S.cuentas[0]?.id });
  R = { items };
  renderRepartir();
}
function renderRepartir(){
  const C = calcular();
  const sel = R.items.filter(i=>i.on).reduce((s,i)=>s+ +i.monto,0);
  const libre = C.disponible - sel;
  const q = C.q;
  let h = `<div class="small muted">${quincenaNombre(q)} · ${fcorta(q.start)} – ${fcorta(q.end)}. La supervivencia (${$$(C.reservado)} que quedan) ya está reservada automáticamente.</div>`;
  h += `<div class="card"><div class="row"><span>Disponible libre hoy</span><b>${$$(C.disponible)}</b></div></div>`;
  h += R.items.length ? R.items.map((it,i)=>`<div class="card soft"><div class="row"><label class="row" style="gap:10px;justify-content:flex-start;flex:1"><input type="checkbox" data-a-change="rOn" data-i="${i}" ${it.on?'checked':''} style="width:20px;height:20px"><span class="col"><span>${esc(it.nombre)}</span><span class="tiny faint">${esc(it.det)}</span></span></label><input class="i" style="width:130px;text-align:right" inputmode="numeric" data-money data-a-input="rMonto" data-i="${i}" value="$${miles(it.monto)}"></div>${it.tipo==='cadena'?`<div class="chips" style="margin-top:8px">${S.cuentas.map(c=>`<button class="chip ${it.cuentaId===c.id?'on':''}" data-a="rCuenta" data-i="${i}" data-v="${c.id}">${esc(c.nombre)}</button>`).join('')}</div>`:''}</div>`).join('') : '<div class="card empty">No hay nada pendiente por apartar en esta quincena.</div>';
  h += `<div class="card"><div class="row"><span>Total a apartar</span><b>${$$(sel)}</b></div><div class="row"><span>Te queda libre</span><b id="rLibre" class="${libre<0?'neg':'pos'}">${$$(libre)}</b></div>${libre<0?'<div class="small neg" style="margin-top:6px">No alcanza para todo. Desmarca o baja lo de menor prioridad.</div>':''}</div>`;
  h += `<button class="btn pri block" data-a="rGuardar" ${R.items.some(i=>i.on)?'':'disabled'}>Apartar lo marcado</button>`;
  abrirSheet('Repartir quincena', h);

async function guardarRepartir(){
  const now = Date.now(); const f = hoy(); let k = 0;

}

function abrirExtracto(id){

  let h = `<div class="small muted">${d.saldoConocido?`Según la app, ${esc(d.nombre)} está en <b style="color:var(--text)">${$$(d.saldoAct)}</b>. Escribe el saldo que dice el banco. Si es mayor, la diferencia se guarda como intereses y costos pagados.`:`Escribe el saldo total que te falta pagar de ${esc(d.nombre)}, según el banco.`}</div>`;
  h += `<label class="f">Saldo según el extracto</label><input class="i money" id="eSaldo" inputmode="numeric" data-money placeholder="$0"><label class="f">Fecha del extracto</label><input class="i" type="date" id="eFecha" value="${hoy()}">`;

async function guardarExtracto(id){
  const g = x => document.getElementById(x);
  const saldo = num(g('eSaldo').value), fecha = g('eFecha').value || hoy();
  if (!g('eSaldo').value.trim()) { g('eErr').textContent='Escribe el saldo (puede ser 0).'; return; }
  const C = calcular(); const dc = C.deudas.find(x=>x.id===id); const d = S.deudas.find(x=>x.id===id);
  const aj = d.ajustes||[]; const base = aj.length ? aj[aj.length-1] : { fecha:d.fechaInicio, saldo:+d.saldoInicial, creado:d.creado };
  const despues = p => p.fecha>base.fecha || (p.fecha===base.fecha && p.creado>base.creado);
  const posteriores = S.movs.filter(m=>m.tipo==='pago'&&m.deudaId===id&&despues(m)&&m.fecha>fecha).reduce((s,m)=>s+ +m.monto,0);
  const calcEnFecha = dc.saldoConocido ? dc.saldoAct + posteriores : saldo;
  (d.ajustes = aj).push({ fecha, saldo, creado:Date.now(), diferencia: saldo - calcEnFecha });
  await guardar(); cerrarSheet(); toast('Saldo actualizado'); render();
}

// =========================================================
// FASE 2 — pronóstico, metas, recordatorios, gráficos
// =========================================================
const PRIO = { alta:1, media:2, baja:3 };
const prioN = p => PRIO[p] || 2;
const PRIMA_DEF = 2050000;

// Pronóstico a 12 quincenas. Nunca toca el disponible de hoy: es solo para planear.
function pronostico(C){
  const T = C.T;
  const noms = C.movs.filter(m=>m.tipo==='ingreso'&&m.catId==='nomina').sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:a.creado-b.creado);
  if (!noms.length) return { ok:false, motivo:'Registra tu primera nómina (Ingreso → Nómina) y aquí aparece tu pronóstico de 6 meses.' };
  const nomina = +noms[noms.length-1].monto;
  const prima = +(S.settings.prima||PRIMA_DEF);
  // fechas de pago: 13 hacia adelante → 12 quincenas completas + el resto de la actual
  const pays = []; let cur = T;
  while (pays.length<13){ const nx = nominales(cur).find(x=>x>cur); pays.push(nx); cur = nx; }
  const periodos = [{ ini:T, fin:addD(pays[0],-1), pago:false }];
  for (let k=0;k<12;k++) periodos.push({ ini:pays[k], fin:addD(pays[k+1],-1), pago:true });
  const porDia = C.sv.reduce((s,g)=>s+g.porDia,0);
  const antojosQ = C.catPrev.antojos || 0;
  const enP = (f,p) => f>=p.ini && f<=p.fin;
  const mensuales = (dia, desde, hasta) => { const out=[]; let [y,m] = desde.split('-').map(Number); for (let i=0;i<9;i++){ const f = `${y}-${pad(m)}-${pad(Math.min(dia,lastDay(y,m)))}`; if (f>=desde && f<=hasta) out.push(f); m++; if (m>12){m=1;y++;} } return out; };
  const finH = periodos[periodos.length-1].fin;

  // copias de trabajo
  const ds = C.activas.map(d=>({ id:d.id, nombre:d.nombre, tipo:d.tipo, pr:prioN(d.prioridad), tasa:d.tmes||0, saldo: d.saldoConocido ? Math.max(0,d.saldoAct) : null, atraso: d.atrasadoMonto||0, cuota:+d.cuota||0, dia:+d.diaPago||0, fechaFinal:d.fechaFinal||null, prox:d.prox, fin:null }));
  const vencimientos = []; // {fecha, monto, que, deuda?}
  C.plan.filter(p=>p.kind==='fijo'&&p.prox).forEach(p=>{
    let desde = p.prox;
    if (!p.pagado && p.prox < T){ vencimientos.push({ fecha:T, monto:p.monto, que:p.nombre }); desde = addD(p.prox,1); }
    mensuales(p.dia, desde<T?T:desde, finH).forEach(f=> vencimientos.push({ fecha:f, monto:p.monto, que:p.nombre }));
  });
  ds.filter(d=>d.tipo==='obligatoria'&&d.cuota>0&&d.prox).forEach(d=> mensuales(d.dia, d.prox, finH).forEach(f=> vencimientos.push({ fecha:f, monto:d.cuota, que:d.nombre, deuda:d })));
  ds.filter(d=>d.tipo!=='obligatoria'&&d.fechaFinal&&d.saldo>0&&d.fechaFinal<=finH).forEach(d=> vencimientos.push({ fecha: d.fechaFinal<T?T:d.fechaFinal, monto:null, que:`Devolver a ${d.nombre}`, deuda:d, total:true }));
  const cad = C.cadena;
  if (cad && C.cadenaActiva){
    if (C.cadenaPend) vencimientos.push({ fecha:T, monto:cad.aporte, que:'Cadena' });
    pays.forEach(f=>{ if (f<=cad.fechaFin) vencimientos.push({ fecha:f, monto:cad.aporte, que:'Cadena' }); });
  }
  const metasF = C.metas.filter(mt=>!mt.cumplida).map(mt=>({ id:mt.id, nombre:mt.nombre, costo:+mt.costo||0, bal:mt.bal, orden:mt.orden||99, despuesDe:mt.despuesDe||null, fechaLimite:mt.fechaLimite||null, lista:null }));
  metasF.filter(mt=>mt.fechaLimite && mt.fechaLimite>=T && mt.fechaLimite<=finH).forEach(mt=> vencimientos.push({ fecha:mt.fechaLimite, monto:null, que:mt.nombre, meta:mt }));
  let emerg = C.bal.emergencia||0; const emergAporte = +(C.emerg?.aporte||0);
  const fondos = C.otrosB.map(b=>({ id:b.id, nombre:b.nombre, bal:b.bal, aporte:+b.aporte||0 }));

  let cash = C.saldoTotal, primerDeficit = null;
  const filas = [];
  periodos.forEach((p,idx)=>{
    let ingreso = 0, oblig = 0, aDeudas = 0, aAhorro = 0; const notas = [];
    if (p.pago){ ingreso += nomina; const md = p.ini.slice(5); if (md==='06-15'||md==='12-15'){ ingreso += prima; notas.push('prima (estimada)'); } }
    if (cad && C.cadenaActiva && cad.fechaEntrega && enP(cad.fechaEntrega,p) && cad.fechaEntrega>=T){ ingreso += +cad.recibes||0; notas.push('recibes la cadena'); }
    // obligatorio
    oblig += idx===0 ? C.reservado : porDia * (diffD(p.ini,p.fin)+1);
    if (idx>0) oblig += antojosQ;
    vencimientos.filter(v=>enP(v.fecha,p)).forEach(v=>{
      if (v.deuda && v.total){ const m = v.deuda.saldo||0; oblig += m; v.deuda.saldo = 0; if (!v.deuda.fin) v.deuda.fin = v.fecha; return; }
      if (v.meta){ const m = Math.max(0, v.meta.costo - v.meta.bal); oblig += m; v.meta.bal += m; v.meta.lista = v.fecha; return; }
      if (v.deuda){ const d = v.deuda; if (d.saldo===0){ return; } const m = d.saldo!=null ? Math.min(d.cuota, d.saldo) : d.cuota; oblig += m; if (d.saldo!=null){ d.saldo -= m; if (d.saldo<=0.5 && !d.fin) d.fin = v.fecha; } return; }
      oblig += v.monto;
    });
    cash += ingreso - oblig;
    if (cash < 0 && !primerDeficit) primerDeficit = { ...p, falta:-cash };
    let libre = Math.max(0, cash);
    const usar = m => { const u = Math.min(libre, m); libre -= u; cash -= u; return u; };
    // 1. atrasos de bancos por prioridad
    ds.filter(d=>d.atraso>0).sort((a,b)=>a.pr-b.pr || b.tasa-a.tasa || a.atraso-b.atraso).forEach(d=>{ const u = usar(d.atraso); d.atraso -= u; if (d.saldo!=null) d.saldo = Math.max(0,d.saldo-u); aDeudas += u; if (d.atraso<=0.5 && !d.alDia) d.alDia = p.ini; });
    // 2. deudas de palabra sin fecha (y bancos flexibles), por prioridad y la más pequeña primero
    ds.filter(d=>d.tipo!=='obligatoria'&&!d.fechaFinal&&d.saldo>0).sort((a,b)=>a.pr-b.pr || a.saldo-b.saldo).forEach(d=>{ const u = usar(d.saldo); d.saldo -= u; aDeudas += u; if (d.saldo<=0.5 && !d.fin) d.fin = p.ini; });
    // 3. fondo de emergencia (aporte) y fondos con aporte
    if (idx>0 && emergAporte){ const u = usar(emergAporte); emerg += u; aAhorro += u; }
    if (idx>0) fondos.forEach(f=>{ if (f.aporte){ const u = usar(f.aporte); f.bal += u; aAhorro += u; } });
    // 4. metas en orden, respetando las que van después de otra
    metasF.filter(mt=>!mt.fechaLimite).sort((a,b)=>a.orden-b.orden).forEach(mt=>{
      if (libre<=0) return;
      const pre = mt.despuesDe && metasF.find(x=>x.id===mt.despuesDe);
      if (pre && pre.bal < pre.costo) return;
      const u = usar(Math.max(0, mt.costo - mt.bal)); mt.bal += u; aAhorro += u;
      if (mt.bal >= mt.costo && !mt.lista) mt.lista = p.ini;
    });
    const deudaTotal = ds.reduce((s,d)=>s + (d.saldo!=null ? d.saldo : d.atraso),0);
    const ahorro = emerg + fondos.reduce((s,f)=>s+f.bal,0) + metasF.filter(m=>!m.fechaLimite).reduce((s,m)=>s+m.bal,0);
    filas.push({ ...p, ingreso, oblig, aDeudas, aAhorro, cash, deudaTotal, ahorro, deficit: cash<0, notas });
  });
  metasF.forEach(mt=>{ if (mt.bal>=mt.costo && !mt.lista) mt.lista = T; });
  return { ok:true, nomina, prima, filas, primerDeficit, deudas:ds, metas:metasF, finH, sinSaldo: C.activas.filter(d=>!d.saldoConocido).length };
}

// ---------- gráficos (SVG sin librerías, funciona sin internet) ----------
function graficoLineas(filas){
  if (!filas.length) return '';
  const W = 340, H = 170, L = 8, R = 8, top = 14, bot = 26;
  const xs = i => L + (W-L-R) * (i/(filas.length-1||1));
  const maxV = Math.max(1, ...filas.map(f=>Math.max(f.deudaTotal, f.ahorro)));
  const ys = v => top + (H-top-bot) * (1 - v/maxV);
  const pts = k => filas.map((f,i)=>`${xs(i).toFixed(1)},${ys(f[k]).toFixed(1)}`).join(' ');
  const cD = '#b590f0', cA = 'var(--accent)';
  const lbl = f => fcorta(f.ini);
  const last = filas.length-1;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Deudas y ahorro proyectados a 6 meses" style="display:block;margin-top:8px">

    <polyline points="${pts('deudaTotal')}" fill="none" stroke="${cD}" stroke-width="2" stroke-linejoin="round"/>
    <polyline points="${pts('ahorro')}" fill="none" stroke="${cA}" stroke-width="2" stroke-linejoin="round"/>
    ${filas.map((f,i)=>`<circle cx="${xs(i).toFixed(1)}" cy="${ys(f.deudaTotal).toFixed(1)}" r="2.5" fill="${cD}"/><circle cx="${xs(i).toFixed(1)}" cy="${ys(f.ahorro).toFixed(1)}" r="2.5" fill="${cA}"/>`).join('')}
    <text x="${L}" y="${H-10}" font-size="9" fill="var(--faint)">${lbl(filas[0])}</text>
    <text x="${W-R}" y="${H-10}" font-size="9" fill="var(--faint)" text-anchor="end">${lbl(filas[last])}</text>

}
function graficoBarras(items){ // [{l, v}]
  if (!items.length) return '<div class="empty">Aún no hay datos.</div>';
  const max = Math.max(1, ...items.map(i=>i.v));
  return `<div class="catbars">${items.map(i=>`<div class="r"><div class="row"><span class="small">${esc(i.l)}</span><b class="small">${$$(i.v)}</b></div><div class="bar"><i style="width:${pct(i.v,max)}%;background:var(--warn)"></i></div></div>`).join('')}</div>`;
}
function antojosPorQuincena(C){
  const out = []; let q = C.q;
  for (let i=0;i<6;i++){
    if (q.end < S.creado) break;
    const v = C.movs.filter(m=>m.catId==='antojos'&&m.fecha>=q.start&&m.fecha<=q.end).reduce((s,m)=>s+(m.tipo==='gasto'&&!m.previo?+m.monto:m.tipo==='reintegro'?-m.monto:0),0);
    out.unshift({ l:`${quincenaNombre(q)} (${fcorta(q.start)})`, v });
    q = quincenaDe(addD(q.start,-1), C.movs);
  }
  return out;
}

async function guardarMeta(id){
  const g = x => document.getElementById(x); const err = m => g('mErr').textContent = m;
  const nombre = g('mNombre').value.trim(); if (!nombre) return err('Escribe el nombre.');
  const costo = num(g('mCosto').value); if (!costo) return err('Escribe el costo.');
  const despuesDe = g('mDespues').value || null;
  if (id && despuesDe){ let x = S.metas.find(m=>m.id===despuesDe), n=0; while (x && n<50){ if (x.id===id) return err('Esa combinación forma un círculo.'); x = S.metas.find(m=>m.id===x.despuesDe); n++; } }
  const upd = { nombre, costo, orden: num(g('mOrden').value)||99, despuesDe, fechaLimite: g('mFecha').value||null, inicial: num(g('mInicial').value), notas: g('mNotas').value.trim() };
  if (id) Object.assign(S.metas.find(m=>m.id===id), upd); else S.metas.push({ id:'m_'+uid(), ...upd });
  await guardar(); cerrarSheet(); toast('Meta guardada'); render();
}

// ---------- recordatorios (Google Calendar) ----------
function proximoDia(dia, desde){ let [y,m] = desde.split('-').map(Number); for (let i=0;i<3;i++){ const f = `${y}-${pad(m)}-${pad(Math.min(dia,lastDay(y,m)))}`; if (f>=desde) return f; m++; if (m>12){m=1;y++;} } return desde; }
function recordatorios(C){
  const T = C.T, it = [];
  const sig = (d) => { const x = pd(T); const add = (7 - x.getDay() + d) % 7 || 7; x.setDate(x.getDate()+add); return ymd(x); };
  C.plan.forEach(p=>{ if (p.dia) it.push({ id:p.key, titulo:`Pagar ${p.nombre}`, det:`${$$(p.monto)} · Vida Financiera`, rrule:`FREQ=MONTHLY;BYMONTHDAY=${Math.min(p.dia,28)===p.dia?p.dia:-1}`, fecha: proximoDia(p.dia, T), grupo:'Pagos del mes' }); });
  C.activas.filter(d=>d.tipo!=='obligatoria'&&d.fechaFinal&&d.saldoAct>0&&d.fechaFinal>=T).forEach(d=> it.push({ id:'dev:'+d.id, titulo:`Pagarle a ${d.nombre}`, det:`${$$(d.saldoAct)} · Vida Financiera`, fecha:d.fechaFinal, grupo:'Préstamos de palabra' }));
  C.porCobrar.filter(p=>p.saldo>0&&p.fechaEsperada&&p.fechaEsperada>=T).forEach(p=> it.push({ id:'cob:'+p.id, titulo:`Cobrarle a ${p.persona}`, det:`${$$(p.saldo)} · Vida Financiera`, fecha:p.fechaEsperada, grupo:'Me deben' }));
  C.metas.filter(m=>!m.cumplida&&m.fechaLimite&&m.fechaLimite>=T).forEach(m=> it.push({ id:'meta:'+m.id, titulo:m.nombre, det:`Tener ${$$(m.costo)} listos · Vida Financiera`, fecha:m.fechaLimite, grupo:'Metas con fecha' }));
  if (C.cadena && C.cadenaActiva) it.push({ id:'cadena', titulo:'Aporte a la cadena', det:`${$$(C.cadena.aporte)} · Vida Financiera`, rrule:`FREQ=MONTHLY;BYMONTHDAY=15,30;UNTIL=${C.cadena.fechaFin.replace(/-/g,'')}T235959Z`, fecha: nominales(T).find(x=>x>=T), grupo:'Cada quincena' });
  it.push({ id:'nomina', titulo:'Registra la nómina y reparte la quincena', det:'Vida Financiera: + → Ingreso → Nómina, luego Repartir', rrule:'FREQ=MONTHLY;BYMONTHDAY=15,30', fecha: nominales(T).find(x=>x>=T), grupo:'Cada quincena' });
  it.push({ id:'respaldo', titulo:'Respaldo de Vida Financiera', det:'Engranaje → Guardar respaldo → Drive', rrule:'FREQ=WEEKLY;BYDAY=SU', fecha: sig(0), grupo:'Cada semana' });
  return it;
}
const HORA_REC = '060000', HORA_FIN = '061500', HORA_UTC = '110000Z', HORA_UTC_FIN = '111500Z'; // 6:00 a. m. en Bogotá (UTC-5)
function linkCalendario(r){
  const d = r.fecha.replace(/-/g,'');
  let u = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(r.titulo)}&details=${encodeURIComponent(r.det)}&dates=${d}T${HORA_REC}/${d}T${HORA_FIN}&ctz=America/Bogota`;
  if (r.rrule) u += `&recur=${encodeURIComponent('RRULE:'+r.rrule)}`;
  return u;
}
function descargarICS(C){
  const lst = recordatorios(C); const now = new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const escI = t => String(t).replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const ev = lst.map(r=>{ const d = r.fecha.replace(/-/g,''); return ['BEGIN:VEVENT',`UID:vf-${r.id.replace(/[^a-z0-9]/gi,'')}-${d}@vida-financiera`,`DTSTAMP:${now}`,`DTSTART:${d}T${HORA_UTC}`,`DTEND:${d}T${HORA_UTC_FIN}`,`SUMMARY:${escI(r.titulo)}`,`DESCRIPTION:${escI(r.det)}`, r.rrule?`RRULE:${r.rrule}`:null,'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${escI(r.titulo)}`,'TRIGGER:PT0M','END:VALARM','BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:Mañana: ${escI(r.titulo)}`,'TRIGGER:-P1D','END:VALARM','END:VEVENT'].filter(Boolean).join('\r\n'); });
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Vida Financiera//ES','CALSCALE:GREGORIAN', ...ev, 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics],{type:'text/calendar'})); a.download = `vida-financiera-recordatorios-${hoy()}.ics`; document.body.appendChild(a); a.click(); a.remove();
}
