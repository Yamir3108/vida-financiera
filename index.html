    ${invs.length?invs.map(c=>{ const sv = C.saldo[c.id]||0; const t = +c.tasa||0; const mes = sv*(Math.pow(1+t/100,1/12)-1); return `<div class="row" style="margin-top:10px;cursor:pointer" data-a="inversion" data-id="${c.id}"><div class="col"><span>${esc(c.nombre)} <span class="badge">${esc(c.instrumento||'Inversión')}</span></span><span class="tiny faint">${t?`${String(t).replace('.',',')} % EA · ≈ ${$$(mes)} al mes`:'sin tasa'}${c.vence?` · vence ${fcorta(c.vence)}`:''}</span></div><b>${$$(sv)}</b></div>`; }).join('') : '<div class="tiny faint" style="margin-top:8px">Orden sugerido cuando llegues: fondo de emergencia en cuenta/bolsillo de alta rentabilidad → CDT para metas con fecha (Fogafín cubre hasta $50 millones por entidad) → fondos de inversión colectiva (más rentabilidad posible, sin Fogafín).</div>'}
    ${invs.length?'<div class="tiny faint" style="margin-top:8px">Para meter plata: + → Transferencia desde tu cuenta hacia la inversión. Los rendimientos: + → Ingreso → Rendimientos en esa cuenta.</div>':''}</div>`;
  h += `<div class="card"><h2>Antojos por pago</h2><div class="small muted" style="margin-top:4px">Lo que sale de tu plata libre en gustos.</div>${graficoBarras(antojosPorQuincena(C))}</div>`;

  return h;
}

async function guardarMeta(id){
  const g = x => document.getElementById(x); const err = m => g('mErr').textContent = m;
  const nombre = g('mNombre').value.trim(); if (!nombre) return err('Escribe el nombre.');
  const costo = num(g('mCosto').value); if (!costo) return err('Escribe el costo.');
  const despuesDe = g('mDespues').value || null;
  if (id && despuesDe){ let x = S.metas.find(m=>m.id===despuesDe), n=0; while (x && n<50){ if (x.id===id) return err('Esa combinación forma un círculo.'); x = S.metas.find(m=>m.id===x.despuesDe); n++; } }
  const upd = { nombre, costo, orden: num(g('mOrden').value)||99, despuesDe, fechaLimite: g('mFecha').value||null, inicial: num(g('mInicial').value), notas: g('mNotas').value.trim() };
  if (id) Object.assign(S.metas.find(m=>m.id===id), upd); else S.metas.push({ id:'m_'+uid(), ...upd });
  await guardar(); cerrarSheet(); toast('Meta guardada'); render();
}

// ---------- recordatorios (Google Calendar) ----------
function proximoDia(dia, desde){ let [y,m] = desde.split('-').map(Number); for (let i=0;i<3;i++){ const f = `${y}-${pad(m)}-${pad(Math.min(dia,lastDay(y,m)))}`; if (f>=desde) return f; m++; if (m>12){m=1;y++;} } return desde; }
function recordatorios(C){
  const T = C.T, it = [];
  const sig = (d) => { const x = pd(T); const add = (7 - x.getDay() + d) % 7 || 7; x.setDate(x.getDate()+add); return ymd(x); };
  C.plan.forEach(p=>{ if (p.dia) it.push({ id:p.key, titulo:`Pagar ${p.nombre}`, det:`${$$(p.monto)} · Vida Financiera`, dia:p.dia, rrule:`FREQ=MONTHLY;BYMONTHDAY=${p.dia===31?-1:p.dia}`, fecha: proximoDia(p.dia, T), grupo:'Pagos del mes', antes:true }); });
  C.activas.filter(d=>d.tipo!=='obligatoria'&&d.fechaFinal&&d.saldoAct>0&&d.fechaFinal>=T).forEach(d=> it.push({ id:'dev:'+d.id, titulo:`Pagarle a ${d.nombre}`, det:`${$$(d.saldoAct)} · Vida Financiera`, fecha:d.fechaFinal, grupo:'Préstamos de palabra', antes:true }));
  C.porCobrar.filter(p=>p.saldo>0&&p.fechaEsperada&&p.fechaEsperada>=T).forEach(p=> it.push({ id:'cob:'+p.id, titulo:`Cobrarle a ${p.persona}`, det:`${$$(p.saldo)} · Vida Financiera`, fecha:p.fechaEsperada, grupo:'Me deben', antes:true }));
  C.metas.filter(m=>!m.cumplida&&m.fechaLimite&&m.fechaLimite>=T).forEach(m=> it.push({ id:'meta:'+m.id, titulo:m.nombre, det:`Tener ${$$(m.costo)} listos · Vida Financiera`, fecha:m.fechaLimite, grupo:'Metas con fecha', antes:true }));
  if (C.cadena && C.cadenaActiva) it.push({ id:'cadena', titulo:'Aporte a la cadena', det:`${$$(C.cadena.aporte)} · Vida Financiera`, rrule:`FREQ=MONTHLY;BYMONTHDAY=15,30;UNTIL=${C.cadena.fechaFin.replace(/-/g,'')}T235959Z`, dias:[15,30], fecha: nominales(T).find(x=>x>=T), grupo:'Cada pago', antes:true });
  it.push({ id:'nomina', titulo:'Registra la nómina y dale Repartir', det:'Vida Financiera: + → Ingreso → Nómina, luego Repartir', rrule:'FREQ=MONTHLY;BYMONTHDAY=15,30', dias:[15,30], fecha: nominales(T).find(x=>x>=T), grupo:'Cada pago', antes:true });
  it.push({ id:'registrar', titulo:'¿Registraste todo hoy?', det:'Vida Financiera: anota lo que gastaste hoy. Si no gastaste, toca "Hoy no gasté".', rrule:'FREQ=DAILY', fecha:T, hora:'200000', horaFin:'201000', grupo:'Todos los días' });
  it.push({ id:'respaldo', titulo:'Respaldo de Vida Financiera', det:'Engranaje → Guardar respaldo → Drive', rrule:'FREQ=WEEKLY;BYDAY=SU', fecha: sig(0), grupo:'Cada semana' });
  return it;
}
// aviso el día anterior a las 7 p. m.
function diaAntes(r){
  const x = { ...r, id:r.id+':antes', titulo:`Mañana: ${r.titulo}`, hora:'190000', horaFin:'191000', fecha: addD(r.fecha,-1) };
  if (r.dias) x.rrule = r.rrule.replace(/BYMONTHDAY=[^;]+/, 'BYMONTHDAY='+r.dias.map(d=>d-1).join(','));
  else if (r.dia) x.rrule = `FREQ=MONTHLY;BYMONTHDAY=${r.dia===1?-1:r.dia===31?-2:r.dia-1}`;
  return x;
}
function linkCalendario(r){
  const d = r.fecha.replace(/-/g,''); const h1 = r.hora||'060000', h2 = r.horaFin||'061500';
  let u = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(r.titulo)}&details=${encodeURIComponent(r.det)}&dates=${d}T${h1}/${d}T${h2}&ctz=America/Bogota`;
  if (r.rrule) u += `&recur=${encodeURIComponent('RRULE:'+r.rrule)}`;
  return u;
}
function descargarICS(C){
  const base = recordatorios(C); const lst = [...base, ...base.filter(r=>r.antes).map(diaAntes)];
  const now = new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const escI = t => String(t).replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const ev = lst.map(r=>{ const d = r.fecha.replace(/-/g,''); return ['BEGIN:VEVENT',`UID:vf-${r.id.replace(/[^a-z0-9]/gi,'')}-${d}@vida-financiera`,`DTSTAMP:${now}`,`DTSTART;TZID=America/Bogota:${d}T${r.hora||'060000'}`,`DTEND;TZID=America/Bogota:${d}T${r.horaFin||'061500'}`,`SUMMARY:${escI(r.titulo)}`,`DESCRIPTION:${escI(r.det)}`, r.rrule?`RRULE:${r.rrule}`:null,'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${escI(r.titulo)}`,'TRIGGER:PT0M','END:VALARM','END:VEVENT'].filter(Boolean).join('\r\n'); });
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Vida Financiera//ES','CALSCALE:GREGORIAN', ...ev, 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics],{type:'text/calendar'})); a.download = `vida-financiera-recordatorios-${hoy()}.ics`; document.body.appendChild(a); a.click(); a.remove();
}

  return `<div class="card"><h2>Recordatorios en el calendario</h2>
    <div class="small muted" style="margin:4px 0 10px">"Agregar" abre Google Calendar con el evento listo a las 6:00 a.&nbsp;m. (repetido si aplica): solo le das Guardar. "Día antes" agrega otro aviso la víspera a las 7:00 p.&nbsp;m. para alistar la plata.</div>
    ${Object.entries(grupos).map(([g,xs])=>`<h3 style="margin-top:12px">${esc(g)}</h3>${xs.map(r=>`<div class="row" style="margin-top:8px"><div class="col"><span class="small">${esc(r.titulo)}</span><span class="tiny faint">${cuando(r)}</span></div><div class="chips" style="flex-wrap:nowrap"><a class="btn sm" href="${linkCalendario(r)}" target="_blank" rel="noopener">Agregar</a>${r.antes?`<a class="btn sm" href="${linkCalendario(diaAntes(r))}" target="_blank" rel="noopener">Día antes</a>`:''}</div></div>`).join('')}`).join('')}
    <div class="sep"></div>
    <div class="small muted">¿Todos de una vez (incluidos los del día antes)? Descarga el archivo y, desde un computador, entra a calendar.google.com → Configuración → Importar.</div>
    <button class="btn sm" style="margin-top:8px" data-a="ics">Descargar todos (.ics)</button>
  </div>`;
}

  svDel: el => { const cur = leerSuperv(); cur.splice(+el.dataset.i,1); document.getElementById('svRows').innerHTML = cur.map((r,i)=>svEditRow(r,i)).join(''); },

  cuenta: el => abrirCuenta(el.dataset.id),

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (fn){ e.preventDefault(); fn(el,e); }
});
document.addEventListener('change', e=>{
  const el = e.target;
  if (el.id==='fileRestore' && el.files[0]) { restaurar(el.files[0]); el.value=''; return; }
  const a = el.dataset.aChange; if (!a) { if (el.id==='fBolsillo' && F){ F.bolsillo = el.value; F.bolsilloManual = true; } return; }
  if (a==='filtro'){ movFiltro[el.dataset.k] = el.value; render(); }
  if (a==='lockMin'){ S.settings.lockMin = +el.value; guardar(); toast('Guardado'); }
  if (a==='fParteOn'){ leerForm(); F.parteOn = el.checked; renderForm(); }
  if (a==='rOn'){ R.items[+el.dataset.i].on = el.checked; renderRepartir(); }
  if (a==='xCat'){ const cat = S.categorias.gasto.find(c=>c.id===el.value); document.getElementById('xSub').innerHTML = (cat?cat.subs:[]).map(s=>`<option>${esc(s)}</option>`).join(''); }
  if (a==='dTipo'){ document.getElementById('dOblig').style.display = el.value==='obligatoria' ? '' : 'none'; }
});
document.addEventListener('input', e=>{
  const el = e.target;
  if (el.hasAttribute('data-money')){ const n = num(el.value); const pos = el.value.length - el.selectionStart; el.value = n||el.value.replace(/[^\d]/g,'')==='0' ? '$'+miles(n) : ''; try{ const p = Math.max(0, el.value.length - pos); el.setSelectionRange(p,p); }catch(_){} }
  if (el.dataset.aInput==='rMonto'){ R.items[+el.dataset.i].monto = num(el.value); const C = calcular(); const b = document.getElementById('rTot'); if (b) b.innerHTML = totRepartirHTML(C, totalesRepartir(C)); }
});
document.addEventListener('visibilitychange', ()=>{
  if (document.hidden) hiddenAt = Date.now();
  else if (S && S.settings.pinHash && !bloqueado && hiddenAt && Date.now()-hiddenAt > (S.settings.lockMin||3)*60000){ bloqueado = true; pinBuf=''; cerrarSheet(); render(); }
});

// ---------- arranque ----------
(async function init(){
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(_){}
  S = await dbGet('state');
  if (!S){ S = estadoInicial(); await guardar(); }
  // migraciones de versiones anteriores
  if (!S.metas) S.metas = [];
  if (!S.porCobrar) S.porCobrar = [];
  S.deudas.forEach(d=>{ if (!d.prioridad){ const n = norm(d.nombre+' '+(d.acreedor||'')); d.prioridad = /icetex|estudio|mibanco|paisa/.test(n) ? 'alta' : /sistecr/.test(n) ? 'media' : (d.tipo==='obligatoria' ? 'alta' : 'media'); } });
  // corrección: Martin Garrix es el 5 de diciembre
  if (!S.settings.fixGarrix){ const g = (S.metas||[]).find(m=>m.id==='m_garrix'); if (g && g.fechaLimite==='2026-10-05'){ g.fechaLimite='2026-12-05'; g.orden=2; const c = S.metas.find(m=>m.id==='m_calvin'); if (c) c.orden=1; } S.settings.fixGarrix = true; await guardar(); }
  if (!S.settings.fase2){
    S.settings.fase2 = true;
    if (!S.bolsillos.some(b=>norm(b.nombre).includes('concierto'))) S.bolsillos.push({ id:'b_eventos', nombre:'Conciertos y eventos', tipo:'fondo', aporte:75000, objetivo:0, inicial:0 });
    if (!S.settings.reto) S.settings.reto = { desde:'2026-10-01', objetivo:41200, base:56200 };
    if (!S.metas.length){
      const L = 'm_licencia', E = 'm_equipo';
      S.metas.push(
        { id:'m_garrix', nombre:'Concierto Martin Garrix', costo:100000, orden:2, fechaLimite:'2026-12-05', inicial:0, notas:'Boleta paga. Para pasajes y bebidas.' },
        { id:'m_calvin', nombre:'Concierto Calvin Harris', costo:100000, orden:1, fechaLimite:'2026-11-13', inicial:0, notas:'Boleta paga. Para pasajes y bebidas.' },
        { id:'m_parlante', nombre:'Parlante JBL Charge 6', costo:739900, orden:3, inicial:0, notas:'iShop Colombia, 29/09/2026. IP67, hasta 28 h de batería.' },
        { id:L, nombre:'Licencia de moto A2', costo:1262700, orden:4, inicial:0, notas:'Curso ≈ 750.000 + examen médico ≈ 240.000 + expedición 272.700.' },
        { id:E, nombre:'Casco y equipo de moto', costo:1560000, orden:5, despuesDe:L, inicial:0, notas:'Nivel recomendado: casco HJC i71 (ECE 22.06), guantes Predator, chaqueta certificada.' },
        { id:'m_celular', nombre:'Celular Galaxy S25 FE', costo:1799900, orden:6, inicial:0, notas:'Falabella, 29/09/2026 (en oferta; precio normal 3.499.900). Revisar precio al comprar.' },
        { id:'m_videobeam', nombre:'Videobeam XGIMI MoGo 3 Pro', costo:3059900, orden:7, inicial:0, notas:'Homecenter, 29/09/2026. Portátil, 1080p, Google TV.' },
        { id:'m_laptop', nombre:'Laptop Lenovo LOQ (RTX 4060)', costo:6999900, orden:8, inicial:0, notas:'Homecenter, 29/09/2026. Ryzen 7 8845HS, 16 GB (ampliable a 32 GB), RTX 4060. Sirve para TIA Portal, juegos y diseño.' },
        { id:'m_moto', nombre:'Moto Pulsar RS 200 (con SOAT y matrícula)', costo:16763000, orden:9, despuesDe:E, inicial:0, notas:'15.999.000 + SOAT 343.300 + matrícula 420.700 (precios 2026).' }
      );
    }
    await guardar();
  }
  if (!S.categorias.gasto.some(c=>c.id==='antojos')){ const i = S.categorias.gasto.findIndex(c=>c.id==='alimentacion'); S.categorias.gasto.splice(i+1,0,{ id:'antojos', nombre:'Antojos', subs:['Tintos extra','Dulces y snacks','Gaseosas','Comida extra'] }); await guardar(); }
  if (!S.settings.v11){
    S.settings.v11 = true;
    if (!S.settings.ahorroMin) S.settings.ahorroMin = { monto:20000, emergencia:10000, desde: nominales(hoy()).find(x=>x>hoy()) };

    const ev = S.bolsillos.find(b=>b.id==='b_eventos'); if (ev && ev.aporte){ ev.aporte = 0; ev.pausado = true; }
    await guardar();
  }
  bloqueado = !!S.settings.pinHash;
  render();
  if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
