  fCat: el => { leerForm(); F.catId = el.dataset.v; F.sub=''; autoBolsillo(); renderForm(); },
  fSub: el => { leerForm(); F.sub = F.sub===el.dataset.v ? '' : el.dataset.v; autoBolsillo(); renderForm(); },
  fSet: el => { leerForm(); F[el.dataset.k] = el.dataset.v; if (el.dataset.k==='cobrarId' && !num(F.monto)){ const C = calcular(); const pc = C.porCobrar.find(x=>x.id===el.dataset.v); if (pc) F.monto = String(pc.saldo); } if (el.dataset.k==='deudaId' && !num(F.monto)){ const d = S.deudas.find(x=>x.id===el.dataset.v); if (d && d.cuota) F.monto = String(d.cuota); } renderForm(); },
  fGuardar: () => guardarForm(),
  fBorrar: () => borrarMov(),
  mes: el => { const [y,m] = movMes.split('-').map(Number); const d = new Date(y, m-1+Number(el.dataset.d), 1); movMes = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; render(); },
  repartir: () => abrirRepartir(),
  meta: el => abrirMeta(el.dataset.id),
  metaGuardar: el => guardarMeta(el.dataset.id||null),
  metaBorrar: async el => { if (!confirm('¿Eliminar esta meta?')) return; S.metas = S.metas.filter(m=>m.id!==el.dataset.id); S.metas.forEach(m=>{ if (m.despuesDe===el.dataset.id) m.despuesDe=null; }); await guardar(); cerrarSheet(); render(); },
  metaCumplida: async el => { const mt = S.metas.find(m=>m.id===el.dataset.id); if (!confirm(`¿Marcar "${mt.nombre}" como cumplida?`)) return; mt.cumplida = hoy(); await guardar(); cerrarSheet(); toast('¡Meta cumplida!'); render(); },
  metaCompra: el => { const C = calcular(); const mt = C.metas.find(m=>m.id===el.dataset.id); nuevoForm({ tipo:'gasto', bolsillo:mt.id, bolsilloManual:true, monto:String(Math.min(mt.bal, mt.costo)), nota:mt.nombre }); },
  reto: () => abrirReto(),
  retoGuardar: async () => { const g = x=>document.getElementById(x); S.settings.reto = { desde:g('rtDesde').value||hoy(), objetivo:num(g('rtObj').value), base:num(g('rtBase').value) }; await guardar(); cerrarSheet(); toast('Reto guardado'); render(); },
  ics: () => descargarICS(calcular()),
  yaPague: async el => {
    const C = calcular(); const p = C.plan.find(x=>x.key===el.dataset.key); if (!p) return;
    const T = C.T; const [y,m] = T.split('-').map(Number);
    const due = `${y}-${pad(m)}-${pad(Math.min(p.dia||1,lastDay(y,m)))}`;
    const fecha = due <= T ? due : T; const monto = Math.max(0, p.monto - (p.pagadoMes||0));
    if (!confirm(`¿Marcar ${p.nombre} (${$$(monto)}) como pagado en ${MESES_L[m-1]}?\n\nÚsalo solo si lo pagaste ANTES de empezar a usar la app: no descuenta de tu saldo, porque tu saldo inicial ya lo refleja.`)) return;
    const mv = { id:uid(), creado:Date.now(), fecha, monto, previo:true, nota:'Pagado antes de usar la app', bolsillo:p.key };
    if (p.kind==='fijo'){ mv.tipo='gasto'; mv.catId=p.ref.catId; if (p.ref.sub) mv.sub=p.ref.sub; mv.cuentaId=S.cuentas[0]?.id; }
    else { mv.tipo='pago'; mv.deudaId=p.ref.id; mv.cuentaId=S.cuentas[0]?.id; }
    S.movs.push(mv); await guardar(); toast('Marcado como pagado'); render();
  },
  rGuardar: () => guardarRepartir(),
  rCuenta: el => { R.items[+el.dataset.i].cuentaId = el.dataset.v; renderRepartir(); },
  fijo: el => abrirFijo(el.dataset.id),
  fijoGuardar: el => guardarFijo(el.dataset.id||null),
  fijoBorrar: async el => { const id = el.dataset.id; const key='fijo:'+id; const C = calcular(); const b = C.bal[key]||0; if (!confirm(b>0?`Este fijo tiene ${$$(b)} apartados que quedarán libres. ¿Eliminar?`:'¿Eliminar este fijo?')) return; S.fijos = S.fijos.filter(f=>f.id!==id); S.movs.forEach(m=>{ if (m.bolsillo===key){ if (m.tipo==='gasto') delete m.bolsillo; } }); S.movs = S.movs.filter(m=>!((m.tipo==='apartar'||m.tipo==='sacar')&&m.bolsillo===key)); await guardar(); cerrarSheet(); render(); },
  deudaEdit: el => abrirDeuda(el.dataset.id),
  deudaGuardar: el => guardarDeuda(el.dataset.id||null),
  deudaBorrar: async el => { if (!confirm('¿Eliminar esta deuda?')) return; const id = el.dataset.id; S.deudas = S.deudas.filter(d=>d.id!==id); S.movs = S.movs.filter(m=>m.bolsillo!=='deuda:'+id); await guardar(); cerrarSheet(); render(); },
  extracto: el => abrirExtracto(el.dataset.id),
  extractoGuardar: el => guardarExtracto(el.dataset.id),
  bolsillo: el => abrirBolsillo(el.dataset.id),
  bolsilloGuardar: el => guardarBolsillo(el.dataset.id||null),
  bolsilloBorrar: async el => { if (!confirm('¿Eliminar este fondo?')) return; S.bolsillos = S.bolsillos.filter(b=>b.id!==el.dataset.id); await guardar(); cerrarSheet(); render(); },
  editSuperv: () => abrirSuperv(),
  svAdd: () => { const cur = leerSuperv(); S._svTmp = [...cur, { id:uid(), nombre:'', porDia:0, cat:'alimentacion' }]; document.getElementById('svRows').innerHTML = S._svTmp.map((r,i)=>svEditRow(r,i)).join(''); delete S._svTmp; },
  svDel: el => { const cur = leerSuperv(); cur.splice(+el.dataset.i,1); document.getElementById('svRows').innerHTML = cur.map((r,i)=>svEditRow(r,i)).join(''); },
  svGuardar: async () => { const rows = leerSuperv(); if (rows.some(r=>!r.nombre)) { document.getElementById('svErr').textContent='Todos los rubros necesitan nombre.'; return; } S.supervivencia = rows; await guardar(); cerrarSheet(); toast('Supervivencia actualizada'); render(); },
  cuenta: el => abrirCuenta(el.dataset.id),
  cuentaGuardar: async el => { const id = el.dataset.id; const n = document.getElementById('cNombre').value.trim(); if (!n){ document.getElementById('cErr').textContent='Escribe el nombre.'; return; } const s = num(document.getElementById('cSaldo').value); if (id){ Object.assign(S.cuentas.find(c=>c.id===id), { nombre:n, saldoInicial:s }); } else S.cuentas.push({ id:'c_'+uid(), nombre:n, saldoInicial:s }); await guardar(); cerrarSheet(); render(); },
  cuentaBorrar: async el => { if (!confirm('¿Eliminar esta cuenta?')) return; S.cuentas = S.cuentas.filter(c=>c.id!==el.dataset.id); await guardar(); cerrarSheet(); render(); },
  cats: el => abrirCats(el.dataset.t),
  catAdd: () => { leerNombresCats(); const n = document.getElementById('ncat').value.trim(); if (!n) return; S.categorias[catTipo].push({ id:'k_'+uid(), nombre:n, subs:[] }); guardar(); abrirCats(catTipo); },
  catDel: el => { leerNombresCats(); const c = S.categorias[catTipo][+el.dataset.i]; if (S.fijos.some(f=>f.catId===c.id) || S.supervivencia.some(r=>r.cat===c.id)) { alert('Esta categoría la usa un fijo o la supervivencia. Cámbialos primero.'); return; } if (!confirm(`¿Quitar “${c.nombre}”?`)) return; S.categorias[catTipo].splice(+el.dataset.i,1); guardar(); abrirCats(catTipo); },
  subAdd: el => { leerNombresCats(); const i = +el.dataset.i; const n = document.getElementById('nsub'+i).value.trim(); if (!n) return; const c = S.categorias[catTipo][i]; if (!c.subs.includes(n)) c.subs.push(n); guardar(); abrirCats(catTipo); },
  subDel: el => { leerNombresCats(); const c = S.categorias[catTipo][+el.dataset.i]; const s = c.subs[+el.dataset.j]; if (S.fijos.some(f=>f.catId===c.id && f.sub===s)) { alert(`“${s}” la usa un fijo. Cámbialo primero.`); return; } c.subs.splice(+el.dataset.j,1); guardar(); abrirCats(catTipo); },
  catsGuardar: async () => { leerNombresCats(); await guardar(); cerrarSheet(); toast('Categorías guardadas'); render(); },
  backup: () => hacerBackup(),
  csv: () => exportarCSV(),
  restore: () => document.getElementById('fileRestore').click(),
  cierre: async el => { const C = calcular(); const c = C.cierre; if (!c) return; if (el.dataset.d) S.movs.push({ id:uid(), creado:Date.now(), tipo:'apartar', monto:Math.round(c.sobrante), fecha:hoy(), bolsillo:el.dataset.d, nota:`Sobrante supervivencia ${quincenaNombre(c.q).toLowerCase()} (${fcorta(c.q.start)})` }); S.settings.cierres[c.q.start] = el.dataset.d || 'libre'; await guardar(); toast(el.dataset.d?'Sobrante apartado':'Listo'); render(); },
  bloquear: () => { bloqueado = true; pinBuf=''; render(); },
  cambiarPin: () => { pinBuf=''; pinPrimero=''; pinMsg=''; const sh = document.getElementById('sheet'); sh.classList.remove('hidden'); sh.innerHTML = pantallaPin('actual'); },
  pinCancel: () => { pinModo='unlock'; pinBuf=''; pinPrimero=''; cerrarSheet(); },
  pk: el => pinTecla(el.dataset.k),
  ob: el => { obPaso = +el.dataset.d; pinBuf=''; pinPrimero=''; render(); },
  obSaldos: async () => { const faltan = S.cuentas.filter(c=>document.getElementById('ob-'+c.id).value.trim()===''); if (faltan.length){ document.getElementById('obErr').textContent = `Falta: ${faltan.map(c=>c.nombre).join(', ')} (pon 0 si no tienes).`; return; } S.cuentas.forEach(c=>c.saldoInicial = num(document.getElementById('ob-'+c.id).value)); S.settings.onboarded = true; S.creado = hoy(); bloqueado = false; await guardar(); render(); toast('Listo. Ahora carga tus fijos y deudas.'); },
  borrarTodo: async () => { const t = prompt('Esto borra TODO. Escribe BORRAR para confirmar.'); if (t!=='BORRAR') return; S = estadoInicial(); obPaso = 0; bloqueado = true; await guardar(); cerrarSheet(); render(); },
};
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (fn){ e.preventDefault(); fn(el,e); }
});
document.addEventListener('change', e=>{
  const el = e.target;
  if (el.id==='fileRestore' && el.files[0]) { restaurar(el.files[0]); el.value=''; return; }
  const a = el.dataset.aChange; if (!a) { if (el.id==='fBolsillo' && F){ F.bolsillo = el.value; F.bolsilloManual = true; } return; }
  if (a==='filtro'){ movFiltro[el.dataset.k] = el.value; render(); }
  if (a==='lockMin'){ S.settings.lockMin = +el.value; guardar(); toast('Guardado'); }
  if (a==='rOn'){ R.items[+el.dataset.i].on = el.checked; renderRepartir(); }
  if (a==='xCat'){ const cat = S.categorias.gasto.find(c=>c.id===el.value); document.getElementById('xSub').innerHTML = (cat?cat.subs:[]).map(s=>`<option>${esc(s)}</option>`).join(''); }
  if (a==='dTipo'){ document.getElementById('dOblig').style.display = el.value==='obligatoria' ? '' : 'none'; }
});
document.addEventListener('input', e=>{
  const el = e.target;
  if (el.hasAttribute('data-money')){ const n = num(el.value); const pos = el.value.length - el.selectionStart; el.value = n||el.value.replace(/[^\d]/g,'')==='0' ? '$'+miles(n) : ''; try{ const p = Math.max(0, el.value.length - pos); el.setSelectionRange(p,p); }catch(_){} }
  if (el.dataset.aInput==='rMonto'){ R.items[+el.dataset.i].monto = num(el.value); const C = calcular(); const sel = R.items.filter(i=>i.on).reduce((s,i)=>s+ +i.monto,0); const l = document.getElementById('rLibre'); if (l){ l.textContent = $$(C.disponible-sel); l.className = C.disponible-sel<0?'neg':'pos'; } }
});
document.addEventListener('visibilitychange', ()=>{
  if (document.hidden) hiddenAt = Date.now();
  else if (S && S.settings.pinHash && !bloqueado && hiddenAt && Date.now()-hiddenAt > (S.settings.lockMin||3)*60000){ bloqueado = true; pinBuf=''; cerrarSheet(); render(); }
});

// ---------- arranque ----------
(async function init(){
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(_){}
  S = await dbGet('state');
  if (!S){ S = estadoInicial(); await guardar(); }
  // migraciones de versiones anteriores
  if (!S.metas) S.metas = [];
  if (!S.porCobrar) S.porCobrar = [];
  S.deudas.forEach(d=>{ if (!d.prioridad){ const n = norm(d.nombre+' '+(d.acreedor||'')); d.prioridad = /icetex|estudio|mibanco|paisa/.test(n) ? 'alta' : /sistecr/.test(n) ? 'media' : (d.tipo==='obligatoria' ? 'alta' : 'media'); } });
  if (!S.settings.fase2){
    S.settings.fase2 = true;
    if (!S.bolsillos.some(b=>norm(b.nombre).includes('concierto'))) S.bolsillos.push({ id:'b_eventos', nombre:'Conciertos y eventos', tipo:'fondo', aporte:75000, objetivo:0, inicial:0 });
    if (!S.settings.reto) S.settings.reto = { desde:'2026-10-01', objetivo:41200, base:56200 };
    if (!S.metas.length){
      const L = 'm_licencia', E = 'm_equipo';
      S.metas.push(
        { id:'m_garrix', nombre:'Concierto Martin Garrix', costo:100000, orden:1, fechaLimite:'2026-10-05', inicial:0, notas:'Boleta paga. Para pasajes y bebidas.' },
        { id:'m_calvin', nombre:'Concierto Calvin Harris', costo:100000, orden:2, fechaLimite:'2026-11-13', inicial:0, notas:'Boleta paga. Para pasajes y bebidas.' },
        { id:'m_parlante', nombre:'Parlante JBL Charge 6', costo:739900, orden:3, inicial:0, notas:'iShop Colombia, 29/09/2026. IP67, hasta 28 h de batería.' },
        { id:L, nombre:'Licencia de moto A2', costo:1262700, orden:4, inicial:0, notas:'Curso ≈ 750.000 + examen médico ≈ 240.000 + expedición 272.700.' },
        { id:E, nombre:'Casco y equipo de moto', costo:1560000, orden:5, despuesDe:L, inicial:0, notas:'Nivel recomendado: casco HJC i71 (ECE 22.06), guantes Predator, chaqueta certificada.' },
        { id:'m_celular', nombre:'Celular Galaxy S25 FE', costo:1799900, orden:6, inicial:0, notas:'Falabella, 29/09/2026 (en oferta; precio normal 3.499.900). Revisar precio al comprar.' },
        { id:'m_videobeam', nombre:'Videobeam XGIMI MoGo 3 Pro', costo:3059900, orden:7, inicial:0, notas:'Homecenter, 29/09/2026. Portátil, 1080p, Google TV.' },
        { id:'m_laptop', nombre:'Laptop Lenovo LOQ (RTX 4060)', costo:6999900, orden:8, inicial:0, notas:'Homecenter, 29/09/2026. Ryzen 7 8845HS, 16 GB (ampliable a 32 GB), RTX 4060. Sirve para TIA Portal, juegos y diseño.' },
        { id:'m_moto', nombre:'Moto Pulsar RS 200 (con SOAT y matrícula)', costo:16763000, orden:9, despuesDe:E, inicial:0, notas:'15.999.000 + SOAT 343.300 + matrícula 420.700 (precios 2026).' }
      );
    }
    await guardar();
  }
  if (!S.categorias.gasto.some(c=>c.id==='antojos')){ const i = S.categorias.gasto.findIndex(c=>c.id==='alimentacion'); S.categorias.gasto.splice(i+1,0,{ id:'antojos', nombre:'Antojos', subs:['Tintos extra','Dulces y snacks','Gaseosas','Comida extra'] }); await guardar(); }
  bloqueado = !!S.settings.pinHash;
  render();
  if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
