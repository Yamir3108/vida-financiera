<body>
<div id="app"></div>
<div id="sheet" class="sheet hidden"></div>
<div id="toast" class="toast"></div>
<script>
'use strict';
/* =========================================================
   Vida Financiera — fase 1
   Datos guardados solo en este celular (IndexedDB).
   ========================================================= */

// ---------- almacenamiento ----------
const DB_NAME = 'vidafin', STORE = 'kv';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function dbGet(k){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction(STORE,'readonly').objectStore(STORE).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function dbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}

// ---------- utilidades ----------
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addD = (s,n) => { const d = pd(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffD = (a,b) => Math.round((pd(b)-pd(a))/864e5);
const lastDay = (y,m) => new Date(y,m,0).getDate();
const hoy = () => window.__HOY || ymd(new Date());
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const miles = n => String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const $$ = n => (Math.round(n||0) < 0 ? '−' : '') + '$' + miles(n||0);
const num = s => { const v = String(s??'').replace(/[^\d]/g,''); return v ? Number(v) : 0; };
const norm = t => String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
const fcorta = s => { const d = pd(s); return `${d.getDate()} ${MESES[d.getMonth()]}`; };
const fanio = s => fcorta(s) + (s.slice(0,4)!==hoy().slice(0,4) ? ' '+s.slice(0,4) : '');
const flarga = s => { const d = pd(s); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`; };
const pct = (a,b) => b > 0 ? Math.max(0, Math.min(100, a/b*100)) : 0;

// ---------- estado por defecto ----------
function estadoInicial(){
  const t = hoy();
  return {
    version: 1, creado: t,
    settings: { pinHash:null, salt:null, lockMin:3, lastBackup:null, quincenaMonto:null, cierres:{}, onboarded:false },
    cuentas: [
      { id:'bancolombia', nombre:'Bancolombia', saldoInicial:null },
      { id:'nequi', nombre:'Nequi', saldoInicial:null },
      { id:'efectivo', nombre:'Efectivo', saldoInicial:null },
    ],
    categorias: {
      ingreso: [
        { id:'nomina', nombre:'Nómina', subs:['Quincena'] },
        { id:'comision', nombre:'Comisión', subs:[] },
        { id:'prima', nombre:'Prima', subs:[] },
        { id:'extra', nombre:'Trabajos extra', subs:['Freelance','Proyectos por fuera'] },
        { id:'ventas', nombre:'Ventas / negocio', subs:[] },
        { id:'rendimientos', nombre:'Rendimientos', subs:[] },
        { id:'cadena', nombre:'Cadena recibida', subs:[], real:false, sistema:true },
        { id:'regalo', nombre:'Regalo', subs:[] },
        { id:'otro_i', nombre:'Otro', subs:[] },
      ],
      gasto: [
        { id:'vivienda', nombre:'Vivienda', subs:['Arriendo','Internet','Luz','Agua','Gas','Aseo y cosas del hogar'] },
        { id:'comunicaciones', nombre:'Comunicaciones', subs:['Plan celular'] },
        { id:'alimentacion', nombre:'Alimentación', subs:['Desayuno','Almuerzo','Cena','Mercado','Domicilios','Café y snacks'] },
        { id:'antojos', nombre:'Antojos', subs:['Tintos extra','Dulces y snacks','Gaseosas','Comida extra'] },
        { id:'transporte', nombre:'Transporte', subs:['Recarga TuLlave','Taxi o app','Viaje fuera de la ciudad'] },
        { id:'personal', nombre:'Personal', subs:['Ropa y calzado','Aseo personal','Peluquería'] },
        { id:'salud', nombre:'Salud', subs:['Medicamentos','Citas y exámenes'] },
        { id:'mascota', nombre:'Mascota', subs:['Comida','Veterinario','Accesorios'] },
        { id:'pareja', nombre:'Pareja y salidas', subs:['Salidas','Regalos'] },
        { id:'entretenimiento', nombre:'Entretenimiento', subs:['Suscripciones','Eventos y planes','Viajes'] },
        { id:'educacion', nombre:'Educación', subs:['Cursos','Libros'] },
        { id:'familia', nombre:'Familia', subs:['Apoyo a familia'] },
        { id:'trabajo', nombre:'Trabajo', subs:['Gastos no reembolsados'] },
        { id:'financieros', nombre:'Financieros', subs:['4x1000','Cuotas de manejo','Intereses y mora'] },
        { id:'otros', nombre:'Otros', subs:['Imprevistos','Sin clasificar'] },
      ],
    },
    supervivencia: [
      { id:'s1', nombre:'Transporte', porDia:7200, cat:'transporte' },
      { id:'s2', nombre:'Desayuno', porDia:9000, cat:'alimentacion' },
      { id:'s3', nombre:'Almuerzo', porDia:20000, cat:'alimentacion' },
      { id:'s4', nombre:'Cena', porDia:15000, cat:'alimentacion' },
    ],
    fijos: [],
    deudas: [],
    metas: [],
    porCobrar: [],
    bolsillos: [
      { id:'emergencia', nombre:'Fondo de emergencia', tipo:'emergencia', aporte:20000, inicial:0, sistema:true },
      { id:'cadena', nombre:'Cadena', tipo:'cadena', aporte:100000, recibes:1100000, fechaEntrega:'2026-12-15', fechaFin:'2026-12-30', inicial:null, sistema:true },
    ],
    movs: [],
  };
}

let S = null;            // estado
let view = 'inicio';     // pantalla actual
let movMes = null;       // mes filtrado en movimientos
let movFiltro = { tipo:'', cat:'', cuenta:'' };
let bloqueado = true;
let hiddenAt = 0;

async function guardar(){ await dbSet('state', S); }

// ---------- tipos de movimiento ----------
const TIPOS = {
  gasto:     { l:'Gasto' },
  ingreso:   { l:'Ingreso' },
  pago:      { l:'Pago de deuda' },
  apartar:   { l:'Apartar' },
  sacar:     { l:'Sacar de bolsillo' },
  prestamo:  { l:'Préstamo recibido' },
  reintegro: { l:'Reintegro' },
  transfer:  { l:'Transferencia' },
  cadena:    { l:'Aporte a cadena' },
  prestado:  { l:'Préstamo dado' },
  cobro:     { l:'Cobro recibido' },
};
const catDe = (tipo,id) => (S.categorias[tipo]||[]).find(c=>c.id===id);
const catNombre = (id) => (catDe('gasto',id)||catDe('ingreso',id)||{}).nombre || id || '';
const cuentaNombre = id => (S.cuentas.find(c=>c.id===id)||{}).nombre || '—';

// ---------- quincenas ----------
const nom15 = (y,m) => `${y}-${pad(m)}-15`;
const nom30 = (y,m) => `${y}-${pad(m)}-${pad(Math.min(30,lastDay(y,m)))}`;
function nominales(s){
  const d = pd(s); const out=[];
  for(let k=-2;k<=2;k++){ let y=d.getFullYear(), m=d.getMonth()+1+k; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} out.push(nom15(y,m), nom30(y,m)); }
  return out.sort();
}
const nominalCercana = s => nominales(s).reduce((b,n)=>Math.abs(diffD(s,n))<Math.abs(diffD(s,b))?n:b);
const nominalSiguiente = n => nominales(n).find(x=>x>n);
const nominalUltima = s => nominales(s).filter(x=>x<=s).pop();

function quincenaDe(fecha, movs){
  const pagos = movs.filter(m=>m.tipo==='ingreso'&&m.catId==='nomina').map(m=>m.fecha).sort();
  const L = pagos.filter(f=>f<=fecha).pop();
  const N = nominalUltima(fecha);
  let start, own;
  if (L && L >= addD(N,-5)) { start = L; own = nominalCercana(L); }
  else { start = N; own = N; }
  const nxt = nominalSiguiente(own);
  let end = addD(nxt,-1);
  const temprano = pagos.find(f=>f>start && f>=addD(nxt,-5) && f<=nxt);
  if (temprano) end = addD(temprano,-1);
  return { start, end, own, tipo: own.slice(8)==='15' ? '15' : '30', dias: diffD(start,end)+1 };
}

// ---------- cálculo central ----------
function calcular(){ const C = calcularBase(); agregarV11(C); return C; }
function calcularBase(){
  const T = hoy();
  const movs = [...S.movs].sort((a,b)=> a.fecha<b.fecha?-1 : a.fecha>b.fecha?1 : a.creado-b.creado);
  const saldo = {}; S.cuentas.forEach(c=> saldo[c.id] = Number(c.saldoInicial||0));
  const bal = {};
  S.bolsillos.forEach(b=> bal[b.id] = Number(b.inicial||0));
  (S.metas||[]).forEach(mt=> bal[mt.id] = Number(mt.inicial||0));
  let reponer = 0;
  const add = (id,v) => { if (id in saldo) saldo[id] += v; };
  const take = (k,v) => { bal[k] = Math.max(0,(bal[k]||0)-v); };
  for (const m of movs){
    const a = Number(m.monto)||0;
    switch(m.tipo){
      case 'ingreso': add(m.cuentaId,a); if (m.catId==='cadena') bal.cadena = 0; break;
      case 'prestamo': case 'reintegro': add(m.cuentaId,a); break;
      case 'gasto': case 'pago': if (m.previo) break; add(m.cuentaId,-a); if (m.bolsillo) take(m.bolsillo,a); break;
      case 'cadena': add(m.cuentaId,-a); bal.cadena = (bal.cadena||0)+a; break;
      case 'prestado': add(m.cuentaId,-a); break;
      case 'cobro': add(m.cuentaId,a); break;
      case 'transfer': add(m.cuentaId,-a); add(m.cuentaDestinoId,a); break;
      case 'apartar': bal[m.bolsillo] = (bal[m.bolsillo]||0)+a; if (m.bolsillo==='emergencia') reponer = Math.max(0,reponer-a); break;
      case 'sacar': take(m.bolsillo,a); if (m.bolsillo==='emergencia') reponer += a; break;
    }
  }
  const esInvC = id => (S.cuentas.find(c=>c.id===id)||{}).tipo==='inversion';
  const saldoTotal = Object.entries(saldo).filter(([id])=>!esInvC(id)).reduce((s,[,v])=>s+v,0);
  const saldoInv = Object.entries(saldo).filter(([id])=>esInvC(id)).reduce((s,[,v])=>s+v,0);
  const apartado = Object.entries(bal).filter(([k])=>k!=='cadena').reduce((s,[,v])=>s+v,0);

  // supervivencia
  const grupos = {};
  S.supervivencia.forEach(r=>{ const g = grupos[r.cat] || (grupos[r.cat] = { cat:r.cat, porDia:0, rubros:[] }); g.porDia += Number(r.porDia)||0; g.rubros.push(r.nombre); });
  // la supervivencia cuenta desde el día en que empezaste a usar la app (la primera quincena va a medias)
  // Reserva diaria: se aparta lo que queda de HOY + lo de los días que faltan.
  // Lo que no gastaste en días pasados deja de estar reservado y se muestra como ahorro de la quincena.
  const superv = (q) => { const ini = S.creado > q.start ? S.creado : q.start; const dias = Math.max(0, diffD(ini,q.end)+1); return Object.values(grupos).map(g=>{
    const pres = g.porDia*dias; let gast = 0, gastHoy = 0, gastAntes = 0;
    movs.forEach(m=>{ if (m.fecha>=ini && m.fecha<=q.end && m.catId===g.cat){ let v = 0; if (m.tipo==='gasto' && !m.bolsillo && !m.previo) v = +m.monto; if (m.tipo==='reintegro') v = -m.monto; gast += v; if (m.fecha===T) gastHoy += v; else if (m.fecha<T) gastAntes += v; } });
    const enCurso = T>=ini && T<=q.end;
    const diasAntes = enCurso ? diffD(ini,T) : dias;              // días ya pasados de la quincena
    const diasDespues = enCurso ? diffD(T,q.end) : 0;             // días que faltan después de hoy
    const hoyRest = enCurso ? g.porDia - gastHoy : 0;
    const ahorro = g.porDia*diasAntes - gastAntes;                // + ahorraste, − te pasaste (días pasados)
    const reservaQ = enCurso ? Math.max(0,hoyRest) + g.porDia*diasDespues : 0;
    return { ...g, nombre: catNombre(g.cat), pres, gast, rest: pres-gast, dias, ini, gastHoy, hoyRest, ahorro, reservaQ, diasDespues, enCurso };
  }); };
  const q = quincenaDe(T, movs);
  const diasRest = Math.max(1, diffD(T,q.end)+1);
  const sv = superv(q);
  const reservado = sv.reduce((s,g)=>s+g.reservaQ,0);
  const ahorroSv = sv.reduce((s,g)=>s+g.ahorro,0);
  const disponible = saldoTotal - apartado - reservado;
  const libreDia = disponible > 0 ? disponible/diasRest : 0;

  // deudas
  const mesAct = T.slice(0,7);
  const [ty,tm] = T.split('-').map(Number);
  const dueEn = (y,m,dia) => `${y}-${pad(m)}-${pad(Math.min(dia,lastDay(y,m)))}`;
  const sigMes = (y,m) => m===12 ? [y+1,1] : [y,m+1];
  const deudas = S.deudas.map(d=>{
    const aj = (d.ajustes||[]);
    const conocido = d.saldoInicial!=null && d.saldoInicial!=='';
    const base = aj.length ? aj[aj.length-1] : { fecha:d.fechaInicio, saldo: conocido ? +d.saldoInicial : null, creado:d.creado };
    const despues = p => p.fecha>base.fecha || (p.fecha===base.fecha && p.creado>base.creado);
    const todos = movs.filter(m=>m.tipo==='pago'&&m.deudaId===d.id);
    const pagos = todos.filter(m=>!m.previo);
    const aumentos = movs.filter(m=>m.tipo==='prestamo'&&m.deudaId===d.id&&m.id!==d.origenMov&&despues(m)).reduce((s,m)=>s+ +m.monto,0);
    const saldoAct = base.saldo==null ? null : base.saldo + aumentos - pagos.filter(despues).reduce((s,m)=>s+ +m.monto,0);
    const totalPagado = pagos.reduce((s,m)=>s+ +m.monto,0);
    const intereses = aj.reduce((s,a)=>s+Math.max(0,a.diferencia||0),0);
    const pagadoMes = todos.filter(m=>m.fecha.slice(0,7)===mesAct).reduce((s,m)=>s+ +m.monto,0);
    let prox = null, atrasada = false, atrasadoMonto = 0, cuotasAtrasadas = 0, pagadoProx = false;
    const cuota = +d.cuota||0;
    if (d.tipo==='obligatoria' && d.diaPago && cuota>0){
      // cuotas que ya debieron pagarse: las vencidas al cargar la deuda + cada fecha de pago que pasó desde entonces
      let [y,m] = d.fechaInicio.split('-').map(Number); let vencidasDesde = 0;
      while (true){ const f = dueEn(y,m,d.diaPago); if (f >= T) break; if (f > d.fechaInicio) vencidasDesde++; [y,m] = sigMes(y,m); }
      const esperado = ((+d.vencidasIni||0) + vencidasDesde) * cuota;
      const pagado = todos.reduce((s,x)=>s+ +x.monto,0);
      let credito = pagado - esperado;
      atrasadoMonto = Math.max(0,-credito);
      if (saldoAct!=null) atrasadoMonto = Math.min(atrasadoMonto, Math.max(0,saldoAct));
      cuotasAtrasadas = Math.ceil(atrasadoMonto/cuota - 1e-9);
      atrasada = atrasadoMonto > 0.5;
      let nd = dueEn(ty,tm,d.diaPago); if (nd < T){ const [a,b] = sigMes(ty,tm); nd = dueEn(a,b,d.diaPago); }
      if (!atrasada && credito >= cuota){ pagadoProx = true; const [a,b] = sigMes(...nd.split('-').slice(0,2).map(Number)); nd = dueEn(a,b,d.diaPago); }
      prox = nd;
    }
    let tmes = 0;
    if (d.tasa) tmes = d.tasaTipo==='EA' ? Math.pow(1+d.tasa/100,1/12)-1 : d.tasa/100;
    const cerrada = saldoAct!=null && saldoAct <= 0.5;
    const fechaCierre = cerrada && pagos.length ? pagos[pagos.length-1].fecha : null;
    const prioridad = d.prioridad || (d.tipo==='obligatoria' ? 'alta' : 'media');
    return { ...d, prioridad, saldoAct, saldoConocido: saldoAct!=null, totalPagado, intereses, pagadoMes, cuotaMes:cuota, prox, atrasada, atrasadoMonto, cuotasAtrasadas, pagadoProx, tmes, interesEst: (saldoAct||0)*tmes, cerrada, fechaCierre, bolsillo: bal['deuda:'+d.id]||0, progreso: saldoAct==null ? 0 : pct(totalPagado, totalPagado+Math.max(0,saldoAct)) };
  });
  const activas = deudas.filter(d=>!d.cerrada);

  // fijos + deudas obligatorias (plan)
  const apartadoEnQ = key => movs.filter(m=>m.tipo==='apartar'&&m.bolsillo===key&&m.fecha>=q.start&&m.fecha<=q.end).reduce((s,m)=>s+ +m.monto,0);
  const vence = dia => { const d1 = `${ty}-${pad(tm)}-${pad(Math.min(dia,lastDay(ty,tm)))}`; return d1; };
  const plan = [
    ...S.fijos.map(f=>{
      const key = 'fijo:'+f.id;
      const pagadoMes = movs.filter(m=>m.tipo==='gasto'&&m.bolsillo===key&&m.fecha.slice(0,7)===mesAct).reduce((s,m)=>s+ +m.monto,0);
      const pagado = pagadoMes >= (+f.monto) - 0.5;
      let prox = vence(+f.diaPago);
      if (pagado){ let y=ty,m=tm+1; if(m>12){m=1;y++;} prox = `${y}-${pad(m)}-${pad(Math.min(+f.diaPago,lastDay(y,m)))}`; }
      return { key, kind:'fijo', ref:f, nombre:f.nombre, monto:+f.monto, dia:+f.diaPago, q15:+f.q15||0, q30:+f.q30||0, pagado, pagadoMes, prox, atrasado: !pagado && T>prox };
    }),
    ...activas.filter(d=>d.tipo==='obligatoria').map(d=>({ key:'deuda:'+d.id, kind:'deuda', ref:d, nombre:d.nombre, monto: cuotaEn(d, d.prox||T) || 0, dia:+d.diaPago, q15:+d.q15||0, q30:+d.q30||0, pagado: d.pagadoProx, pagadoMes:0, prox:d.prox, atrasado:d.atrasada, atrasadoMonto:d.atrasadoMonto })),
  ].map(p=>{
    // la parte de esta quincena es para el próximo pago que cae desde el inicio de la quincena;
    // si el pago de este mes ya se hizo y caía dentro de esta quincena, esa parte ya se usó.
    const dueThis = p.dia ? `${ty}-${pad(tm)}-${pad(Math.min(p.dia,lastDay(ty,tm)))}` : null;
    const porcion = (p.pagado && dueThis && dueThis >= q.start) ? 0 : (q.tipo==='15' ? p.q15 : p.q30);
    const enQ = apartadoEnQ(p.key);
    const b0 = bal[p.key]||0;
    const venceEnQ = !!p.prox && p.prox <= q.end;   // si el próximo pago cae antes de la siguiente quincena, toca tener todo ya
    const faltaQ = venceEnQ ? Math.max(0, p.monto-b0) : Math.max(0, porcion-enQ);
    return { ...p, bal: b0, porcion: venceEnQ ? p.monto : porcion, venceEnQ, apartadoQ: enQ, faltaQ, faltaPago: p.pagado ? 0 : Math.max(0, p.monto-b0) };
  }).sort((a,b)=> (a.prox||'9') < (b.prox||'9') ? -1 : 1);

  // fondos
  const basicos = Object.values(grupos).reduce((s,g)=>s+g.porDia*30,0) + S.fijos.reduce((s,f)=>s+(+f.monto||0),0) + activas.filter(d=>d.tipo==='obligatoria').reduce((s,d)=>s+(+d.cuota||0),0);
  const emerg = S.bolsillos.find(b=>b.id==='emergencia');
  const cadena = S.bolsillos.find(b=>b.id==='cadena');
  const emergQ = apartadoEnQ('emergencia');
  const cadenaQ = movs.filter(m=>m.tipo==='cadena'&&m.fecha>=q.start&&m.fecha<=q.end).reduce((s,m)=>s+ +m.monto,0);
  const cadenaActiva = cadena && T <= (cadena.fechaFin||'0000');
  const qParcial = S.creado > q.start; // primera quincena: lo aportado antes va en "lo que llevabas"
  const cadenaPend = cadenaActiva && !qParcial && cadenaQ < cadena.aporte;
  const otrosB = S.bolsillos.filter(b=>!b.sistema).map(b=>({ ...b, bal: bal[b.id]||0, apartadoQ: apartadoEnQ(b.id) }));

  // mes: gastos por categoría
  const enR = (m,a,b) => m.fecha>=a.start && m.fecha<=a.end;
  const porCat = qq => { const r = {}; movs.forEach(m=>{ if (!enR(m,qq)) return; if (m.tipo==='gasto' && !m.previo) r[m.catId]=(r[m.catId]||0)+ +m.monto; if (m.tipo==='reintegro') r[m.catId]=(r[m.catId]||0)- +m.monto; }); return r; };
  const qAnt = quincenaDe(addD(q.start,-1), movs);
  const catMes = porCat(q), catPrev = porCat(qAnt);
  const ingresosMes = movs.filter(m=>m.tipo==='ingreso'&&enR(m,q)&&(catDe('ingreso',m.catId)||{}).real!==false).reduce((s,m)=>s+ +m.monto,0);
  const gastosMes = Object.values(catMes).reduce((s,v)=>s+v,0);
  const pagosMes = movs.filter(m=>m.tipo==='pago'&&!m.previo&&enR(m,q)).reduce((s,m)=>s+ +m.monto,0);

  // cierre de la quincena anterior
  let cierre = null;
  const qPrev = quincenaDe(addD(q.start,-1), movs);
  if (S.creado <= qPrev.end && !S.settings.cierres[qPrev.start]){
    const svp = superv(qPrev); const sob = svp.reduce((s,g)=>s+g.rest,0);
    if (sob > 0) cierre = { q:qPrev, sobrante: sob };
  }

  // metas
  const metas = (S.metas||[]).map(mt=>({ ...mt, bal: bal[mt.id]||0, falta: Math.max(0,(+mt.costo||0)-(bal[mt.id]||0)), lista: (bal[mt.id]||0) >= (+mt.costo||0) && (+mt.costo||0)>0 })).sort((a,b)=>(a.orden||99)-(b.orden||99));
  metas.forEach(mt=>{ const pre = mt.despuesDe && metas.find(x=>x.id===mt.despuesDe); mt.bloqueada = !!(pre && !pre.lista && !pre.cumplida); mt.preNombre = pre ? pre.nombre : ''; });
  // me deben
  const porCobrar = (S.porCobrar||[]).map(pc=>{ const dado = movs.filter(m=>m.tipo==='prestado'&&m.cobrarId===pc.id).reduce((s,m)=>s+ +m.monto,0); const cobrado = movs.filter(m=>m.tipo==='cobro'&&m.cobrarId===pc.id).reduce((s,m)=>s+ +m.monto,0); return { ...pc, dado, cobrado, saldo: dado-cobrado }; });
  // reto de supervivencia
  let reto = null;
  if (S.settings.reto){
    const r = S.settings.reto; const catsR = new Set([...Object.keys(grupos),'antojos']);
    const dias = T>=r.desde ? diffD(r.desde,T)+1 : 0;
    const porSub = {}; let total = 0;
    movs.forEach(m=>{ if (m.fecha<r.desde||m.fecha>T||!catsR.has(m.catId)) return; let v=0; if (m.tipo==='gasto'&&!m.bolsillo&&!m.previo) v=+m.monto; if (m.tipo==='reintegro') v=-m.monto; if (!v) return; total+=v; const k = catNombre(m.catId)+(m.sub?' › '+m.sub:''); porSub[k]=(porSub[k]||0)+v; });
    const prom = dias ? total/dias : 0;
    const top = Object.entries(porSub).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>({ k, v, dia: dias? v/dias : 0 }));
    reto = { ...r, dias, total, prom, top, empezo: dias>0 };
  }

  // alertas
  const alertas = [];
  porCobrar.filter(pc=>pc.saldo>0&&pc.fechaEsperada&&pc.fechaEsperada<T).forEach(pc=> alertas.push({ n:'amarillo', t:`${pc.persona} te iba a pagar el ${fcorta(pc.fechaEsperada)} (${$$(pc.saldo)}).` }));
  metas.filter(mt=>!mt.cumplida&&mt.fechaLimite&&mt.falta>0&&diffD(T,mt.fechaLimite)>=0&&diffD(T,mt.fechaLimite)<=7).forEach(mt=> alertas.push({ n:'amarillo', t:`${mt.nombre} es el ${fcorta(mt.fechaLimite)} y faltan ${$$(mt.falta)} por apartar.` }));
  activas.filter(d=>d.atrasada).forEach(d=> alertas.push({ n: d.acordado?'amarillo':'rojo', t:`${d.nombre}: ${d.cuotasAtrasadas} ${d.cuotasAtrasadas===1?'cuota atrasada':'cuotas atrasadas'} por ${$$(d.atrasadoMonto)}${d.acordado?' (acordado, no es urgente)':''}.` }));
  activas.filter(d=>d.tipo!=='obligatoria'&&d.fechaFinal&&d.saldoAct>0).forEach(d=>{ const dd = diffD(T,d.fechaFinal); if (dd<0) alertas.push({ n:'rojo', t:`Quedaste de pagarle a ${d.nombre} el ${fcorta(d.fechaFinal)} (${$$(d.saldoAct)}).` }); else if (dd<=3) alertas.push({ n:'amarillo', t:`${dd===0?'Hoy':dd===1?'Mañana':`En ${dd} días`} le tienes que pagar a ${d.nombre}: ${$$(d.saldoAct)}.` }); });
  plan.filter(p=>p.kind==='fijo'&&p.atrasado).forEach(p=> alertas.push({ n:'rojo', t:`${p.nombre}: vencía el ${fcorta(p.prox)} y no está registrado como pagado.` }));
  if (disponible < 0){
    const hasta = fcorta(addD(q.end,1));
    if (apartado <= 0) alertas.push({ n:'rojo', t:`Lo que tienes (${$$(saldoTotal)}) no alcanza para la supervivencia que queda (${$$(reservado)}). Te faltan ${$$(-disponible)} para llegar al ${hasta}.` });
    else alertas.push({ n:'rojo', t:`Te faltan ${$$(-disponible)}: lo que tienes (${$$(saldoTotal)}) no cubre lo apartado (${$$(apartado)}) más la supervivencia que queda (${$$(reservado)}).` });
  }
  plan.filter(p=>!p.pagado && p.faltaPago>0 && p.prox && diffD(T,p.prox)>=0 && diffD(T,p.prox)<=5).forEach(p=> alertas.push({ n:'amarillo', t:`${p.nombre} se paga el ${fcorta(p.prox)} y faltan ${$$(p.faltaPago)} por apartar.` }));
  sv.filter(g=>g.ahorro+Math.min(0,g.hoyRest)<0).forEach(g=> alertas.push({ n:'amarillo', t:`${g.nombre}: en esta quincena vas ${$$(-(g.ahorro+Math.min(0,g.hoyRest)))} por encima de tu presupuesto diario.` }));
  if (reponer > 0) alertas.push({ n:'amarillo', t:`Sacaste ${$$(reponer)} del fondo de emergencia. Repónlo cuando puedas.` });
  if (cadena && cadena.inicial==null && cadenaActiva) alertas.push({ n:'info', t:'Falta anotar cuánto llevas aportado a la cadena (Plan → Cadena).' });
  if (S.deudas.length===0) alertas.push({ n:'info', t:'Aún no has cargado tus deudas (pestaña Deudas).' });
  if (S.fijos.length===0) alertas.push({ n:'info', t:'Aún no has cargado tus gastos fijos (pestaña Plan).' });

  const meses = basicos>0 ? (bal.emergencia||0)/basicos : 0;
  let estado = 'verde', razon = 'Todo al día.';
  if (alertas.some(a=>a.n==='rojo')) { estado='rojo'; razon = alertas.find(a=>a.n==='rojo').t; }
  else if (meses < 1 || alertas.some(a=>a.n==='amarillo')) { estado='amarillo'; razon = alertas.find(a=>a.n==='amarillo')?.t || `El fondo de emergencia cubre ${meses.toFixed(1).replace('.',',')} meses; la primera meta es 1 mes.`; }

  return { T, movs, saldo, saldoTotal, saldoInv, bal, apartado, q, diasRest, sv, reservado, ahorroSv, disponible, libreDia, deudas, activas, plan, basicos, meses, emerg, cadena, emergQ, cadenaQ, cadenaActiva, cadenaPend, qParcial, otrosB, reponer, catMes, catPrev, qAnt, ingresosMes, gastosMes, pagosMes, cierre, alertas, estado, razon, metas, porCobrar, reto };
}

// =========================================================
// v11 — "hoy puedes gastar", compromisos de cada pago, ahorro, racha
// =========================================================
function cuotaEn(d, f){ let c = +d.cuota||0; (d.cambios||[]).forEach(x=>{ if (f>=x.desde) c = +x.cuota; }); return c; }
function pagosEntre(a, b){ const out = []; let cur = addD(a,-1); for (let i=0;i<40;i++){ const nx = nominales(cur).find(x=>x>cur); if (!nx || nx>b) break; out.push(nx); cur = nx; } return out; }
// plata libre (sin lo apartado en bolsillos) al final de una fecha
function libreEn(fecha){
  const inv = id => (S.cuentas.find(c=>c.id===id)||{}).tipo==='inversion';
  let s = S.cuentas.filter(c=>c.tipo!=='inversion').reduce((a,c)=>a+Number(c.saldoInicial||0),0); const bal = {};
  S.bolsillos.forEach(b=>bal[b.id]=Number(b.inicial||0)); (S.metas||[]).forEach(m=>bal[m.id]=Number(m.inicial||0));
  const take = (k,v)=>{ bal[k] = Math.max(0,(bal[k]||0)-v); };
  [...S.movs].filter(m=>m.fecha<=fecha).sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:a.creado-b.creado).forEach(m=>{ const a = +m.monto||0;
    if (m.tipo==='transfer'){ if (inv(m.cuentaDestinoId)&&!inv(m.cuentaId)) s-=a; if (inv(m.cuentaId)&&!inv(m.cuentaDestinoId)) s+=a; return; }
    if (m.cuentaId && inv(m.cuentaId)) return;
    switch(m.tipo){ case 'ingreso': s+=a; if (m.catId==='cadena') bal.cadena=0; break; case 'prestamo': case 'reintegro': case 'cobro': s+=a; break;
      case 'gasto': case 'pago': if (m.previo) break; s-=a; if (m.bolsillo) take(m.bolsillo,a); break; case 'cadena': s-=a; bal.cadena=(bal.cadena||0)+a; break; case 'prestado': s-=a; break;
      case 'apartar': bal[m.bolsillo]=(bal[m.bolsillo]||0)+a; break; case 'sacar': take(m.bolsillo,a); break; } });
  return s - Object.entries(bal).filter(([k])=>k!=='cadena').reduce((x,[,v])=>x+v,0);
}
const esGastoVida = m => (m.tipo==='gasto' && !m.bolsillo && !m.previo) ? +m.monto : m.tipo==='reintegro' ? -m.monto : 0;
function sigMetaTurno(C){ return C.metas.filter(mt=>!mt.cumplida&&!mt.fechaLimite&&!mt.bloqueada&&mt.falta>0)[0] || null; }
function pendientesReponer(){
  const r = {}; const ss = [...S.movs].sort((a,b)=>a.fecha<b.fecha?-1:1);
  ss.forEach(m=>{ if (m.tipo==='sacar' && m.reponer) r[m.bolsillo] = (r[m.bolsillo]||0) + +m.monto; if (m.tipo==='apartar' && m.reponerDe) r[m.bolsillo] = Math.max(0,(r[m.bolsillo]||0) - +m.monto); });
  Object.keys(r).forEach(k=>{ if (r[k]<=0.5) delete r[k]; });
  return r;
}
// Todo lo que este pago tiene que cubrir (lo usan Inicio y Repartir)
function compromisos(C){
  const q = C.q, T = C.T, out = [];
  const pos = new Set((S.settings.pospuestos||{})[q.start]||[]);
  const enQ = key => C.movs.filter(m=>m.tipo==='apartar'&&m.bolsillo===key&&m.fecha>=q.start&&m.fecha<=q.end).reduce((s,m)=>s+ +m.monto,0);
  C.plan.filter(p=>p.faltaQ>0).forEach(p=> out.push({ key:p.key, nombre:p.nombre, monto:Math.round(p.faltaQ), tipo:'apartar', kind:'plan', on:!pos.has(p.key), cuenta:true,
    det: p.pagado ? 'para el pago del próximo mes' : p.venceEnQ ? (p.prox<T?`venció el ${fcorta(p.prox)}`:`se paga el ${fcorta(p.prox)}`) : `mitad para el ${fcorta(p.prox)}` }));
  C.activas.filter(d=>d.tipo!=='obligatoria'&&d.fechaFinal&&d.fechaFinal<=q.end&&d.saldoAct>0).forEach(d=>{ const f = Math.max(0,d.saldoAct-d.bolsillo); if (f>0) out.push({ key:'deuda:'+d.id, nombre:`Devolverle a ${d.nombre}`, monto:f, tipo:'apartar', kind:'devolver', on:!pos.has('deuda:'+d.id), cuenta:true, det:`quedaste de pagarle el ${fcorta(d.fechaFinal)}` }); });
  if (C.cadena && C.cadenaPend) out.push({ key:'cadena', nombre:'Aporte a la cadena', monto:C.cadena.aporte-C.cadenaQ, tipo:'cadena', kind:'cadena', on:!pos.has('cadena'), cuenta:true, det:'sale plata real', cuentaId:S.cuentas[0]?.id });
  C.metas.filter(mt=>!mt.cumplida&&mt.fechaLimite&&mt.fechaLimite>=T&&mt.falta>0&&mt.fechaLimite<=addD(q.start,45)).forEach(mt=>{
    const ya = enQ(mt.id); const n = Math.max(1, pagosEntre(q.own, addD(mt.fechaLimite,-1)).length);
    const m = Math.ceil((mt.falta+ya)/n) - ya; if (m>0) out.push({ key:mt.id, nombre:mt.nombre, monto:m, tipo:'apartar', kind:'meta', on:!pos.has(mt.id), cuenta:true, det:`es el ${fcorta(mt.fechaLimite)} · ${n===1?'último pago antes':`1 de ${n} pagos`}` }); });
  const am = S.settings.ahorroMin;
  if (am && am.monto>0 && q.own >= (am.desde||'0')){
    const em = Math.min(am.emergencia||0, am.monto), fe = Math.max(0, em - C.emergQ);
    if (fe>0) out.push({ key:'emergencia', nombre:'Ahorro: fondo de emergencia', monto:fe, tipo:'apartar', kind:'ahorro', on:!pos.has('ahorro:emergencia'), posKey:'ahorro:emergencia', cuenta:true, det:'ahorro obligatorio de cada pago' });
    const mt = sigMetaTurno(C);
    if (mt){ const yaM = C.metas.filter(x=>!x.fechaLimite).reduce((s,x)=>s+enQ(x.id),0); const fm = Math.max(0, am.monto - em - yaM); if (fm>0) out.push({ key:mt.id, nombre:`Ahorro: ${mt.nombre}`, monto:Math.min(fm, mt.falta), tipo:'apartar', kind:'ahorro', on:!pos.has('ahorro:meta'), posKey:'ahorro:meta', cuenta:true, det:'meta en turno (la más barata primero)' }); }
  }

function quincenaNombre(q){ return `Pago del ${fcorta(q.own||q.start)}`; }
function svRow(g,C){
  const hoy = C.gastoDia(C.T, g.cat); let pago = 0, dias = 0;
  for (let f = (S.creado>C.q.start?S.creado:C.q.start); f<=C.T; f = addD(f,1)){ pago += C.gastoDia(f, g.cat); dias++; }
  const prom = dias ? pago/dias : 0; const sobre = prom > g.porDia;
  return `<div style="margin-top:12px"><div class="row"><span class="col"><span>${esc(g.nombre)}</span><span class="tiny faint">lo normal: ${$$(g.porDia)}/día</span></span><span class="col" style="align-items:flex-end"><b>${$$(hoy)}</b><span class="tiny faint">hoy</span></span></div><div class="bar ${sobre?'over':''}"><i style="width:${pct(prom,g.porDia)}%"></i></div><div class="tiny faint" style="margin-top:3px">En este pago: ${$$(pago)} · promedio <b class="${sobre?'neg':'pos'}">${$$(prom)}/día</b></div></div>`;
}


// ---------- MOVIMIENTOS ----------
function descMov(m){
  switch(m.tipo){
    case 'gasto': case 'ingreso': case 'reintegro': return `${catNombre(m.catId)}${m.sub?' › '+m.sub:''}`;
    case 'pago': return `Pago · ${(S.deudas.find(d=>d.id===m.deudaId)||{}).nombre||'deuda'}`;
    case 'apartar': return `Apartado · ${bolsilloNombre(m.bolsillo)}`;
    case 'sacar': return `Sacado · ${bolsilloNombre(m.bolsillo)}`;
    case 'prestamo': return `Préstamo de ${m.acreedor||''}`;
    case 'transfer': return `${cuentaNombre(m.cuentaId)} → ${cuentaNombre(m.cuentaDestinoId)}`;
    case 'cadena': return 'Aporte a cadena';
    case 'prestado': return `Le prestaste a ${(S.porCobrar.find(p=>p.id===m.cobrarId)||{}).persona||''}`;
    case 'cobro': return `${(S.porCobrar.find(p=>p.id===m.cobrarId)||{}).persona||''} te pagó`;
  }
  return m.tipo;
}
function signoMov(m){ if (m.previo) return 0; return ({ingreso:1,prestamo:1,reintegro:1,cobro:1,gasto:-1,pago:-1,cadena:-1,prestado:-1})[m.tipo]||0; }
function bolsilloNombre(k){
  if (!k) return '';
  if (k.startsWith('fijo:')) return (S.fijos.find(f=>'fijo:'+f.id===k)||{}).nombre||'fijo';
  if (k.startsWith('deuda:')) return (S.deudas.find(d=>'deuda:'+d.id===k)||{}).nombre||'deuda';
  const mt = (S.metas||[]).find(x=>x.id===k); if (mt) return mt.nombre;
  return (S.bolsillos.find(b=>b.id===k)||{}).nombre||k;
}
function vMovs(C){
  if (!movMes) movMes = C.T.slice(0,7);
  const [y,m] = movMes.split('-').map(Number);
  let list = C.movs.filter(x=>x.fecha.slice(0,7)===movMes);

  if (movFiltro.cat) list = list.filter(x=>x.catId===movFiltro.cat);
  if (movFiltro.cuenta) list = list.filter(x=>x.cuentaId===movFiltro.cuenta||x.cuentaDestinoId===movFiltro.cuenta);
  list = list.slice().reverse();
  const porDia = {}; list.forEach(x=>(porDia[x.fecha]=porDia[x.fecha]||[]).push(x));
  const cats = [...S.categorias.gasto, ...S.categorias.ingreso];
  const RM = resumenMes(C, movMes), Rp = resumenMes(C, mesAntes(movMes));
  const dlt = Rp.vida>0 ? Math.round((RM.vida-Rp.vida)/Rp.vida*100) : null;
  return `
  <div class="top"><h1>Movimientos</h1><button class="btn sm" data-a="cuadre">Cuadrar cuentas</button></div>
  <div class="wrap">
    <div class="row"><button class="btn sm" data-a="mes" data-d="-1">‹</button><b>${MESES_L[m-1]} ${y}</b><button class="btn sm" data-a="mes" data-d="1">›</button></div>
    <div class="card">
      <div class="row"><h2>Resumen de ${MESES_L[m-1]}</h2>${movMes===C.T.slice(0,7)?'<span class="tiny faint">hasta hoy</span>':''}</div>
      <table class="t" style="margin-top:8px">
        <tr><td>Entró</td><td class="pos">${$$(RM.entro)}</td></tr>
        <tr><td>Gastos de vida <span class="tiny faint">(comida, transporte, Kira, mecato…)</span></td><td>${$$(RM.vida)}</td></tr>
        <tr><td>Fijos pagados</td><td>${$$(RM.fijos)}</td></tr>
        <tr><td>Pagos a deudas</td><td>${$$(RM.deudas)}</td></tr>
        ${S.settings.metaExtra?`<tr><td>Trabajos extra</td><td>${$$(RM.extra)} <span class="tiny faint">/ meta ${$$(S.settings.metaExtra)}</span></td></tr>`:''}
        <tr><td>Ahorrado <span class="tiny faint">(emergencia, metas, fondos)</span></td><td class="${RM.ahorro>=0?'pos':'neg'}">${$$(RM.ahorro)}</td></tr>
      </table>
      ${RM.top.length?`<div class="small muted" style="margin-top:8px">En lo que más gastaste: ${RM.top.map(t=>`<b style="color:var(--text)">${esc(t[0])}</b> ${$$(t[1])}`).join(' · ')}</div>`:''}
      ${dlt!==null?`<div class="small" style="margin-top:6px">Gastos de vida vs ${MESES_L[(m+10)%12]}: <b class="${dlt<=0?'pos':'neg'}">${dlt>0?'+':''}${dlt}%</b> ${dlt<=0?'✅':''}</div>`:''}
    </div>
    <div class="grid2" style="margin-top:10px;grid-template-columns:1fr 1fr 1fr">
      <select class="i" data-a-change="filtro" data-k="tipo"><option value="">Tipo</option>${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}" ${movFiltro.tipo===k?'selected':''}>${v.l}</option>`).join('')}</select>
      <select class="i" data-a-change="filtro" data-k="cat"><option value="">Categoría</option>${cats.map(c=>`<option value="${c.id}" ${movFiltro.cat===c.id?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select>
      <select class="i" data-a-change="filtro" data-k="cuenta"><option value="">Cuenta</option>${S.cuentas.map(c=>`<option value="${c.id}" ${movFiltro.cuenta===c.id?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select>
    </div>
    <div class="list">
    ${Object.keys(porDia).length ? Object.entries(porDia).map(([f,xs])=>{ const gd = C.movs.filter(x=>x.fecha===f).reduce((a,x)=>a+esGastoVida(x),0); return `<div class="day row"><span>${flarga(f)}</span>${gd?`<span class="tiny">gastaste <b>${$$(gd)}</b></span>`:''}</div>${xs.map(x=>{ const s = signoMov(x); return `<div class="it" data-a="editar" data-id="${x.id}"><span class="dot" style="background:${s>0?'var(--pos)':s<0?'var(--neg)':'var(--faint)'}"></span><div class="grow"><div class="t">${esc(descMov(x))}</div><div class="tiny faint t">${x.previo?'Pagado antes de usar la app · no afecta el saldo':TIPOS[x.tipo].l}${x.cuentaId&&x.tipo!=='transfer'?' · '+esc(cuentaNombre(x.cuentaId)):''}${x.nota?' · '+esc(x.nota):''}</div></div><b class="${s>0?'pos':''}">${s>0?'+':s<0?'−':''}${$$(x.monto)}</b></div>`; }).join('')}`; }).join('') : '<div class="empty" style="padding:20px 0">No hay movimientos con estos filtros.</div>'}
    </div>
  </div>`;
}

function semaforoEndeud(C){ if (C.endeud==null) return ''; const p = C.endeud*100; const c = p<=30?'pos':p<=40?'warn':'neg';
  return `<div class="small" style="margin-top:8px">Tus cuotas son el <b class="${c}">${p.toFixed(1).replace('.',',')} %</b> de tu nómina (${$$(C.cuotasMes)} de ${$$(C.ingresoMes)} al mes). ${p<=30?'Sano.':p<=40?'En el límite: no tomes deudas nuevas.':'Alto: no tomes deudas nuevas.'} Meta: menos del 30 %.</div>`; }
const mesAntes = ym => { const [y,m] = ym.split('-').map(Number); return m===1 ? `${y-1}-12` : `${y}-${pad(m-1)}`; };
function resumenMes(C, ym){
  const xs = C.movs.filter(x=>x.fecha.slice(0,7)===ym && !x.previo);
  const entro = xs.filter(x=>x.tipo==='ingreso'&&(catDe('ingreso',x.catId)||{}).real!==false).reduce((a,x)=>a+ +x.monto,0);
  const vida = xs.reduce((a,x)=>a+esGastoVida(x),0);
  const fijos = xs.filter(x=>x.tipo==='gasto'&&x.bolsillo).reduce((a,x)=>a+ +x.monto,0);
  const deudas = xs.filter(x=>x.tipo==='pago').reduce((a,x)=>a+ +x.monto,0);
  const esAhorro = k => k==='emergencia' || (S.metas||[]).some(mt=>mt.id===k) || S.bolsillos.some(b=>b.id===k&&!b.sistema);
  const ahorro = xs.filter(x=>(x.tipo==='apartar'||x.tipo==='sacar')&&esAhorro(x.bolsillo)).reduce((a,x)=>a+(x.tipo==='apartar'?1:-1)*x.monto,0);
  const porSub = {}; xs.forEach(x=>{ const v = esGastoVida(x); if (!v) return; const k = x.sub || catNombre(x.catId); porSub[k]=(porSub[k]||0)+v; });
  const top = Object.entries(porSub).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const extra = xs.filter(x=>x.tipo==='ingreso'&&x.catId==='extra').reduce((a,x)=>a+ +x.monto,0);
  return { entro, vida, fijos, deudas, ahorro, top, extra };
}

  const conTasa = act.filter(d=>d.tmes>0).sort((a,b)=>b.tmes-a.tmes);
  const total = act.reduce((s,d)=>s+Math.max(0,d.saldoAct||0),0);

    ${conTasa.length ? `<div class="card soft small">Si te sobra plata para abonar extra, empieza por <b>${esc(conTasa[0].nombre)}</b>: es la de tasa más alta (${(conTasa[0].tmes*100).toFixed(2).replace('.',',')} % mensual).</div>`:''}

      <div class="row" style="margin-top:10px"><span class="mid">${d.saldoConocido?$$(d.saldoAct):'<span class="warn" style="font-size:16px">Saldo por confirmar</span>'}</span><span class="small muted">pagado ${$$(d.totalPagado)}</span></div>
      ${d.saldoConocido?`<div class="bar"><i style="width:${d.progreso}%"></i></div>`:''}

let obPaso = 0, pinBuf = '', pinPrimero = '', pinModo = 'unlock', pinMsg = '';
function onboarding(){
  if (obPaso===0) return `<div class="lock"><h1 style="font-size:26px">Vida Financiera</h1><p class="muted" style="text-align:center;max-width:320px">Anotas en un solo lugar y lo demás se calcula solo: supervivencia, fijos, deudas y lo que puedes gastar. Tus datos se quedan en este celular.</p><button class="btn pri" data-a="ob" data-d="1">Empezar</button><button class="link small" data-a="restore">Tengo un respaldo</button><input type="file" id="fileRestore" accept=".json,application/json" style="display:none"></div>`;
  if (obPaso===1) return pantallaPin('crear');
  if (obPaso===2) return `<div class="wrap"><div class="top" style="padding-left:0"><h1>Saldos de hoy</h1></div><p class="small muted">Escribe cuánto tienes hoy en cada cuenta, antes de anotar cualquier movimiento. Si no usas alguna, pon 0. Luego puedes agregar o renombrar cuentas.</p>${S.cuentas.map(c=>`<label class="f">${esc(c.nombre)}</label><input class="i money" style="font-size:20px" inputmode="numeric" data-money id="ob-${c.id}" placeholder="$0">`).join('')}<div class="hint" id="obErr"></div><button class="btn pri block" style="margin-top:18px" data-a="obSaldos">Guardar y entrar</button></div>`;
  return '';
}
function pantallaPin(modo){
  pinModo = modo;
  const titulo = { unlock:'Ingresa tu PIN', crear: pinPrimero?'Repite tu PIN':'Crea un PIN de 4 a 6 dígitos', actual:'PIN actual', nuevo: pinPrimero?'Repite el nuevo PIN':'Nuevo PIN (4 a 6 dígitos)' }[modo];
  const n = Math.max(4, pinBuf.length);
  const puedeOk = modo!=='unlock' && pinBuf.length>=4;
  return `<div class="lock"><h2>${titulo}</h2><div class="pins" id="pins">${Array.from({length: modo==='unlock'?Math.max(4,pinBuf.length):6},(_,i)=>`<i class="${i<pinBuf.length?'f':''}"></i>`).join('')}</div><div class="small ${pinMsg?'neg':'faint'}" style="min-height:20px">${esc(pinMsg)}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(k=>`<button data-a="pk" data-k="${k}">${k}</button>`).join('')}<button class="ghost" data-a="pk" data-k="del">Borrar</button><button data-a="pk" data-k="0">0</button><button class="ghost" data-a="pk" data-k="ok" ${modo==='unlock'||puedeOk?'':'disabled'}>OK</button></div>
  ${modo==='nuevo'||modo==='actual'?'<button class="link small" data-a="pinCancel">Cancelar</button>':''}</div>`;
}
async function hashPin(pin, salt){ const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt+':'+pin)); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function pinTecla(k){
  pinMsg = '';
  if (k==='del'){ pinBuf = pinBuf.slice(0,-1); return rerenderPin(); }
  if (k==='ok') return pinOk();
  if (pinBuf.length>=6) return;
  pinBuf += k;
  if (pinModo==='unlock' && pinBuf.length>=4){
    const h = await hashPin(pinBuf, S.settings.salt);
    if (h===S.settings.pinHash){ bloqueado = false; pinBuf=''; render(); return; }
    if (pinBuf.length===6){ pinMsg='PIN incorrecto'; pinBuf=''; rerenderPin(true); return; }
  }
  if (pinModo==='actual' && pinBuf.length>=4){
    const h = await hashPin(pinBuf, S.settings.salt);
    if (h===S.settings.pinHash){ pinBuf=''; pinPrimero=''; pinModo='nuevo'; return rerenderPin(); }
    if (pinBuf.length===6){ pinMsg='PIN incorrecto'; pinBuf=''; return rerenderPin(true); }
  }
  rerenderPin();
}
async function pinOk(){
  if (pinModo==='unlock'){ const h = await hashPin(pinBuf, S.settings.salt); if (h===S.settings.pinHash){ bloqueado=false; pinBuf=''; render(); } else { pinMsg='PIN incorrecto'; pinBuf=''; rerenderPin(true);} return; }
  if (pinModo==='actual'){ const h = await hashPin(pinBuf, S.settings.salt); pinBuf=''; if (h===S.settings.pinHash){ pinPrimero=''; pinModo='nuevo'; } else pinMsg='PIN incorrecto'; return rerenderPin(!!pinMsg); }
  if (pinBuf.length<4) return;
  if (!pinPrimero){ pinPrimero = pinBuf; pinBuf=''; return rerenderPin(); }
  if (pinPrimero!==pinBuf){ pinMsg='No coinciden. Empieza de nuevo.'; pinPrimero=''; pinBuf=''; return rerenderPin(true); }
  S.settings.salt = uid(); S.settings.pinHash = await hashPin(pinBuf, S.settings.salt);
  pinBuf=''; pinPrimero='';
  await guardar();
  if (!S.settings.onboarded){ obPaso = 2; render(); return; }
  cerrarSheet(); toast('PIN cambiado'); render();
}
function rerenderPin(shake){
  const target = document.getElementById('sheet').classList.contains('hidden') ? document.getElementById('app') : document.getElementById('sheet');
  target.innerHTML = pantallaPin(pinModo);
  if (shake){ const p = target.querySelector('#pins'); p && p.classList.add('shake'); }
}

const RAPIDOS = [
  { l:'🍽️ Almuerzo', c:'alimentacion', s:'Almuerzo' }, { l:'☕ Desayuno', c:'alimentacion', s:'Desayuno' }, { l:'🌙 Cena', c:'alimentacion', s:'Cena' },

];
function opcionesBolsillo(C, incluirFlex=true){
  const o = [];
  C.plan.filter(p=>incluirFlex || p.kind==='fijo').forEach(p=>o.push({ v:p.key, l:`${p.nombre} (${$$(p.bal)})` }));
  if (incluirFlex) C.activas.filter(d=>d.tipo!=='obligatoria').forEach(d=>o.push({ v:'deuda:'+d.id, l:`Para pagar ${d.nombre} (${$$(d.bolsillo)})` }));
  o.push({ v:'emergencia', l:`Fondo de emergencia (${$$(C.bal.emergencia||0)})` });
  C.otrosB.forEach(b=>o.push({ v:b.id, l:`${b.nombre} (${$$(b.bal)})` }));
  C.metas.filter(mt=>!mt.cumplida).forEach(mt=>o.push({ v:mt.id, l:`Meta: ${mt.nombre} (${$$(mt.bal)})` }));
  return o;
}

    if (F.esperada) pc.fechaEsperada = F.esperada;
    m.cobrarId = pc.id;
  }
  if (t==='cobro'){ m.cuentaId=F.cuentaId; m.cobrarId=F.cobrarId; }
  delete m.dias;
  if (t==='gasto'||t==='ingreso'||t==='reintegro'){ m.catId=F.catId; if (F.sub) m.sub=F.sub; m.cuentaId=F.cuentaId; if (t==='gasto' && F.bolsillo) m.bolsillo=F.bolsillo; if (t==='gasto' && !F.bolsillo && +F.dias>1) m.dias = +F.dias; }
  if (t==='gasto' && F.parteOn && !F.editId){ const pm = num(F.parteMonto); m.monto = monto - pm;
    let pc = S.porCobrar.find(x=>norm(x.persona)===norm(F.partePersona)); if (!pc){ pc = { id:'pc_'+uid(), persona:F.partePersona }; S.porCobrar.push(pc); }
    S.movs.push({ id:uid(), creado:m.creado+1, tipo:'prestado', monto:pm, fecha:F.fecha, cuentaId:F.cuentaId, cobrarId:pc.id, nota:`Su parte de ${F.sub||catNombre(F.catId)}` }); }
  if (t==='pago'){ m.deudaId=F.deudaId; m.cuentaId=F.cuentaId; m.bolsillo='deuda:'+F.deudaId; }
  if (t==='apartar'||t==='sacar'){ m.bolsillo=F.bolsillo; }

  if (t==='transfer'){ m.cuentaId=F.cuentaId; m.cuentaDestinoId=F.cuentaDestinoId; }
  if (t==='prestamo'){

    if (!d){ d = { id:uid(), origenMov:m.id, ajustes:[], notas:'Creada desde un préstamo recibido.' }; S.deudas.push(d); }

async function borrarMov(){
  const m = S.movs.find(x=>x.id===F.editId); if (!m) return;
  if (m.tipo==='prestamo'){
    const d = S.deudas.find(x=>x.origenMov===m.id);

    if (d && S.movs.some(x=>x.tipo==='pago'&&x.deudaId===d.id)) { document.getElementById('fErr').textContent='Esta deuda ya tiene pagos. Borra primero los pagos.'; return; }
    if (d && !confirm('Se borra el préstamo y la deuda que creó. ¿Seguro?')) return;
    if (!d && !confirm('¿Eliminar este préstamo? Se resta de lo que le debes.')) return;

}

async function guardarRepartir(){
  const C = calcular(); const q = C.q;
  const now = Date.now(); const f = hoy(); let k = 0;
  const pos = new Set((S.settings.pospuestos||{})[q.start]||[]);
  R.items.forEach(i=>{
    const pk = i.posKey || i.key;
    if (i.kind==='comision'){ (S.settings.comisionHecha = S.settings.comisionHecha||{})[q.start] = true; }
    if (i.kind==='sobrante'){ (S.settings.cierres = S.settings.cierres||{})[q.start] = i.on ? 'emergencia' : 'libre'; }

    else S.movs.push({ id:uid(), creado:now+k++, tipo:'apartar', monto:+i.monto, fecha:f, bolsillo:i.key, nota: i.kind==='comision'?'Comisión':i.kind==='ahorro'?'Ahorro obligatorio':i.kind==='sobrante'?'Sobrante del pago anterior':'Repartir' });
  });

}

function abrirFijo(id){
  const f = id ? S.fijos.find(x=>x.id===id) : { nombre:'', catId:'vivienda', sub:'', monto:'', diaPago:'', q15:'', q30:'', historial:[] };
  const cat = S.categorias.gasto.find(c=>c.id===f.catId);
  let h = `<label class="f">Nombre</label><input class="i" id="xNombre" value="${esc(f.nombre)}" placeholder="Ej: Arriendo">`;
  h += `<label class="f">Categoría</label><select class="i" id="xCat" data-a-change="xCat">${S.categorias.gasto.map(c=>`<option value="${c.id}" ${c.id===f.catId?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select>`;
  h += `<label class="f">Subcategoría (propia de este fijo)</label><select class="i" id="xSub">${(cat?cat.subs:[]).map(s=>`<option ${s===f.sub?'selected':''}>${esc(s)}</option>`).join('')}</select><div class="hint">Cuando registres un gasto con esta subcategoría, se descuenta de este bolsillo.</div>`;
  h += `<div class="grid2"><div><label class="f">Monto mensual</label><input class="i" id="xMonto" inputmode="numeric" data-money data-a-input="xReparto" value="${f.monto?'$'+miles(f.monto):''}"></div><div><label class="f">Día de pago</label><input class="i" id="xDia" inputmode="numeric" value="${esc(f.diaPago)}"></div></div>`;
  h += `<label class="f">Cuánto apartar en cada pago</label><div class="grid2"><div><div class="tiny faint">Pago del 15</div><input class="i" id="xQ15" inputmode="numeric" data-money value="${f.q15!==''?'$'+miles(f.q15||0):''}"></div><div><div class="tiny faint">Pago del 30</div><input class="i" id="xQ30" inputmode="numeric" data-money value="${f.q30!==''?'$'+miles(f.q30||0):''}"></div></div><div class="hint">Deben sumar el monto mensual. Si los dejas vacíos se reparte mitad y mitad.</div>`;
  if (id) h += `<label class="f">Motivo del cambio (si cambias el monto)</label><input class="i" id="xMotivo" placeholder="Ej: cambié de plan">`;
  h += `<div class="hint neg" id="xErr"></div><button class="btn pri block" style="margin-top:16px" data-a="fijoGuardar" data-id="${id||''}">Guardar</button>`;
  if (id && f.historial && f.historial.length) h += `<h3 style="margin:18px 0 6px">Historial de cambios</h3><table class="t">${f.historial.slice().reverse().map(x=>`<tr><td>${fcorta(x.fecha)} · ${esc(x.motivo)}</td><td>${$$(x.antes)} → ${$$(x.despues)}</td></tr>`).join('')}</table>`;
  if (id){ const pp = calcular().plan.find(x=>x.key==='fijo:'+id); if (pp && !pp.pagado) h += `<button class="btn block" style="margin-top:14px" data-a="yaPague" data-key="fijo:${id}">Ya lo había pagado antes de registrarlo</button><div class="hint">Solo si lo pagaste antes de anotarlo en la app: no descuenta de tu saldo.</div>`; }
  if (id) h += `<button class="btn danger block" style="margin-top:14px" data-a="fijoBorrar" data-id="${id}">Eliminar fijo</button>`;
  abrirSheet(id?'Editar fijo':'Nuevo fijo', h);
}
async function guardarFijo(id){
  const g = x => document.getElementById(x); const err = m => g('xErr').textContent = m;
  const nombre = g('xNombre').value.trim(), catId = g('xCat').value, sub = g('xSub').value, monto = num(g('xMonto').value), dia = num(g('xDia').value);
  let q15 = g('xQ15').value.trim()===''?null:num(g('xQ15').value), q30 = g('xQ30').value.trim()===''?null:num(g('xQ30').value);
  if (!nombre) return err('Escribe el nombre.');
  if (!monto) return err('Escribe el monto.');
  if (!dia || dia>31) return err('El día de pago va de 1 a 31.');
  if (q15===null && q30===null){ q15 = Math.floor(monto/2); q30 = monto-q15; }
  else { q15 = q15||0; q30 = q30||0; }
  if (q15+q30 !== monto) return err(`Las dos partes suman ${$$(q15+q30)} y el monto es ${$$(monto)}.`);
  const otro = S.fijos.find(x=>x.id!==id && x.catId===catId && x.sub===sub);
  if (otro) return err(`La subcategoría “${sub}” ya la usa ${otro.nombre}. Cada fijo necesita la suya.`);
  if (id){
    const f = S.fijos.find(x=>x.id===id);
    if (+f.monto !== monto){ const motivo = g('xMotivo').value.trim(); if (!motivo) return err('Escribe el motivo del cambio de monto.'); (f.historial=f.historial||[]).push({ fecha:hoy(), antes:+f.monto, despues:monto, motivo }); }
    Object.assign(f, { nombre, catId, sub, monto, diaPago:dia, q15, q30 });
  } else S.fijos.push({ id:uid(), nombre, catId, sub, monto, diaPago:dia, q15, q30, historial:[] });
  await guardar(); cerrarSheet(); toast('Fijo guardado'); render();
}

function abrirDeuda(id){
  const d = id ? S.deudas.find(x=>x.id===id) : { nombre:'', acreedor:'', saldoInicial:'', fechaInicio:hoy(), tipo:'obligatoria', cuota:'', diaPago:'', tasa:'', tasaTipo:'EA', fechaFinal:'', notas:'', q15:'', q30:'' };
  const tieneMovs = id && S.movs.some(m=>m.deudaId===id);
  let h = `<label class="f">Nombre</label><input class="i" id="dNombre" value="${esc(d.nombre)}" placeholder="Ej: ICETEX">`;

  h += `<div class="grid2"><div><label class="f">Saldo ${id?'inicial':'actual'}</label><input class="i" id="dSaldo" inputmode="numeric" data-money value="${d.saldoInicial!==''&&d.saldoInicial!=null?'$'+miles(d.saldoInicial):''}" placeholder="Vacío si no lo sabes" ${d.origenMov?'disabled':''}></div><div><label class="f">A la fecha</label><input class="i" type="date" id="dFecha" value="${d.fechaInicio}" ${d.origenMov?'disabled':''}></div></div>`;
  if (!d.origenMov) h += `<div class="hint">Si es de cuota fija y no sabes el saldo total, déjalo vacío: la app lleva las cuotas y lo pones luego con “Poner saldo del extracto”.</div>`;
  if (d.origenMov) h += `<div class="hint">Viene de un préstamo registrado; el monto se cambia editando ese movimiento.</div>`;
  else if (tieneMovs) h += `<div class="hint">Para corregir el saldo con lo que diga el banco, usa “Actualizar con extracto”.</div>`;
  h += `<label class="f">Tipo</label><select class="i" id="dTipo" data-a-change="dTipo"><option value="obligatoria" ${d.tipo==='obligatoria'?'selected':''}>Obligatoria mensual (entra a Fijos)</option><option value="flexible" ${d.tipo==='flexible'?'selected':''}>Flexible (sin cuota fija)</option></select>`;

    <label class="f">Cuánto apartar en cada pago</label><div class="grid2"><div><div class="tiny faint">Pago del 15</div><input class="i" id="dQ15" inputmode="numeric" data-money value="${d.q15!==''&&d.q15!=null?'$'+miles(d.q15):''}"></div><div><div class="tiny faint">Pago del 30</div><input class="i" id="dQ30" inputmode="numeric" data-money value="${d.q30!==''&&d.q30!=null?'$'+miles(d.q30):''}"></div></div><div class="hint">Vacíos = mitad y mitad.</div>
    <label class="f">Cuotas vencidas sin pagar a esa fecha</label><input class="i" id="dVenc" inputmode="numeric" value="${esc(d.vencidasIni||0)}"><div class="hint">Ej: si debes la de agosto y la de septiembre, pon 2. Si estás al día, 0.</div></div>`;
  const prActual = d.prioridad || (d.tipo==='obligatoria'?'alta':'media');
  h += `<label class="f">Prioridad</label><select class="i" id="dPrio">${['alta','media','baja'].map(x=>`<option value="${x}" ${prActual===x?'selected':''}>${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select><div class="hint">Decide el orden en que el plan paga lo atrasado y lo de palabra.</div>`;
  h += `<div class="grid2"><div><label class="f">Tasa de interés (opcional)</label><input class="i" id="dTasa" inputmode="decimal" value="${esc(d.tasa)}" placeholder="Ej: 24,5"></div><div><label class="f">La tasa es</label><select class="i" id="dTasaTipo"><option value="EA" ${d.tasaTipo==='EA'?'selected':''}>% efectiva anual</option><option value="MV" ${d.tasaTipo==='MV'?'selected':''}>% mensual</option></select></div></div>`;
  h += `<label class="row" style="gap:10px;justify-content:flex-start;margin-top:14px"><input type="checkbox" id="dAcordado" ${d.acordado?'checked':''} style="width:20px;height:20px"><span>Atraso acordado con el acreedor <span class="tiny faint">(se muestra en amarillo, no en rojo)</span></span></label>`;

  h += `<div class="hint neg" id="dErr"></div><button class="btn pri block" style="margin-top:16px" data-a="deudaGuardar" data-id="${id||''}">Guardar</button>`;
  if (id && !tieneMovs && !d.origenMov) h += `<button class="btn danger block" style="margin-top:10px" data-a="deudaBorrar" data-id="${id}">Eliminar deuda</button>`;
  abrirSheet(id?'Editar deuda':'Nueva deuda', h);
}
async function guardarDeuda(id){
  const g = x => document.getElementById(x); const err = m => g('dErr').textContent = m;
  const d = id ? S.deudas.find(x=>x.id===id) : { id:uid(), ajustes:[], creado:Date.now() };
  const nombre = g('dNombre').value.trim(); if (!nombre) return err('Escribe el nombre.');
  const tipo = g('dTipo').value;
  const tasaTxt = g('dTasa').value.trim().replace(',','.'); const tasa = tasaTxt ? Number(tasaTxt) : 0;
  if (tasaTxt && !(tasa>=0)) return err('La tasa debe ser un número.');
  const upd = { nombre, acreedor:g('dAcreedor').value.trim(), tipo, prioridad:g('dPrio').value, tasa, tasaTipo:g('dTasaTipo').value, fechaFinal:g('dFin').value, notas:g('dNotas').value.trim(), acordado: !!(g('dAcordado')&&g('dAcordado').checked) };
  if (!d.origenMov){ const vacio = g('dSaldo').value.trim()===''; const saldo = num(g('dSaldo').value);
    if (vacio && tipo!=='obligatoria') return err('Las deudas flexibles necesitan el saldo.');
    if (!vacio && !saldo) return err('El saldo no puede ser 0.');
    upd.saldoInicial = vacio ? null : saldo; upd.fechaInicio = g('dFecha').value || hoy(); }
  if (tipo==='obligatoria'){
    const cuota = num(g('dCuota').value), dia = num(g('dDia').value);
    if (!cuota) return err('Escribe la cuota.'); if (!dia || dia>31) return err('El día de pago va de 1 a 31.');
    let q15 = g('dQ15').value.trim()===''?null:num(g('dQ15').value), q30 = g('dQ30').value.trim()===''?null:num(g('dQ30').value);
    if (q15===null && q30===null){ q15 = Math.floor(cuota/2); q30 = cuota-q15; } else { q15=q15||0; q30=q30||0; }
    if (q15+q30!==cuota) return err(`Las dos partes suman ${$$(q15+q30)} y la cuota es ${$$(cuota)}.`);
    const venc = num(g('dVenc').value); if (venc>60) return err('Revisa las cuotas vencidas.');
    Object.assign(upd, { cuota, diaPago:dia, q15, q30, vencidasIni:venc });
  } else Object.assign(upd, { cuota:0, diaPago:0, q15:0, q30:0, vencidasIni:0 });
  Object.assign(d, upd);
  if (!id) S.deudas.push(d);
  await guardar(); cerrarSheet(); toast('Deuda guardada'); render();
}
function abrirExtracto(id){
  const C = calcular(); const d = C.deudas.find(x=>x.id===id);
  let h = `<div class="small muted">${d.saldoConocido?`Según la app, ${esc(d.nombre)} está en <b style="color:var(--text)">${$$(d.saldoAct)}</b>. Escribe el saldo que dice el banco. Si es mayor, la diferencia se guarda como intereses y costos pagados.`:`Escribe el saldo total que te falta pagar de ${esc(d.nombre)}, según el banco.`}</div>`;
  h += `<label class="f">Saldo según el extracto</label><input class="i money" id="eSaldo" inputmode="numeric" data-money placeholder="$0"><label class="f">Fecha del extracto</label><input class="i" type="date" id="eFecha" value="${hoy()}">`;
  h += `<div class="hint neg" id="eErr"></div><button class="btn pri block" style="margin-top:16px" data-a="extractoGuardar" data-id="${id}">Actualizar</button>`;
  if ((d.ajustes||[]).length) h += `<h3 style="margin:18px 0 6px">Actualizaciones anteriores</h3><table class="t">${d.ajustes.slice().reverse().map(a=>`<tr><td>${fcorta(a.fecha)}</td><td>${$$(a.saldo)} <span class="tiny faint">(${a.diferencia>=0?'+':''}${$$(a.diferencia)})</span></td></tr>`).join('')}</table>`;
  abrirSheet(d.tipo==='obligatoria'?'Actualizar con extracto':'Corregir saldo', h);
}
async function guardarExtracto(id){
  const g = x => document.getElementById(x);
  const saldo = num(g('eSaldo').value), fecha = g('eFecha').value || hoy();
  if (!g('eSaldo').value.trim()) { g('eErr').textContent='Escribe el saldo (puede ser 0).'; return; }
  const C = calcular(); const dc = C.deudas.find(x=>x.id===id); const d = S.deudas.find(x=>x.id===id);
  const aj = d.ajustes||[]; const base = aj.length ? aj[aj.length-1] : { fecha:d.fechaInicio, saldo:+d.saldoInicial, creado:d.creado };
  const despues = p => p.fecha>base.fecha || (p.fecha===base.fecha && p.creado>base.creado);
  const posteriores = S.movs.filter(m=>m.tipo==='pago'&&m.deudaId===id&&despues(m)&&m.fecha>fecha).reduce((s,m)=>s+ +m.monto,0);
  const calcEnFecha = dc.saldoConocido ? dc.saldoAct + posteriores : saldo;
  (d.ajustes = aj).push({ fecha, saldo, creado:Date.now(), diferencia: saldo - calcEnFecha });
  await guardar(); cerrarSheet(); toast('Saldo actualizado'); render();
}

function abrirBolsillo(id){

  let h = '';
  if (b.tipo==='emergencia'){
    h += `<div class="small muted">Meta: de 3 a 6 meses de gastos básicos, por etapas (1 → 3 → 6).</div>`;
    h += `<label class="f">Aporte mínimo por pago</label><input class="i" id="bAporte" inputmode="numeric" data-money value="$${miles(b.aporte||0)}">`;
    h += `<label class="f">Lo que ya tenías ahorrado para emergencias antes de usar la app</label><input class="i" id="bInicial" inputmode="numeric" data-money value="$${miles(b.inicial||0)}">`;
  } else if (b.tipo==='cadena'){
    h += `<div class="grid2"><div><label class="f">Aporte por pago</label><input class="i" id="bAporte" inputmode="numeric" data-money value="$${miles(b.aporte||0)}"></div><div><label class="f">Recibes</label><input class="i" id="bRecibes" inputmode="numeric" data-money value="$${miles(b.recibes||0)}"></div></div>`;

    h += `<label class="f">Cuánto llevabas aportado antes de usar la app</label><input class="i" id="bInicial" inputmode="numeric" data-money value="${b.inicial==null?'':'$'+miles(b.inicial)}" placeholder="Ej: $400.000"><div class="hint">Solo los aportes anteriores a hoy que no vas a registrar en la app.</div>`;
  } else {
    h += `<label class="f">Nombre</label><input class="i" id="bNombre" value="${esc(b.nombre)}" placeholder="Ej: Mantenimiento moto">`;
    h += `<div class="grid2"><div><label class="f">Aporte por pago (opcional)</label><input class="i" id="bAporte" inputmode="numeric" data-money value="${b.aporte?'$'+miles(b.aporte):''}"></div><div><label class="f">Objetivo (opcional)</label><input class="i" id="bObjetivo" inputmode="numeric" data-money value="${b.objetivo?'$'+miles(b.objetivo):''}"></div></div>`;
    h += `<label class="f">Lo que ya tienes para esto</label><input class="i" id="bInicial" inputmode="numeric" data-money value="$${miles(b.inicial||0)}">`;
  }
  h += `<div class="hint neg" id="bErr"></div><button class="btn pri block" style="margin-top:16px" data-a="bolsilloGuardar" data-id="${id||''}">Guardar</button>`;
  if (id && !b.sistema && !S.movs.some(m=>m.bolsillo===id)) h += `<button class="btn danger block" style="margin-top:10px" data-a="bolsilloBorrar" data-id="${id}">Eliminar fondo</button>`;
  abrirSheet(id ? b.nombre : 'Nuevo fondo', h);
}
async function guardarBolsillo(id){
  const g = x => document.getElementById(x);
  const b = id ? S.bolsillos.find(x=>x.id===id) : { id:'b_'+uid(), tipo:'fondo' };
  if (b.tipo==='fondo'){ const n = g('bNombre').value.trim(); if (!n){ g('bErr').textContent='Escribe el nombre.'; return; } b.nombre = n; b.objetivo = num(g('bObjetivo').value); }
  b.aporte = num(g('bAporte').value);
  if (b.tipo==='cadena'){ b.recibes = num(g('bRecibes').value); b.fechaEntrega = g('bEntrega').value; b.fechaFin = g('bFin').value; b.inicial = g('bInicial').value.trim()===''?null:num(g('bInicial').value); }
  else b.inicial = num(g('bInicial').value);
  if (!id) S.bolsillos.push(b);
  await guardar(); cerrarSheet(); toast('Guardado'); render();
}

let catTipo = 'gasto';
function abrirCats(t){
  catTipo = t;

  h += S.categorias[t].map((c,i)=>`<div class="card soft"><div class="row"><input class="i" data-cat="${i}" value="${esc(c.nombre)}" ${c.sistema?'disabled':''}>${!c.sistema && !usadas.has(c.id)?`<button class="link small neg" data-a="catDel" data-i="${i}">Quitar</button>`:''}</div><div class="chips" style="margin-top:8px">${c.subs.map((s,j)=>`<span class="chip x">${esc(s)} <button class="link small neg" data-a="subDel" data-i="${i}" data-j="${j}" aria-label="Quitar ${esc(s)}">×</button></span>`).join('')}</div>${c.sistema?'':`<div class="row" style="margin-top:8px"><input class="i" id="nsub${i}" placeholder="Nueva subcategoría"><button class="btn sm" data-a="subAdd" data-i="${i}">Agregar</button></div>`}</div>`).join('');
  h += `<div class="row" style="margin-top:12px"><input class="i" id="ncat" placeholder="Nueva categoría"><button class="btn sm" data-a="catAdd">Agregar</button></div>`;

  abrirSheet(t==='gasto'?'Categorías de gasto':'Categorías de ingreso', h);
}

// ----- respaldo -----
async function hacerBackup(){
  const data = JSON.stringify({ app:'vida-financiera', version:1, exportado:new Date().toISOString(), data:S });
  const nombre = `vida-financiera-respaldo-${hoy()}.json`;
  const file = new File([data], nombre, { type:'application/json' });
  let ok = false;
  if (navigator.canShare && navigator.canShare({ files:[file] })){
    try { await navigator.share({ files:[file], title:'Respaldo Vida Financiera' }); ok = true; } catch(e){ if (e.name==='AbortError') return; }
  }
  if (!ok){ const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000); }
  S.settings.lastBackup = hoy(); await guardar(); toast('Respaldo generado. Guárdalo en Drive.'); render();
}
function exportarCSV(){
  const cols = ['fecha','tipo','categoria','subcategoria','monto','cuenta','cuenta_destino','deuda','bolsillo','nota'];
  const q = v => { const s = String(v??''); return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const rows = [...S.movs].sort((a,b)=>a.fecha<b.fecha?-1:1).map(m=>[m.fecha, TIPOS[m.tipo].l, m.catId?catNombre(m.catId):'', m.sub||'', signoMov(m)*m.monto || m.monto, m.cuentaId?cuentaNombre(m.cuentaId):'', m.cuentaDestinoId?cuentaNombre(m.cuentaDestinoId):'', m.deudaId?((S.deudas.find(d=>d.id===m.deudaId)||{}).nombre||''):'', bolsilloNombre(m.bolsillo), m.tipo==='prestamo'?(m.acreedor||''):(m.nota||'')].map(q).join(';'));
  const csv = '﻿' + cols.join(';') + '\n' + rows.join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = `vida-financiera-movimientos-${hoy()}.csv`; document.body.appendChild(a); a.click(); a.remove();
}
async function restaurar(file){
  try {
    const obj = JSON.parse(await file.text());
    if (obj.app!=='vida-financiera' || !obj.data || !Array.isArray(obj.data.movs)) throw new Error('formato');
    if (!confirm(`Esto reemplaza todo lo que hay en este celular con el respaldo del ${obj.exportado?obj.exportado.slice(0,10):'archivo'} (${obj.data.movs.length} movimientos). ¿Seguro?`)) return;
    S = obj.data; S.settings.onboarded = true; await guardar();
    bloqueado = !!S.settings.pinHash; cerrarSheet(); render(); toast('Respaldo restaurado');
  } catch(e){ alert('Ese archivo no es un respaldo válido de Vida Financiera.'); }
}

// =========================================================
// FASE 2 — pronóstico, metas, recordatorios, gráficos
// =========================================================
const PRIO = { alta:1, media:2, baja:3 };
const ESTRATEGIAS = { mixta:'Mixta (recomendada)', avalancha:'Avalancha (tasa más alta primero)', bola:'Bola de nieve (la más pequeña primero)' };
function ordenEstrategia(a,b){ const e = S.settings.estrategia||'mixta';
  if (e==='avalancha') return b.tasa-a.tasa || a.saldo-b.saldo;
  if (e==='bola') return a.saldo-b.saldo;
  return a.pr-b.pr || a.saldo-b.saldo; }
const prioN = p => PRIO[p] || 2;
const PRIMA_DEF = 2050000;

// Pronóstico a 12 quincenas. Nunca toca el disponible de hoy: es solo para planear.
function pronostico(C, opt={}){
  const N = opt.n || 12;
  const T = C.T;
  const noms = C.movs.filter(m=>m.tipo==='ingreso'&&m.catId==='nomina').sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:a.creado-b.creado);
  if (!noms.length) return { ok:false, motivo:'Registra tu primera nómina (Ingreso → Nómina) y aquí aparece tu pronóstico de 6 meses.' };
  const nomina = +noms[noms.length-1].monto;
  const prima = +(S.settings.prima||PRIMA_DEF);
  // fechas de pago: 13 hacia adelante → 12 quincenas completas + el resto de la actual
  const pays = []; let cur = T;
  while (pays.length<N+1){ const nx = nominales(cur).find(x=>x>cur); pays.push(nx); cur = nx; }
  const periodos = [{ ini:T, fin:addD(pays[0],-1), pago:false }];
  for (let k=0;k<N;k++) periodos.push({ ini:pays[k], fin:addD(pays[k+1],-1), pago:true });
  const porDia = opt.porDia!=null ? opt.porDia : (C.porDiaPron!=null ? C.porDiaPron : C.sv.reduce((s,g)=>s+g.porDia,0));
  const antojosQ = C.catPrev.antojos || 0;
  const enP = (f,p) => f>=p.ini && f<=p.fin;
  const mensuales = (dia, desde, hasta) => { const out=[]; let [y,m] = desde.split('-').map(Number); for (let i=0;i<Math.ceil(N/2)+4;i++){ const f = `${y}-${pad(m)}-${pad(Math.min(dia,lastDay(y,m)))}`; if (f>=desde && f<=hasta) out.push(f); m++; if (m>12){m=1;y++;} } return out; };
  const finH = periodos[periodos.length-1].fin;

  // copias de trabajo
  const ds = C.activas.map(d=>({ id:d.id, nombre:d.nombre, tipo:d.tipo, pr:prioN(d.prioridad), tasa:d.tmes||0, saldo: d.saldoConocido ? Math.max(0,d.saldoAct) : null, atraso: d.atrasadoMonto||0, cuota:+d.cuota||0, dia:+d.diaPago||0, fechaFinal:d.fechaFinal||null, prox:d.prox, fin:null }));
  const vencimientos = []; // {fecha, monto, que, deuda?}
  C.plan.filter(p=>p.kind==='fijo'&&p.prox).forEach(p=>{
    let desde = p.prox;
    if (!p.pagado && p.prox < T){ vencimientos.push({ fecha:T, monto:p.monto, que:p.nombre }); desde = addD(p.prox,1); }
    mensuales(p.dia, desde<T?T:desde, finH).forEach(f=> vencimientos.push({ fecha:f, monto:p.monto, que:p.nombre, key:p.key }));
  });
  ds.filter(d=>d.tipo==='obligatoria'&&d.cuota>0&&d.prox).forEach(d=>{ const dd = S.deudas.find(x=>x.id===d.id); mensuales(d.dia, d.prox, finH).forEach(f=> vencimientos.push({ fecha:f, monto:cuotaEn(dd,f), que:d.nombre, deuda:d })); });
  ds.filter(d=>d.tipo!=='obligatoria'&&d.fechaFinal&&d.saldo>0&&d.fechaFinal<=finH).forEach(d=> vencimientos.push({ fecha: d.fechaFinal<T?T:d.fechaFinal, monto:null, que:`Devolver a ${d.nombre}`, deuda:d, total:true }));
  const cad = C.cadena;
  if (cad && C.cadenaActiva){
    if (C.cadenaPend) vencimientos.push({ fecha:T, monto:cad.aporte, que:'Cadena' });
    pays.forEach(f=>{ if (f<=cad.fechaFin) vencimientos.push({ fecha:f, monto:cad.aporte, que:'Cadena' }); });
  }
  const metasF = C.metas.filter(mt=>!mt.cumplida).map(mt=>({ id:mt.id, nombre:mt.nombre, costo:+mt.costo||0, bal:mt.bal, orden:mt.orden||99, despuesDe:mt.despuesDe||null, fechaLimite:mt.fechaLimite||null, lista:null }));
  metasF.filter(mt=>mt.fechaLimite && mt.fechaLimite>=T && mt.fechaLimite<=finH).forEach(mt=> vencimientos.push({ fecha:mt.fechaLimite, monto:null, que:mt.nombre, meta:mt }));
  let emerg = C.bal.emergencia||0; const AM = S.settings.ahorroMin; const emergAporte = AM ? +(AM.emergencia||0) : +(C.emerg?.aporte||0);
  const fondos = C.otrosB.map(b=>({ id:b.id, nombre:b.nombre, bal:b.bal, aporte:+b.aporte||0 }));

  let cash = C.saldoTotal, primerDeficit = null;
  const filas = [];
  periodos.forEach((p,idx)=>{
    let ingreso = 0, oblig = 0, aDeudas = 0, aAhorro = 0; const notas = [];
    if (opt.extra && idx===1){ ingreso += opt.extra; notas.push('ingreso extra (simulado)'); }
    if (p.pago){ ingreso += nomina; const md = p.ini.slice(5); if (md==='06-15'||md==='12-15'){ ingreso += prima; notas.push('prima (estimada)'); } }
    if (cad && C.cadenaActiva && cad.fechaEntrega && enP(cad.fechaEntrega,p) && cad.fechaEntrega>=T){ ingreso += +cad.recibes||0; notas.push('recibes la cadena'); }
    // obligatorio
    oblig += porDia * (diffD(p.ini,p.fin)+1) - (idx===0 ? Math.min(C.gastadoHoy, porDia) : 0);
    if (idx>0) oblig += antojosQ;
    const posQ = new Set(idx===0 ? ((S.settings.pospuestos||{})[C.q.start]||[]) : []);
    vencimientos.filter(v=>enP(v.fecha,p)).forEach(v=>{
      if (idx===0 && v.deuda && !v.total && posQ.has('deuda:'+v.deuda.id)){ v.deuda.atraso += v.monto; return; }
      if (idx===0 && v.key && posQ.has(v.key)) return;
      if (v.deuda && v.total){ const m = v.deuda.saldo||0; oblig += m; v.deuda.saldo = 0; if (!v.deuda.fin) v.deuda.fin = v.fecha; return; }
      if (v.meta){ const m = Math.max(0, v.meta.costo - v.meta.bal); oblig += m; v.meta.bal += m; v.meta.lista = v.fecha; return; }
      if (v.deuda){ const d = v.deuda; if (d.saldo===0){ return; } const m = d.saldo!=null ? Math.min(v.monto, d.saldo) : v.monto; oblig += m; if (d.saldo!=null){ d.saldo -= m; if (d.saldo<=0.5 && !d.fin) d.fin = v.fecha; } return; }
      oblig += v.monto;
    });
    cash += ingreso - oblig;
    if (cash < 0 && !primerDeficit) primerDeficit = { ...p, falta:-cash };
    let libre = Math.max(0, cash);
    const usar = m => { const u = Math.min(libre, m); libre -= u; cash -= u; return u; };
    // 1. atrasos de bancos por prioridad
    ds.filter(d=>d.atraso>0).sort((a,b)=>a.pr-b.pr || b.tasa-a.tasa || a.atraso-b.atraso).forEach(d=>{ const u = usar(d.atraso); d.atraso -= u; if (d.saldo!=null) d.saldo = Math.max(0,d.saldo-u); aDeudas += u; if (d.atraso<=0.5 && !d.alDia) d.alDia = p.ini; });
    // 2. deudas de palabra sin fecha (y bancos flexibles), por prioridad y la más pequeña primero
    ds.filter(d=>d.tipo!=='obligatoria'&&!d.fechaFinal&&d.saldo>0).sort(ordenEstrategia).forEach(d=>{ const u = usar(d.saldo); d.saldo -= u; aDeudas += u; if (d.saldo<=0.5 && !d.fin) d.fin = p.ini; });
    // 3. fondo de emergencia (aporte) y fondos con aporte
    if (idx>0 && emergAporte && (!AM || p.ini>=(AM.desde||'0'))){ const u = usar(emergAporte); emerg += u; aAhorro += u; }
    if (idx>0) fondos.forEach(f=>{ if (f.aporte){ const u = usar(f.aporte); f.bal += u; aAhorro += u; } });
    // 3b. abonos extra a créditos con cuota (según la estrategia), antes de las metas grandes
    if (idx>0) ds.filter(d=>d.tipo==='obligatoria'&&d.saldo>0.5).sort(ordenEstrategia).forEach(d=>{ const u = usar(d.saldo); d.saldo -= u; aDeudas += u; if (d.saldo<=0.5 && !d.fin) d.fin = p.ini; });
    // 3c. sin deudas: llenar el fondo de emergencia hasta 3 meses antes de las metas grandes
    if (idx>0 && !ds.some(d=>(d.saldo!=null?d.saldo:d.atraso)>0.5) && C.mensualEmerg>0 && emerg < 3*C.mensualEmerg){ const u = usar(3*C.mensualEmerg - emerg); emerg += u; aAhorro += u; }
    // 4. metas en orden, respetando las que van después de otra
    metasF.filter(mt=>!mt.fechaLimite).sort((a,b)=>a.orden-b.orden).forEach(mt=>{
      if (libre<=0) return;
      const pre = mt.despuesDe && metasF.find(x=>x.id===mt.despuesDe);
      if (pre && pre.bal < pre.costo) return;
      const u = usar(Math.max(0, mt.costo - mt.bal)); mt.bal += u; aAhorro += u;
      if (mt.bal >= mt.costo && !mt.lista) mt.lista = p.ini;
    });
    const deudaTotal = ds.reduce((s,d)=>s + (d.saldo!=null ? d.saldo : d.atraso),0);
    const ahorro = emerg + fondos.reduce((s,f)=>s+f.bal,0) + metasF.filter(m=>!m.fechaLimite).reduce((s,m)=>s+m.bal,0);
    filas.push({ ...p, ingreso, oblig, aDeudas, aAhorro, cash, deudaTotal, ahorro, emerg, deficit: cash<0, notas });
  });
  metasF.forEach(mt=>{ if (mt.bal>=mt.costo && !mt.lista) mt.lista = T; });
  const libre = filas.find(f=>f.deudaTotal<=0.5);
  return { ok:true, porDia, libreDeudas: libre?libre.ini:null, nomina, prima, filas, primerDeficit, deudas:ds, metas:metasF, finH, sinSaldo: C.activas.filter(d=>!d.saldoConocido).length };
}

// ---------- gráficos (SVG sin librerías, funciona sin internet) ----------
function graficoLineas(filas){
  if (!filas.length) return '';
  const W = 340, H = 170, L = 8, R = 8, top = 14, bot = 26;
  const xs = i => L + (W-L-R) * (i/(filas.length-1||1));
  const maxV = Math.max(1, ...filas.map(f=>Math.max(f.deudaTotal, f.ahorro)));
  const ys = v => top + (H-top-bot) * (1 - v/maxV);
  const pts = k => filas.map((f,i)=>`${xs(i).toFixed(1)},${ys(f[k]).toFixed(1)}`).join(' ');
  const cD = '#b590f0', cA = 'var(--accent)';
  const lbl = f => fcorta(f.ini);
  const last = filas.length-1;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Deudas y ahorro proyectados a 6 meses" style="display:block;margin-top:8px">
    <line x1="${L}" x2="${W-R}" y1="${H-bot}" y2="${H-bot}" stroke="var(--line)"/>
    <line x1="${L}" x2="${W-R}" y1="${top}" y2="${top}" stroke="var(--line)" stroke-dasharray="2 4"/>
    <text x="${L}" y="${top-4}" font-size="9" fill="var(--faint)">${$$(maxV)}</text>
    ${filas.map((f,i)=> f.deficit ? `<rect x="${(xs(i)-4).toFixed(1)}" y="${top}" width="8" height="${H-top-bot}" fill="rgba(239,112,112,.14)"/>` : '').join('')}
    <polyline points="${pts('deudaTotal')}" fill="none" stroke="${cD}" stroke-width="2" stroke-linejoin="round"/>
    <polyline points="${pts('ahorro')}" fill="none" stroke="${cA}" stroke-width="2" stroke-linejoin="round"/>
    ${filas.map((f,i)=>`<circle cx="${xs(i).toFixed(1)}" cy="${ys(f.deudaTotal).toFixed(1)}" r="2.5" fill="${cD}"/><circle cx="${xs(i).toFixed(1)}" cy="${ys(f.ahorro).toFixed(1)}" r="2.5" fill="${cA}"/>`).join('')}
    <text x="${L}" y="${H-10}" font-size="9" fill="var(--faint)">${lbl(filas[0])}</text>
    <text x="${W-R}" y="${H-10}" font-size="9" fill="var(--faint)" text-anchor="end">${lbl(filas[last])}</text>
  </svg>
  <div class="legend"><span><i style="background:${cD}"></i>Deudas pendientes (${$$(filas[last].deudaTotal)} al final)</span><span><i style="background:var(--accent)"></i>Ahorrado en fondos y metas (${$$(filas[last].ahorro)} al final)</span>${filas.some(f=>f.deficit)?'<span><i style="background:rgba(239,112,112,.5)"></i>Pago donde no alcanza</span>':''}</div>`;
}
function graficoBarras(items, signed){ // [{l, v}]
  if (!items.length) return '<div class="empty">Aún no hay datos.</div>';
  const max = Math.max(1, ...items.map(i=>Math.abs(i.v)));
  return `<div class="catbars">${items.map(i=>`<div class="r"><div class="row"><span class="small">${esc(i.l)}</span><b class="small ${signed?(i.v<0?'neg':'pos'):''}">${$$(i.v)}</b></div><div class="bar"><i style="width:${pct(Math.abs(i.v),max)}%;background:${signed?(i.v<0?'var(--neg)':'var(--pos)'):'var(--warn)'}"></i></div></div>`).join('')}</div>`;
}
function antojosPorQuincena(C){
  const out = []; let q = C.q;
  for (let i=0;i<6;i++){
    if (q.end < S.creado) break;
    const v = C.movs.filter(m=>m.catId==='antojos'&&m.fecha>=q.start&&m.fecha<=q.end).reduce((s,m)=>s+(m.tipo==='gasto'&&!m.previo?+m.monto:m.tipo==='reintegro'?-m.monto:0),0);
    out.unshift({ l:`${quincenaNombre(q)} (${fcorta(q.start)})`, v });
    q = quincenaDe(addD(q.start,-1), C.movs);
  }
  return out;
}

// ---------- vista FUTURO ----------
function vFuturo(C){
  const P = pronostico(C);
  const fechaQ = f => f ? (f<=C.T ? 'ya' : fanio(f)) : 'más de 6 meses';
  let h = `<div class="top"><div><h1>Futuro</h1><div class="sub">Pronóstico, deudas y metas a 6 meses</div></div><button class="btn sm pri" data-a="meta">+ Meta</button></div><div class="wrap">`;
  if (!P.ok){ h += `<div class="card soft small">${esc(P.motivo)}</div>`; }
  else {
    const d = P.primerDeficit;
    h += `<div class="card"><h2>Pronóstico a 6 meses</h2>
      <div class="small muted" style="margin-top:4px">Con tu nómina de ${$$(P.nomina)}, la prima (estimada) en junio y diciembre, y gastando ${$$(P.porDia)} al día ${C.porDiaPron!=null?`(tu promedio real de los últimos ${C.diasProm} días)`:'(tu supervivencia completa; con 7 días registrando uso tu gasto real)'}. No cuenta comisiones. <b style="color:var(--text)">Esto es para planear, no suma nada a lo que puedes gastar hoy.</b></div>
      ${d ? `<div class="alert" style="margin-top:8px"><b class="neg">✕</b><span>${d.ini===C.T?`De hoy al <b>${fcorta(d.fin)}</b>`:`En el pago del <b>${fcorta(d.ini)}</b>`} no alcanza para pagar todo con la supervivencia completa (${$$(C.necesario)}/día): faltarían <b>${$$(d.falta)}</b>. Cocinar y posponer lo que se pueda cierra esa diferencia.</span></div>` : `<div class="alert" style="margin-top:8px"><b class="pos">✓</b><span>Si sigues el plan, alcanza en los próximos 12 pagos.</span></div>`}
      ${graficoLineas(P.filas.slice(1))}
      ${P.sinSaldo?`<div class="tiny faint" style="margin-top:6px">${P.sinSaldo} ${P.sinSaldo===1?'deuda sin saldo cuenta':'deudas sin saldo cuentan'} solo con lo atrasado.</div>`:''}
      <details class="dt"><summary>Ver pago por pago</summary><table class="t" style="margin-top:8px"><tr><td class="faint">Pago</td><td class="faint">Entra · Obligatorio · Deudas · Ahorro</td></tr>${P.filas.map((f,i)=>`<tr><td>${i===0?'Hoy':fcorta(f.ini)}${f.notas.length?`<div class="tiny faint">${esc(f.notas.join(', '))}</div>`:''}</td><td><span class="pos">${$$(f.ingreso)}</span> · ${$$(f.oblig)} · ${$$(f.aDeudas)} · ${$$(f.aAhorro)}${f.deficit?`<div class="tiny neg">falta ${$$(-f.cash)}</div>`:''}</td></tr>`).join('')}</table></details>
    </div>`;
    const PL = pronostico(C,{n:72});
    h += `<div class="card"><h2>Patrimonio neto</h2><div class="small muted" style="margin-top:4px">Lo que tienes (cuentas, inversiones, cadena, lo que te deben) menos lo que debes. Es el número que dice si tu vida financiera mejora.</div><div class="mid ${C.patrimonio<0?'neg':'pos'}" style="margin-top:8px">${$$(C.patrimonio)}</div>${graficoBarras(Object.entries(S.settings.patri||{}).sort().slice(-12).map(([k,v])=>({ l:`${MESES[+k.slice(5)-1]} ${k.slice(0,4)}`, v })), true)}
      ${semaforoEndeud(C)}
      <div class="small" style="margin-top:8px">Fecha libre de deudas: <b>${PL.libreDeudas?flarga(PL.libreDeudas):'más de 3 años con el ritmo actual'}</b> <span class="tiny faint">(estimada, con estrategia ${esc(ESTRATEGIAS[S.settings.estrategia||'mixta'].toLowerCase())})</span></div></div>`;
    const hitos = [];
