<style>
:root{
  --bg:#0e1116; --surface:#161a21; --surface2:#1e232c; --line:#2a303b;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}

h1{font-size:20px} h2{font-size:16px} h3{font-size:14px;color:var(--muted);font-weight:600}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;max-width:560px;margin:0 auto}
.top .sub{color:var(--faint);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px}

.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px} .tiny{font-size:12px}
.big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.mid{font-size:20px;font-weight:650}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface2);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:17px;font-weight:650;margin-top:2px}
.bar{height:8px;background:var(--surface2);border-radius:6px;overflow:hidden;margin-top:6px}

<body>
<div id="app"></div>
<div id="sheet" class="sheet hidden"></div>
<div id="toast" class="toast"></div>
<script>
'use strict';
/* =========================================================
   Vida Financiera — fase 1
   Datos guardados solo en este celular (IndexedDB).
   ========================================================= */

// ---------- almacenamiento ----------
const DB_NAME = 'vidafin', STORE = 'kv';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function dbGet(k){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction(STORE,'readonly').objectStore(STORE).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function dbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}

// ---------- utilidades ----------
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addD = (s,n) => { const d = pd(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffD = (a,b) => Math.round((pd(b)-pd(a))/864e5);
const lastDay = (y,m) => new Date(y,m,0).getDate();
const hoy = () => window.__HOY || ymd(new Date());
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const miles = n => String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const $$ = n => (Math.round(n||0) < 0 ? '−' : '') + '$' + miles(n||0);
const num = s => { const v = String(s??'').replace(/[^\d]/g,''); return v ? Number(v) : 0; };
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
const fcorta = s => { const d = pd(s); return `${d.getDate()} ${MESES[d.getMonth()]}`; };
const flarga = s => { const d = pd(s); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`; };
const pct = (a,b) => b > 0 ? Math.max(0, Math.min(100, a/b*100)) : 0;

// ---------- estado por defecto ----------
function estadoInicial(){
  const t = hoy();
  return {
    version: 1, creado: t,
    settings: { pinHash:null, salt:null, lockMin:3, lastBackup:null, quincenaMonto:null, cierres:{}, onboarded:false },
    cuentas: [
      { id:'bancolombia', nombre:'Bancolombia', saldoInicial:null },
      { id:'nequi', nombre:'Nequi', saldoInicial:null },
      { id:'efectivo', nombre:'Efectivo', saldoInicial:null },
    ],
    categorias: {
      ingreso: [
        { id:'nomina', nombre:'Nómina', subs:['Quincena'] },
        { id:'comision', nombre:'Comisión', subs:[] },
        { id:'prima', nombre:'Prima', subs:[] },
        { id:'extra', nombre:'Trabajos extra', subs:['Freelance','Proyectos por fuera'] },
        { id:'ventas', nombre:'Ventas / negocio', subs:[] },
        { id:'rendimientos', nombre:'Rendimientos', subs:[] },
        { id:'cadena', nombre:'Cadena recibida', subs:[], real:false, sistema:true },
        { id:'regalo', nombre:'Regalo', subs:[] },
        { id:'otro_i', nombre:'Otro', subs:[] },
      ],
      gasto: [
        { id:'vivienda', nombre:'Vivienda', subs:['Arriendo','Internet','Luz','Agua','Gas','Aseo y cosas del hogar'] },
        { id:'comunicaciones', nombre:'Comunicaciones', subs:['Plan celular'] },
        { id:'alimentacion', nombre:'Alimentación', subs:['Desayuno','Almuerzo','Cena','Mercado','Domicilios','Café y snacks'] },
        { id:'transporte', nombre:'Transporte', subs:['Recarga TuLlave','Taxi o app','Viaje fuera de la ciudad'] },
        { id:'personal', nombre:'Personal', subs:['Ropa y calzado','Aseo personal','Peluquería'] },
        { id:'salud', nombre:'Salud', subs:['Medicamentos','Citas y exámenes'] },
        { id:'mascota', nombre:'Mascota', subs:['Comida','Veterinario','Accesorios'] },
        { id:'pareja', nombre:'Pareja y salidas', subs:['Salidas','Regalos'] },
        { id:'entretenimiento', nombre:'Entretenimiento', subs:['Suscripciones','Eventos y planes','Viajes'] },
        { id:'educacion', nombre:'Educación', subs:['Cursos','Libros'] },
        { id:'familia', nombre:'Familia', subs:['Apoyo a familia'] },
        { id:'trabajo', nombre:'Trabajo', subs:['Gastos no reembolsados'] },
        { id:'financieros', nombre:'Financieros', subs:['4x1000','Cuotas de manejo','Intereses y mora'] },
        { id:'otros', nombre:'Otros', subs:['Imprevistos','Sin clasificar'] },
      ],
    },
    supervivencia: [
      { id:'s1', nombre:'Transporte', porDia:7200, cat:'transporte' },
      { id:'s2', nombre:'Desayuno', porDia:9000, cat:'alimentacion' },
      { id:'s3', nombre:'Almuerzo', porDia:20000, cat:'alimentacion' },
      { id:'s4', nombre:'Cena', porDia:15000, cat:'alimentacion' },
    ],
    fijos: [],
    deudas: [],
    bolsillos: [
      { id:'emergencia', nombre:'Fondo de emergencia', tipo:'emergencia', aporte:20000, inicial:0, sistema:true },
      { id:'cadena', nombre:'Cadena', tipo:'cadena', aporte:100000, recibes:1100000, fechaEntrega:'2026-12-15', fechaFin:'2026-12-30', inicial:null, sistema:true },
    ],
    movs: [],
  };
}

let S = null;            // estado
let view = 'inicio';     // pantalla actual
let movMes = null;       // mes filtrado en movimientos
let movFiltro = { tipo:'', cat:'', cuenta:'' };
let bloqueado = true;
let hiddenAt = 0;

async function guardar(){ await dbSet('state', S); }

// ---------- tipos de movimiento ----------
const TIPOS = {
  gasto:     { l:'Gasto' },
  ingreso:   { l:'Ingreso' },
  pago:      { l:'Pago de deuda' },
  apartar:   { l:'Apartar' },
  sacar:     { l:'Sacar de bolsillo' },
  prestamo:  { l:'Préstamo recibido' },
  reintegro: { l:'Reintegro' },
  transfer:  { l:'Transferencia' },
  cadena:    { l:'Aporte a cadena' },
};
const catDe = (tipo,id) => (S.categorias[tipo]||[]).find(c=>c.id===id);
const catNombre = (id) => (catDe('gasto',id)||catDe('ingreso',id)||{}).nombre || id || '';
const cuentaNombre = id => (S.cuentas.find(c=>c.id===id)||{}).nombre || '—';

// ---------- quincenas ----------
const nom15 = (y,m) => `${y}-${pad(m)}-15`;
const nom30 = (y,m) => `${y}-${pad(m)}-${pad(Math.min(30,lastDay(y,m)))}`;
function nominales(s){
  const d = pd(s); const out=[];
  for(let k=-2;k<=2;k++){ let y=d.getFullYear(), m=d.getMonth()+1+k; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} out.push(nom15(y,m), nom30(y,m)); }
  return out.sort();
}
const nominalCercana = s => nominales(s).reduce((b,n)=>Math.abs(diffD(s,n))<Math.abs(diffD(s,b))?n:b);
const nominalSiguiente = n => nominales(n).find(x=>x>n);
const nominalUltima = s => nominales(s).filter(x=>x<=s).pop();

function quincenaDe(fecha, movs){
  const pagos = movs.filter(m=>m.tipo==='ingreso'&&m.catId==='nomina').map(m=>m.fecha).sort();
  const L = pagos.filter(f=>f<=fecha).pop();
  const N = nominalUltima(fecha);
  let start, own;
  if (L && L >= addD(N,-5)) { start = L; own = nominalCercana(L); }
  else { start = N; own = N; }
  const nxt = nominalSiguiente(own);
  let end = addD(nxt,-1);
  const temprano = pagos.find(f=>f>start && f>=addD(nxt,-5) && f<=nxt);
  if (temprano) end = addD(temprano,-1);
  return { start, end, own, tipo: own.slice(8)==='15' ? '15' : '30', dias: diffD(start,end)+1 };
}

// ---------- cálculo central ----------
function calcular(){
  const T = hoy();
  const movs = [...S.movs].sort((a,b)=> a.fecha<b.fecha?-1 : a.fecha>b.fecha?1 : a.creado-b.creado);
  const saldo = {}; S.cuentas.forEach(c=> saldo[c.id] = Number(c.saldoInicial||0));
  const bal = {};
  S.bolsillos.forEach(b=> bal[b.id] = Number(b.inicial||0));
  let reponer = 0;
  const add = (id,v) => { if (id in saldo) saldo[id] += v; };
  const take = (k,v) => { bal[k] = Math.max(0,(bal[k]||0)-v); };
  for (const m of movs){
    const a = Number(m.monto)||0;
    switch(m.tipo){
      case 'ingreso': add(m.cuentaId,a); if (m.catId==='cadena') bal.cadena = 0; break;
      case 'prestamo': case 'reintegro': add(m.cuentaId,a); break;
      case 'gasto': case 'pago': add(m.cuentaId,-a); if (m.bolsillo) take(m.bolsillo,a); break;
      case 'cadena': add(m.cuentaId,-a); bal.cadena = (bal.cadena||0)+a; break;
      case 'transfer': add(m.cuentaId,-a); add(m.cuentaDestinoId,a); break;
      case 'apartar': bal[m.bolsillo] = (bal[m.bolsillo]||0)+a; if (m.bolsillo==='emergencia') reponer = Math.max(0,reponer-a); break;
      case 'sacar': take(m.bolsillo,a); if (m.bolsillo==='emergencia') reponer += a; break;
    }
  }
  const saldoTotal = Object.values(saldo).reduce((s,v)=>s+v,0);
  const apartado = Object.entries(bal).filter(([k])=>k!=='cadena').reduce((s,[,v])=>s+v,0);

  // supervivencia
  const grupos = {};
  S.supervivencia.forEach(r=>{ const g = grupos[r.cat] || (grupos[r.cat] = { cat:r.cat, porDia:0, rubros:[] }); g.porDia += Number(r.porDia)||0; g.rubros.push(r.nombre); });
  const superv = (q) => Object.values(grupos).map(g=>{
    const pres = g.porDia*q.dias; let gast = 0;
    movs.forEach(m=>{ if (m.fecha>=q.start && m.fecha<=q.end && m.catId===g.cat){ if (m.tipo==='gasto' && !m.bolsillo) gast += +m.monto; if (m.tipo==='reintegro') gast -= +m.monto; } });
    return { ...g, nombre: catNombre(g.cat), pres, gast, rest: pres-gast };
  });
  const q = quincenaDe(T, movs);
  const diasRest = Math.max(1, diffD(T,q.end)+1);
  const sv = superv(q);
  const reservado = sv.reduce((s,g)=>s+Math.max(0,g.rest),0);
  const disponible = saldoTotal - apartado - reservado;
  const libreDia = disponible > 0 ? disponible/diasRest : 0;

  // deudas
  const mesAct = T.slice(0,7);
  const [ty,tm] = T.split('-').map(Number);
  const deudas = S.deudas.map(d=>{
    const aj = (d.ajustes||[]);
    const base = aj.length ? aj[aj.length-1] : { fecha:d.fechaInicio, saldo:+d.saldoInicial, creado:d.creado };
    const despues = p => p.fecha>base.fecha || (p.fecha===base.fecha && p.creado>base.creado);
    const pagos = movs.filter(m=>m.tipo==='pago'&&m.deudaId===d.id);
    const saldoAct = base.saldo - pagos.filter(despues).reduce((s,m)=>s+ +m.monto,0);
    const totalPagado = pagos.reduce((s,m)=>s+ +m.monto,0);
    const intereses = aj.reduce((s,a)=>s+Math.max(0,a.diferencia||0),0);
    const pagadoMes = pagos.filter(m=>m.fecha.slice(0,7)===mesAct).reduce((s,m)=>s+ +m.monto,0);
    let prox = null, atrasada = false, cuotaMes = 0;
    if (d.tipo==='obligatoria' && d.diaPago){
      const dueThis = `${ty}-${pad(tm)}-${pad(Math.min(d.diaPago,lastDay(ty,tm)))}`;
      cuotaMes = Math.min(+d.cuota||0, Math.max(0, saldoAct+pagadoMes));
      if (cuotaMes>0 && pagadoMes < cuotaMes){ prox = dueThis; if (T>dueThis && d.fechaInicio<=dueThis) atrasada = true; }
      else { let y=ty, m=tm+1; if (m>12){m=1;y++;} prox = `${y}-${pad(m)}-${pad(Math.min(d.diaPago,lastDay(y,m)))}`; }
    }
    let tmes = 0;
    if (d.tasa) tmes = d.tasaTipo==='EA' ? Math.pow(1+d.tasa/100,1/12)-1 : d.tasa/100;
    const cerrada = saldoAct <= 0.5;
    const fechaCierre = cerrada && pagos.length ? pagos[pagos.length-1].fecha : null;
    return { ...d, saldoAct, totalPagado, intereses, pagadoMes, cuotaMes, prox, atrasada, tmes, interesEst: saldoAct*tmes, cerrada, fechaCierre, bolsillo: bal['deuda:'+d.id]||0, progreso: pct(totalPagado, totalPagado+Math.max(0,saldoAct)) };
  });
  const activas = deudas.filter(d=>!d.cerrada);

  // fijos + deudas obligatorias (plan)
  const apartadoEnQ = key => movs.filter(m=>m.tipo==='apartar'&&m.bolsillo===key&&m.fecha>=q.start&&m.fecha<=q.end).reduce((s,m)=>s+ +m.monto,0);
  const vence = dia => { const d1 = `${ty}-${pad(tm)}-${pad(Math.min(dia,lastDay(ty,tm)))}`; return d1; };
  const plan = [
    ...S.fijos.map(f=>{
      const key = 'fijo:'+f.id;
      const pagadoMes = movs.filter(m=>m.tipo==='gasto'&&m.bolsillo===key&&m.fecha.slice(0,7)===mesAct).reduce((s,m)=>s+ +m.monto,0);
      const pagado = pagadoMes >= (+f.monto) - 0.5;
      let prox = vence(+f.diaPago);
      if (pagado){ let y=ty,m=tm+1; if(m>12){m=1;y++;} prox = `${y}-${pad(m)}-${pad(Math.min(+f.diaPago,lastDay(y,m)))}`; }
      return { key, kind:'fijo', ref:f, nombre:f.nombre, monto:+f.monto, dia:+f.diaPago, q15:+f.q15||0, q30:+f.q30||0, pagado, pagadoMes, prox, atrasado: !pagado && T>prox };
    }),
    ...activas.filter(d=>d.tipo==='obligatoria').map(d=>({ key:'deuda:'+d.id, kind:'deuda', ref:d, nombre:d.nombre, monto: d.cuotaMes || +d.cuota || 0, dia:+d.diaPago, q15:+d.q15||0, q30:+d.q30||0, pagado: !(d.cuotaMes>0 && d.pagadoMes<d.cuotaMes), pagadoMes:d.pagadoMes, prox:d.prox, atrasado:d.atrasada })),
  ].map(p=>{
    // la parte de esta quincena es para el próximo pago que cae desde el inicio de la quincena;
    // si el pago de este mes ya se hizo y caía dentro de esta quincena, esa parte ya se usó.
    const dueThis = p.dia ? `${ty}-${pad(tm)}-${pad(Math.min(p.dia,lastDay(ty,tm)))}` : null;
    const porcion = (p.pagado && dueThis && dueThis >= q.start) ? 0 : (q.tipo==='15' ? p.q15 : p.q30);
    const enQ = apartadoEnQ(p.key);
    return { ...p, bal: bal[p.key]||0, porcion, apartadoQ: enQ, faltaQ: Math.max(0, porcion-enQ), faltaPago: p.pagado ? 0 : Math.max(0, p.monto-(bal[p.key]||0)) };
  }).sort((a,b)=> (a.prox||'9') < (b.prox||'9') ? -1 : 1);

  // fondos
  const basicos = Object.values(grupos).reduce((s,g)=>s+g.porDia*30,0) + S.fijos.reduce((s,f)=>s+(+f.monto||0),0) + activas.filter(d=>d.tipo==='obligatoria').reduce((s,d)=>s+(+d.cuota||0),0);
  const emerg = S.bolsillos.find(b=>b.id==='emergencia');
  const cadena = S.bolsillos.find(b=>b.id==='cadena');
  const emergQ = apartadoEnQ('emergencia');
  const cadenaQ = movs.filter(m=>m.tipo==='cadena'&&m.fecha>=q.start&&m.fecha<=q.end).reduce((s,m)=>s+ +m.monto,0);
  const cadenaActiva = cadena && T <= (cadena.fechaFin||'0000');
  const otrosB = S.bolsillos.filter(b=>!b.sistema).map(b=>({ ...b, bal: bal[b.id]||0, apartadoQ: apartadoEnQ(b.id) }));

  // mes: gastos por categoría
  const enR = (m,a,b) => m.fecha>=a.start && m.fecha<=a.end;
  const porCat = qq => { const r = {}; movs.forEach(m=>{ if (!enR(m,qq)) return; if (m.tipo==='gasto') r[m.catId]=(r[m.catId]||0)+ +m.monto; if (m.tipo==='reintegro') r[m.catId]=(r[m.catId]||0)- +m.monto; }); return r; };
  const qAnt = quincenaDe(addD(q.start,-1), movs);
  const catMes = porCat(q), catPrev = porCat(qAnt);
  const ingresosMes = movs.filter(m=>m.tipo==='ingreso'&&enR(m,q)&&(catDe('ingreso',m.catId)||{}).real!==false).reduce((s,m)=>s+ +m.monto,0);
  const gastosMes = Object.values(catMes).reduce((s,v)=>s+v,0);
  const pagosMes = movs.filter(m=>m.tipo==='pago'&&enR(m,q)).reduce((s,m)=>s+ +m.monto,0);

  // cierre de la quincena anterior
  let cierre = null;
  const qPrev = quincenaDe(addD(q.start,-1), movs);
  if (S.creado <= qPrev.start && !S.settings.cierres[qPrev.start]){
    const svp = superv(qPrev); const sob = svp.reduce((s,g)=>s+g.rest,0);
    if (sob > 0) cierre = { q:qPrev, sobrante: sob };
  }

  // alertas
  const alertas = [];
  activas.filter(d=>d.atrasada).forEach(d=> alertas.push({ n:'rojo', t:`${d.nombre}: la cuota de este mes (${$$(d.cuotaMes)}) está atrasada desde el ${fcorta(d.prox)}.` }));
  plan.filter(p=>p.kind==='fijo'&&p.atrasado).forEach(p=> alertas.push({ n:'rojo', t:`${p.nombre}: vencía el ${fcorta(p.prox)} y no está registrado como pagado.` }));
  if (disponible < 0) alertas.push({ n:'rojo', t:`Tu disponible libre está en ${$$(disponible)}: lo apartado supera lo que tienes.` });
  plan.filter(p=>!p.pagado && p.faltaPago>0 && p.prox && diffD(T,p.prox)>=0 && diffD(T,p.prox)<=5).forEach(p=> alertas.push({ n:'amarillo', t:`${p.nombre} se paga el ${fcorta(p.prox)} y faltan ${$$(p.faltaPago)} por apartar.` }));
  sv.filter(g=>g.rest<0).forEach(g=> alertas.push({ n:'amarillo', t:`${g.nombre}: ya gastaste ${$$(-g.rest)} más de lo presupuestado en esta quincena.` }));
  if (reponer > 0) alertas.push({ n:'amarillo', t:`Sacaste ${$$(reponer)} del fondo de emergencia. Repónlo cuando puedas.` });
  if (cadena && cadena.inicial==null && cadenaActiva) alertas.push({ n:'info', t:'Falta anotar cuánto llevas aportado a la cadena (Plan → Cadena).' });
  if (S.deudas.length===0) alertas.push({ n:'info', t:'Aún no has cargado tus deudas (pestaña Deudas).' });
  if (S.fijos.length===0) alertas.push({ n:'info', t:'Aún no has cargado tus gastos fijos (pestaña Plan).' });

  const meses = basicos>0 ? (bal.emergencia||0)/basicos : 0;
  let estado = 'verde', razon = 'Todo al día.';
  if (alertas.some(a=>a.n==='rojo')) { estado='rojo'; razon = alertas.find(a=>a.n==='rojo').t; }
  else if (meses < 1 || alertas.some(a=>a.n==='amarillo')) { estado='amarillo'; razon = alertas.find(a=>a.n==='amarillo')?.t || `El fondo de emergencia cubre ${meses.toFixed(1).replace('.',',')} meses; la primera meta es 1 mes.`; }

  return { T, movs, saldo, saldoTotal, bal, apartado, q, diasRest, sv, reservado, disponible, libreDia, deudas, activas, plan, basicos, meses, emerg, cadena, emergQ, cadenaQ, cadenaActiva, otrosB, reponer, catMes, catPrev, qAnt, ingresosMes, gastosMes, pagosMes, cierre, alertas, estado, razon };
}

// ---------- toast ----------
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2400); }

// ---------- render principal ----------
function render(){
  const app = document.getElementById('app');
  if (!S.settings.onboarded){ app.innerHTML = onboarding(); return; }
  if (bloqueado){ app.innerHTML = pantallaPin('unlock'); return; }
  const C = calcular();
  let body = '';
  if (view==='inicio') body = vInicio(C);
  else if (view==='movs') body = vMovs(C);
  else if (view==='plan') body = vPlan(C);
  else if (view==='deudas') body = vDeudas(C);
  else if (view==='mas') body = vMas(C);
  const tab = (id,l) => `<button class="${view===id?'on':''}" data-a="nav" data-v="${id}">${IC[id]}<span>${l}</span></button>`;
  app.innerHTML = body + `<nav class="bot">${tab('inicio','Inicio')}${tab('movs','Movimientos')}<button class="add" data-a="nuevo" aria-label="Registrar movimiento">${IC.add}</button>${tab('plan','Plan')}${tab('deudas','Deudas')}</nav>`;
}

    <div class="card">

    </div>
    <div class="card">
      <div class="row"><div class="col"><h2>${quincenaNombre(q)}</h2><span class="small muted">${fcorta(q.start)} – ${fcorta(q.end)} · quedan ${C.diasRest} ${C.diasRest===1?'día':'días'}</span></div><button class="btn sm pri" data-a="repartir">Repartir</button></div>
      <div class="sep"></div>
      <h3>Supervivencia</h3>
      ${C.sv.map(g=>svRow(g,C)).join('') || '<div class="empty">Sin rubros de supervivencia.</div>'}
    </div>

    </div>

function quincenaNombre(q){ return `Quincena del ${q.tipo}`; }
function svRow(g,C){
  const alcanza = g.porDia>0 ? Math.floor(Math.max(0,g.rest)/g.porDia) : 0;

}

// ---------- MOVIMIENTOS ----------
function descMov(m){
  switch(m.tipo){
    case 'gasto': case 'ingreso': case 'reintegro': return `${catNombre(m.catId)}${m.sub?' › '+m.sub:''}`;
    case 'pago': return `Pago · ${(S.deudas.find(d=>d.id===m.deudaId)||{}).nombre||'deuda'}`;
    case 'apartar': return `Apartado · ${bolsilloNombre(m.bolsillo)}`;
    case 'sacar': return `Sacado · ${bolsilloNombre(m.bolsillo)}`;
    case 'prestamo': return `Préstamo de ${m.acreedor||''}`;
    case 'transfer': return `${cuentaNombre(m.cuentaId)} → ${cuentaNombre(m.cuentaDestinoId)}`;
    case 'cadena': return 'Aporte a cadena';
  }
  return m.tipo;
}
function signoMov(m){ return ({ingreso:1,prestamo:1,reintegro:1,gasto:-1,pago:-1,cadena:-1})[m.tipo]||0; }
function bolsilloNombre(k){
  if (!k) return '';
  if (k.startsWith('fijo:')) return (S.fijos.find(f=>'fijo:'+f.id===k)||{}).nombre||'fijo';
  if (k.startsWith('deuda:')) return (S.deudas.find(d=>'deuda:'+d.id===k)||{}).nombre||'deuda';
  return (S.bolsillos.find(b=>b.id===k)||{}).nombre||k;
}
function vMovs(C){
  if (!movMes) movMes = C.T.slice(0,7);
  const [y,m] = movMes.split('-').map(Number);
  let list = C.movs.filter(x=>x.fecha.slice(0,7)===movMes);
  if (movFiltro.tipo) list = list.filter(x=>x.tipo===movFiltro.tipo);
  if (movFiltro.cat) list = list.filter(x=>x.catId===movFiltro.cat);
  if (movFiltro.cuenta) list = list.filter(x=>x.cuentaId===movFiltro.cuenta||x.cuentaDestinoId===movFiltro.cuenta);
  list = list.slice().reverse();
  const porDia = {}; list.forEach(x=>(porDia[x.fecha]=porDia[x.fecha]||[]).push(x));
  const cats = [...S.categorias.gasto, ...S.categorias.ingreso];
  return `
  <div class="top"><h1>Movimientos</h1><span></span></div>
  <div class="wrap">
    <div class="row"><button class="btn sm" data-a="mes" data-d="-1">‹</button><b>${MESES_L[m-1]} ${y}</b><button class="btn sm" data-a="mes" data-d="1">›</button></div>
    <div class="grid2" style="margin-top:10px;grid-template-columns:1fr 1fr 1fr">
      <select class="i" data-a-change="filtro" data-k="tipo"><option value="">Tipo</option>${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}" ${movFiltro.tipo===k?'selected':''}>${v.l}</option>`).join('')}</select>
      <select class="i" data-a-change="filtro" data-k="cat"><option value="">Categoría</option>${cats.map(c=>`<option value="${c.id}" ${movFiltro.cat===c.id?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select>
      <select class="i" data-a-change="filtro" data-k="cuenta"><option value="">Cuenta</option>${S.cuentas.map(c=>`<option value="${c.id}" ${movFiltro.cuenta===c.id?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select>
    </div>
    <div class="list">
    ${Object.keys(porDia).length ? Object.entries(porDia).map(([f,xs])=>`<div class="day">${flarga(f)}</div>${xs.map(x=>{ const s = signoMov(x); return `<div class="it" data-a="editar" data-id="${x.id}"><span class="dot" style="background:${s>0?'var(--pos)':s<0?'var(--neg)':'var(--faint)'}"></span><div class="grow"><div class="t">${esc(descMov(x))}</div><div class="tiny faint t">${TIPOS[x.tipo].l}${x.cuentaId&&x.tipo!=='transfer'?' · '+esc(cuentaNombre(x.cuentaId)):''}${x.nota?' · '+esc(x.nota):''}</div></div><b class="${s>0?'pos':''}">${s>0?'+':s<0?'−':''}${$$(x.monto)}</b></div>`; }).join('')}`).join('') : '<div class="empty" style="padding:20px 0">No hay movimientos con estos filtros.</div>'}
    </div>
  </div>`;
}

// ---------- PLAN ----------
function vPlan(C){
  const q = C.q;

// ---------- ONBOARDING Y PIN ----------
let obPaso = 0, pinBuf = '', pinPrimero = '', pinModo = 'unlock', pinMsg = '';
function onboarding(){
  if (obPaso===0) return `<div class="lock"><h1 style="font-size:26px">Vida Financiera</h1><p class="muted" style="text-align:center;max-width:320px">Anotas en un solo lugar y lo demás se calcula solo: supervivencia, fijos, deudas y lo que puedes gastar. Tus datos se quedan en este celular.</p><button class="btn pri" data-a="ob" data-d="1">Empezar</button><button class="link small" data-a="restore">Tengo un respaldo</button><input type="file" id="fileRestore" accept=".json,application/json" style="display:none"></div>`;
  if (obPaso===1) return pantallaPin('crear');
  if (obPaso===2) return `<div class="wrap"><div class="top" style="padding-left:0"><h1>Saldos de hoy</h1></div><p class="small muted">Escribe cuánto tienes hoy en cada cuenta, antes de anotar cualquier movimiento. Si no usas alguna, pon 0. Luego puedes agregar o renombrar cuentas.</p>${S.cuentas.map(c=>`<label class="f">${esc(c.nombre)}</label><input class="i money" style="font-size:20px" inputmode="numeric" data-money id="ob-${c.id}" placeholder="$0">`).join('')}<div class="hint" id="obErr"></div><button class="btn pri block" style="margin-top:18px" data-a="obSaldos">Guardar y entrar</button></div>`;
  return '';
}
function pantallaPin(modo){
  pinModo = modo;
  const titulo = { unlock:'Ingresa tu PIN', crear: pinPrimero?'Repite tu PIN':'Crea un PIN de 4 a 6 dígitos', actual:'PIN actual', nuevo: pinPrimero?'Repite el nuevo PIN':'Nuevo PIN (4 a 6 dígitos)' }[modo];
  const n = Math.max(4, pinBuf.length);
  const puedeOk = modo!=='unlock' && pinBuf.length>=4;
  return `<div class="lock"><h2>${titulo}</h2><div class="pins" id="pins">${Array.from({length: modo==='unlock'?Math.max(4,pinBuf.length):6},(_,i)=>`<i class="${i<pinBuf.length?'f':''}"></i>`).join('')}</div><div class="small ${pinMsg?'neg':'faint'}" style="min-height:20px">${esc(pinMsg)}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(k=>`<button data-a="pk" data-k="${k}">${k}</button>`).join('')}<button class="ghost" data-a="pk" data-k="del">Borrar</button><button data-a="pk" data-k="0">0</button><button class="ghost" data-a="pk" data-k="ok" ${modo==='unlock'||puedeOk?'':'disabled'}>OK</button></div>
  ${modo==='nuevo'||modo==='actual'?'<button class="link small" data-a="pinCancel">Cancelar</button>':''}</div>`;
}
async function hashPin(pin, salt){ const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt+':'+pin)); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function pinTecla(k){
  pinMsg = '';
  if (k==='del'){ pinBuf = pinBuf.slice(0,-1); return rerenderPin(); }
  if (k==='ok') return pinOk();
  if (pinBuf.length>=6) return;
  pinBuf += k;
  if (pinModo==='unlock' && pinBuf.length>=4){
    const h = await hashPin(pinBuf, S.settings.salt);
    if (h===S.settings.pinHash){ bloqueado = false; pinBuf=''; render(); return; }
    if (pinBuf.length===6){ pinMsg='PIN incorrecto'; pinBuf=''; rerenderPin(true); return; }
  }
  if (pinModo==='actual' && pinBuf.length>=4){
    const h = await hashPin(pinBuf, S.settings.salt);
    if (h===S.settings.pinHash){ pinBuf=''; pinPrimero=''; pinModo='nuevo'; return rerenderPin(); }
    if (pinBuf.length===6){ pinMsg='PIN incorrecto'; pinBuf=''; return rerenderPin(true); }
  }
  rerenderPin();
}
async function pinOk(){
  if (pinModo==='unlock'){ const h = await hashPin(pinBuf, S.settings.salt); if (h===S.settings.pinHash){ bloqueado=false; pinBuf=''; render(); } else { pinMsg='PIN incorrecto'; pinBuf=''; rerenderPin(true);} return; }
  if (pinModo==='actual'){ const h = await hashPin(pinBuf, S.settings.salt); pinBuf=''; if (h===S.settings.pinHash){ pinPrimero=''; pinModo='nuevo'; } else pinMsg='PIN incorrecto'; return rerenderPin(!!pinMsg); }
  if (pinBuf.length<4) return;
  if (!pinPrimero){ pinPrimero = pinBuf; pinBuf=''; return rerenderPin(); }
  if (pinPrimero!==pinBuf){ pinMsg='No coinciden. Empieza de nuevo.'; pinPrimero=''; pinBuf=''; return rerenderPin(true); }
  S.settings.salt = uid(); S.settings.pinHash = await hashPin(pinBuf, S.settings.salt);
  pinBuf=''; pinPrimero='';
  await guardar();
  if (!S.settings.onboarded){ obPaso = 2; render(); return; }
  cerrarSheet(); toast('PIN cambiado'); render();
}
function rerenderPin(shake){
  const target = document.getElementById('sheet').classList.contains('hidden') ? document.getElementById('app') : document.getElementById('sheet');
  target.innerHTML = pantallaPin(pinModo);
  if (shake){ const p = target.querySelector('#pins'); p && p.classList.add('shake'); }
}

function opcionesBolsillo(C, incluirFlex=true){
  const o = [];
  C.plan.filter(p=>incluirFlex || p.kind==='fijo').forEach(p=>o.push({ v:p.key, l:`${p.nombre} (${$$(p.bal)})` }));
  if (incluirFlex) C.activas.filter(d=>d.tipo!=='obligatoria').forEach(d=>o.push({ v:'deuda:'+d.id, l:`Para pagar ${d.nombre} (${$$(d.bolsillo)})` }));
  o.push({ v:'emergencia', l:`Fondo de emergencia (${$$(C.bal.emergencia||0)})` });
  C.otrosB.forEach(b=>o.push({ v:b.id, l:`${b.nombre} (${$$(b.bal)})` }));
  return o;
}

function leerForm(){
  const g = id => document.getElementById(id);
  if (g('fMonto')) F.monto = String(num(g('fMonto').value));
  if (g('fFecha')) F.fecha = g('fFecha').value || hoy();
  if (g('fNota')) F.nota = g('fNota').value.trim();
  if (g('fBolsillo')) F.bolsillo = g('fBolsillo').value;
  if (g('fAcreedor')) F.acreedor = g('fAcreedor').value.trim();
  if (g('fCuota')) F.cuota = String(num(g('fCuota').value));
  if (g('fDia')) F.dia = g('fDia').value.replace(/[^\d]/g,'');
}
function autoBolsillo(){
  if (F.tipo!=='gasto' || F.bolsilloManual) return;
  const f = S.fijos.find(x=>x.catId===F.catId && x.sub && x.sub===F.sub);
  F.bolsillo = f ? 'fijo:'+f.id : '';
}
async function guardarForm(){
  leerForm();
  const err = m => { const e = document.getElementById('fErr'); if (e) e.textContent = m; };
  const monto = num(F.monto);
  if (!monto) return err('Escribe el monto.');
  const t = F.tipo;
  if ((t==='gasto'||t==='ingreso'||t==='reintegro') && !F.catId) return err('Escoge la categoría.');
  if ((t==='gasto'||t==='ingreso'||t==='reintegro'||t==='pago'||t==='prestamo'||t==='cadena'||t==='transfer') && !F.cuentaId) return err('Escoge la cuenta.');
  if (t==='pago' && !F.deudaId) return err('Escoge la deuda.');
  if ((t==='apartar'||t==='sacar') && !F.bolsillo) return err('Escoge el bolsillo.');
  if (t==='sacar' && !F.nota) return err('Escribe el motivo.');
  if (t==='transfer' && F.cuentaId===F.cuentaDestinoId) return err('Las cuentas deben ser distintas.');
  if (t==='prestamo' && !F.acreedor) return err('Escribe quién te prestó.');
  if (t==='prestamo' && F.dtipo==='obligatoria' && (!num(F.cuota) || !num(F.dia) || num(F.dia)>31)) return err('Escribe la cuota y el día de pago (1 a 31).');
  if (t==='sacar'){ const C = calcular(); const disp = C.bal[F.bolsillo]||0; const previo = F.editId ? (+(S.movs.find(m=>m.id===F.editId)||{}).monto||0) : 0; if (monto > disp + previo) return err(`Ese bolsillo solo tiene ${$$(disp+previo)}.`); }

  const m = F.editId ? S.movs.find(x=>x.id===F.editId) : { id:uid(), creado:Date.now() };
  Object.assign(m, { tipo:t, monto, fecha:F.fecha, nota:F.nota });
  ['catId','sub','cuentaId','cuentaDestinoId','deudaId','bolsillo','acreedor'].forEach(k=>delete m[k]);
  if (t==='gasto'||t==='ingreso'||t==='reintegro'){ m.catId=F.catId; if (F.sub) m.sub=F.sub; m.cuentaId=F.cuentaId; if (t==='gasto' && F.bolsillo) m.bolsillo=F.bolsillo; }
  if (t==='pago'){ m.deudaId=F.deudaId; m.cuentaId=F.cuentaId; m.bolsillo='deuda:'+F.deudaId; }
  if (t==='apartar'||t==='sacar'){ m.bolsillo=F.bolsillo; }
  if (t==='cadena'){ m.cuentaId=F.cuentaId; }
  if (t==='transfer'){ m.cuentaId=F.cuentaId; m.cuentaDestinoId=F.cuentaDestinoId; }
  if (t==='prestamo'){
    m.cuentaId=F.cuentaId; m.acreedor=F.acreedor;
    let d = S.deudas.find(x=>x.origenMov===m.id);
    if (!d){ d = { id:uid(), origenMov:m.id, ajustes:[], notas:'Creada desde un préstamo recibido.' }; S.deudas.push(d); }
    const cuota = num(F.cuota);
    Object.assign(d, { nombre:F.acreedor, acreedor:F.acreedor, saldoInicial:monto, fechaInicio:F.fecha, creado:m.creado, tipo:F.dtipo, cuota: F.dtipo==='obligatoria'?cuota:0, diaPago: F.dtipo==='obligatoria'?num(F.dia):0, q15: Math.floor(cuota/2), q30: cuota-Math.floor(cuota/2) });
    m.deudaId = d.id;
  }
  if (!F.editId) S.movs.push(m);
  await guardar(); cerrarSheet(); toast(F.editId?'Cambios guardados':'Guardado'); render();
}
async function borrarMov(){
  const m = S.movs.find(x=>x.id===F.editId); if (!m) return;
  if (m.tipo==='prestamo'){
    const d = S.deudas.find(x=>x.origenMov===m.id);
    if (d && S.movs.some(x=>x.tipo==='pago'&&x.deudaId===d.id)) { document.getElementById('fErr').textContent='Esta deuda ya tiene pagos. Borra primero los pagos.'; return; }
    if (!confirm('Se borra el préstamo y la deuda que creó. ¿Seguro?')) return;
    if (d) S.deudas = S.deudas.filter(x=>x!==d);
  } else if (!confirm('¿Eliminar este movimiento?')) return;
  S.movs = S.movs.filter(x=>x!==m);
  await guardar(); cerrarSheet(); toast('Eliminado'); render();
}

// ----- repartir quincena -----
let R = null;
function abrirRepartir(){
  const C = calcular();
  const items = [];
  C.plan.filter(p=>p.faltaQ>0 && !p.pagado).forEach(p=>items.push({ key:p.key, nombre:p.nombre, monto:p.faltaQ, tipo:'apartar', on:true, det:`le toca ${$$(p.porcion)} esta quincena` }));
  C.plan.filter(p=>p.pagado && p.faltaQ>0).forEach(p=>items.push({ key:p.key, nombre:p.nombre, monto:p.faltaQ, tipo:'apartar', on:true, det:'para el pago del próximo mes' }));
  const em = Math.max(0, C.emerg.aporte - C.emergQ);
  if (em>0) items.push({ key:'emergencia', nombre:'Fondo de emergencia', monto:em, tipo:'apartar', on:true, det:'aporte mínimo' });
  C.otrosB.forEach(b=>{ const f = Math.max(0,(+b.aporte||0)-b.apartadoQ); if (f>0) items.push({ key:b.id, nombre:b.nombre, monto:f, tipo:'apartar', on:true, det:'aporte por quincena' }); });
  if (C.cadena && C.cadenaActiva && C.cadenaQ < C.cadena.aporte) items.push({ key:'cadena', nombre:'Aporte a la cadena', monto:C.cadena.aporte-C.cadenaQ, tipo:'cadena', on:true, det:'sale plata real', cuentaId:S.cuentas[0]?.id });
  R = { items };
  renderRepartir();
}
function renderRepartir(){
  const C = calcular();
  const sel = R.items.filter(i=>i.on).reduce((s,i)=>s+ +i.monto,0);
  const libre = C.disponible - sel;
  const q = C.q;
  let h = `<div class="small muted">${quincenaNombre(q)} · ${fcorta(q.start)} – ${fcorta(q.end)}. La supervivencia (${$$(C.reservado)} que quedan) ya está reservada automáticamente.</div>`;
  h += `<div class="card"><div class="row"><span>Disponible libre hoy</span><b>${$$(C.disponible)}</b></div></div>`;
  h += R.items.length ? R.items.map((it,i)=>`<div class="card soft"><div class="row"><label class="row" style="gap:10px;justify-content:flex-start;flex:1"><input type="checkbox" data-a-change="rOn" data-i="${i}" ${it.on?'checked':''} style="width:20px;height:20px"><span class="col"><span>${esc(it.nombre)}</span><span class="tiny faint">${esc(it.det)}</span></span></label><input class="i" style="width:130px;text-align:right" inputmode="numeric" data-money data-a-input="rMonto" data-i="${i}" value="$${miles(it.monto)}"></div>${it.tipo==='cadena'?`<div class="chips" style="margin-top:8px">${S.cuentas.map(c=>`<button class="chip ${it.cuentaId===c.id?'on':''}" data-a="rCuenta" data-i="${i}" data-v="${c.id}">${esc(c.nombre)}</button>`).join('')}</div>`:''}</div>`).join('') : '<div class="card empty">No hay nada pendiente por apartar en esta quincena.</div>';
  h += `<div class="card"><div class="row"><span>Total a apartar</span><b>${$$(sel)}</b></div><div class="row"><span>Te queda libre</span><b id="rLibre" class="${libre<0?'neg':'pos'}">${$$(libre)}</b></div>${libre<0?'<div class="small neg" style="margin-top:6px">No alcanza para todo. Desmarca o baja lo de menor prioridad.</div>':''}</div>`;
  h += `<button class="btn pri block" data-a="rGuardar" ${R.items.some(i=>i.on)?'':'disabled'}>Apartar lo marcado</button>`;
  abrirSheet('Repartir quincena', h);
}
async function guardarRepartir(){

async function guardarFijo(id){

  if (!nombre) return err('Escribe el nombre.');
  if (!monto) return err('Escribe el monto.');
  if (!dia || dia>31) return err('El día de pago va de 1 a 31.');
  if (q15===null && q30===null){ q15 = Math.floor(monto/2); q30 = monto-q15; }
  else { q15 = q15||0; q30 = q30||0; }
  if (q15+q30 !== monto) return err(`Las dos partes suman ${$$(q15+q30)} y el monto es ${$$(monto)}.`);
  const otro = S.fijos.find(x=>x.id!==id && x.catId===catId && x.sub===sub);
  if (otro) return err(`La subcategoría “${sub}” ya la usa ${otro.nombre}. Cada fijo necesita la suya.`);
  if (id){
    const f = S.fijos.find(x=>x.id===id);
    if (+f.monto !== monto){ const motivo = g('xMotivo').value.trim(); if (!motivo) return err('Escribe el motivo del cambio de monto.'); (f.historial=f.historial||[]).push({ fecha:hoy(), antes:+f.monto, despues:monto, motivo }); }
    Object.assign(f, { nombre, catId, sub, monto, diaPago:dia, q15, q30 });
  } else S.fijos.push({ id:uid(), nombre, catId, sub, monto, diaPago:dia, q15, q30, historial:[] });

}

  const g = x => document.getElementById(x);
  const saldo = num(g('eSaldo').value), fecha = g('eFecha').value || hoy();
  if (!g('eSaldo').value.trim()) { g('eErr').textContent='Escribe el saldo (puede ser 0).'; return; }
  const C = calcular(); const dc = C.deudas.find(x=>x.id===id); const d = S.deudas.find(x=>x.id===id);
  const aj = d.ajustes||[]; const base = aj.length ? aj[aj.length-1] : { fecha:d.fechaInicio, saldo:+d.saldoInicial, creado:d.creado };
  const despues = p => p.fecha>base.fecha || (p.fecha===base.fecha && p.creado>base.creado);
  const posteriores = S.movs.filter(m=>m.tipo==='pago'&&m.deudaId===id&&despues(m)&&m.fecha>fecha).reduce((s,m)=>s+ +m.monto,0);
  const calcEnFecha = dc.saldoAct + posteriores;
  (d.ajustes = aj).push({ fecha, saldo, creado:Date.now(), diferencia: saldo - calcEnFecha });
  await guardar(); cerrarSheet(); toast('Saldo actualizado'); render();
}

// ----- bolsillos (emergencia, cadena, fondos) -----
function abrirBolsillo(id){
  const b = id ? S.bolsillos.find(x=>x.id===id) : { nombre:'', tipo:'fondo', aporte:'', objetivo:'', inicial:0 };
  let h = '';
  if (b.tipo==='emergencia'){
    h += `<div class="small muted">Meta: de 3 a 6 meses de gastos básicos, por etapas (1 → 3 → 6).</div>`;
    h += `<label class="f">Aporte mínimo por quincena</label><input class="i" id="bAporte" inputmode="numeric" data-money value="$${miles(b.aporte||0)}">`;
    h += `<label class="f">Lo que ya tenías ahorrado para emergencias antes de usar la app</label><input class="i" id="bInicial" inputmode="numeric" data-money value="$${miles(b.inicial||0)}">`;
  } else if (b.tipo==='cadena'){
    h += `<div class="grid2"><div><label class="f">Aporte por quincena</label><input class="i" id="bAporte" inputmode="numeric" data-money value="$${miles(b.aporte||0)}"></div><div><label class="f">Recibes</label><input class="i" id="bRecibes" inputmode="numeric" data-money value="$${miles(b.recibes||0)}"></div></div>`;
    h += `<div class="grid2"><div><label class="f">Te la entregan</label><input class="i" type="date" id="bEntrega" value="${b.fechaEntrega}"></div><div><label class="f">Último aporte</label><input class="i" type="date" id="bFin" value="${b.fechaFin}"></div></div>`;
    h += `<label class="f">Cuánto llevabas aportado antes de usar la app</label><input class="i" id="bInicial" inputmode="numeric" data-money value="${b.inicial==null?'':'$'+miles(b.inicial)}" placeholder="Ej: $400.000"><div class="hint">Solo los aportes anteriores a hoy que no vas a registrar en la app.</div>`;
  } else {
    h += `<label class="f">Nombre</label><input class="i" id="bNombre" value="${esc(b.nombre)}" placeholder="Ej: Mantenimiento moto">`;
    h += `<div class="grid2"><div><label class="f">Aporte por quincena (opcional)</label><input class="i" id="bAporte" inputmode="numeric" data-money value="${b.aporte?'$'+miles(b.aporte):''}"></div><div><label class="f">Objetivo (opcional)</label><input class="i" id="bObjetivo" inputmode="numeric" data-money value="${b.objetivo?'$'+miles(b.objetivo):''}"></div></div>`;
    h += `<label class="f">Lo que ya tienes para esto</label><input class="i" id="bInicial" inputmode="numeric" data-money value="$${miles(b.inicial||0)}">`;
  }
  h += `<div class="hint neg" id="bErr"></div><button class="btn pri block" style="margin-top:16px" data-a="bolsilloGuardar" data-id="${id||''}">Guardar</button>`;
  if (id && !b.sistema && !S.movs.some(m=>m.bolsillo===id)) h += `<button class="btn danger block" style="margin-top:10px" data-a="bolsilloBorrar" data-id="${id}">Eliminar fondo</button>`;
  abrirSheet(id ? b.nombre : 'Nuevo fondo', h);
}
async function guardarBolsillo(id){
  const g = x => document.getElementById(x);
  const b = id ? S.bolsillos.find(x=>x.id===id) : { id:'b_'+uid(), tipo:'fondo' };
  if (b.tipo==='fondo'){ const n = g('bNombre').value.trim(); if (!n){ g('bErr').textContent='Escribe el nombre.'; return; } b.nombre = n; b.objetivo = num(g('bObjetivo').value); }
  b.aporte = num(g('bAporte').value);
  if (b.tipo==='cadena'){ b.recibes = num(g('bRecibes').value); b.fechaEntrega = g('bEntrega').value; b.fechaFin = g('bFin').value; b.inicial = g('bInicial').value.trim()===''?null:num(g('bInicial').value); }
  else b.inicial = num(g('bInicial').value);
  if (!id) S.bolsillos.push(b);
  await guardar(); cerrarSheet(); toast('Guardado'); render();
}

// ----- supervivencia -----
function abrirSuperv(){
  let h = `<div class="small muted">Lo que necesitas por día. Se multiplica por los días de cada quincena y se aparta primero. Todo gasto de esas categorías descuenta de aquí.</div><div id="svRows">`;
  h += S.supervivencia.map((r,i)=>svEditRow(r,i)).join('');
  h += `</div><button class="btn sm" style="margin-top:10px" data-a="svAdd">+ Rubro</button><div class="hint neg" id="svErr"></div><button class="btn pri block" style="margin-top:16px" data-a="svGuardar">Guardar</button>`;
  abrirSheet('Supervivencia', h);
}
function svEditRow(r,i){ return `<div class="card soft" data-sv="${i}"><div class="grid2"><div><label class="f" style="margin-top:0">Rubro</label><input class="i" data-f="nombre" value="${esc(r.nombre)}"></div><div><label class="f" style="margin-top:0">Por día</label><input class="i" data-f="porDia" inputmode="numeric" data-money value="$${miles(r.porDia||0)}"></div></div><label class="f">Categoría que descuenta</label><select class="i" data-f="cat">${S.categorias.gasto.map(c=>`<option value="${c.id}" ${c.id===r.cat?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select><button class="link small neg" style="margin-top:8px" data-a="svDel" data-i="${i}">Quitar</button></div>`; }
function leerSuperv(){ return [...document.querySelectorAll('[data-sv]')].map((el,i)=>({ id:S.supervivencia[i]?.id||uid(), nombre:el.querySelector('[data-f=nombre]').value.trim(), porDia:num(el.querySelector('[data-f=porDia]').value), cat:el.querySelector('[data-f=cat]').value })); }

// ----- cuentas -----
function abrirCuenta(id){
  const c = id ? S.cuentas.find(x=>x.id===id) : { nombre:'', saldoInicial:0 };
  const usada = id && S.movs.some(m=>m.cuentaId===id||m.cuentaDestinoId===id);
  let h = `<label class="f">Nombre</label><input class="i" id="cNombre" value="${esc(c.nombre)}"><label class="f">Saldo inicial (lo que tenía antes del primer movimiento)</label><input class="i" id="cSaldo" inputmode="numeric" data-money value="$${miles(c.saldoInicial||0)}"><div class="hint">Si ya anotaste movimientos, cambiar este valor mueve todos los saldos.</div><div class="hint neg" id="cErr"></div><button class="btn pri block" style="margin-top:16px" data-a="cuentaGuardar" data-id="${id||''}">Guardar</button>`;
  if (id && !usada && S.cuentas.length>1) h += `<button class="btn danger block" style="margin-top:10px" data-a="cuentaBorrar" data-id="${id}">Eliminar cuenta</button>`;
  abrirSheet(id?'Editar cuenta':'Nueva cuenta', h);
}

// ----- categorías -----
let catTipo = 'gasto';
function abrirCats(t){
  catTipo = t;
  const usadas = new Set(S.movs.map(m=>m.catId));
  let h = `<div class="small muted">Agrega, cambia o quita categorías y subcategorías. Una categoría con movimientos no se puede borrar, pero sí renombrar.</div>`;
  h += S.categorias[t].map((c,i)=>`<div class="card soft"><div class="row"><input class="i" data-cat="${i}" value="${esc(c.nombre)}" ${c.sistema?'disabled':''}>${!c.sistema && !usadas.has(c.id)?`<button class="link small neg" data-a="catDel" data-i="${i}">Quitar</button>`:''}</div><div class="chips" style="margin-top:8px">${c.subs.map((s,j)=>`<span class="chip x">${esc(s)} <button class="link small neg" data-a="subDel" data-i="${i}" data-j="${j}" aria-label="Quitar ${esc(s)}">×</button></span>`).join('')}</div>${c.sistema?'':`<div class="row" style="margin-top:8px"><input class="i" id="nsub${i}" placeholder="Nueva subcategoría"><button class="btn sm" data-a="subAdd" data-i="${i}">Agregar</button></div>`}</div>`).join('');
  h += `<div class="row" style="margin-top:12px"><input class="i" id="ncat" placeholder="Nueva categoría"><button class="btn sm" data-a="catAdd">Agregar</button></div>`;
  h += `<button class="btn pri block" style="margin-top:16px" data-a="catsGuardar">Guardar nombres</button>`;
  abrirSheet(t==='gasto'?'Categorías de gasto':'Categorías de ingreso', h);
}
function leerNombresCats(){ document.querySelectorAll('[data-cat]').forEach(el=>{ const c = S.categorias[catTipo][+el.dataset.cat]; if (c && !c.sistema && el.value.trim()) c.nombre = el.value.trim(); }); }

// ----- respaldo -----
async function hacerBackup(){
  const data = JSON.stringify({ app:'vida-financiera', version:1, exportado:new Date().toISOString(), data:S });
  const nombre = `vida-financiera-respaldo-${hoy()}.json`;
  const file = new File([data], nombre, { type:'application/json' });
  let ok = false;
  if (navigator.canShare && navigator.canShare({ files:[file] })){
    try { await navigator.share({ files:[file], title:'Respaldo Vida Financiera' }); ok = true; } catch(e){ if (e.name==='AbortError') return; }
  }
  if (!ok){ const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000); }
  S.settings.lastBackup = hoy(); await guardar(); toast('Respaldo generado. Guárdalo en Drive.'); render();
}
function exportarCSV(){
  const cols = ['fecha','tipo','categoria','subcategoria','monto','cuenta','cuenta_destino','deuda','bolsillo','nota'];
  const q = v => { const s = String(v??''); return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const rows = [...S.movs].sort((a,b)=>a.fecha<b.fecha?-1:1).map(m=>[m.fecha, TIPOS[m.tipo].l, m.catId?catNombre(m.catId):'', m.sub||'', signoMov(m)*m.monto || m.monto, m.cuentaId?cuentaNombre(m.cuentaId):'', m.cuentaDestinoId?cuentaNombre(m.cuentaDestinoId):'', m.deudaId?((S.deudas.find(d=>d.id===m.deudaId)||{}).nombre||''):'', bolsilloNombre(m.bolsillo), m.tipo==='prestamo'?(m.acreedor||''):(m.nota||'')].map(q).join(';'));
  const csv = '﻿' + cols.join(';') + '\n' + rows.join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = `vida-financiera-movimientos-${hoy()}.csv`; document.body.appendChild(a); a.click(); a.remove();
}
async function restaurar(file){
  try {
    const obj = JSON.parse(await file.text());
    if (obj.app!=='vida-financiera' || !obj.data || !Array.isArray(obj.data.movs)) throw new Error('formato');
    if (!confirm(`Esto reemplaza todo lo que hay en este celular con el respaldo del ${obj.exportado?obj.exportado.slice(0,10):'archivo'} (${obj.data.movs.length} movimientos). ¿Seguro?`)) return;
    S = obj.data; S.settings.onboarded = true; await guardar();
    bloqueado = !!S.settings.pinHash; cerrarSheet(); render(); toast('Respaldo restaurado');
  } catch(e){ alert('Ese archivo no es un respaldo válido de Vida Financiera.'); }
}

// ---------- eventos ----------
const A = {
  nav: el => { view = el.dataset.v; window.scrollTo(0,0); render(); },
  nuevo: el => { const pre = {}; if (el.dataset.tipo) pre.tipo = el.dataset.tipo; if (el.dataset.deuda) pre.deudaId = el.dataset.deuda; if (el.dataset.bolsillo){ pre.bolsillo = el.dataset.bolsillo; } nuevoForm(pre); },
  editar: el => { const m = S.movs.find(x=>x.id===el.dataset.id); if (!m) return; const pre = { ...m, editId:m.id, monto:String(m.monto), bolsilloManual:true }; if (m.tipo==='prestamo'){ const d = S.deudas.find(x=>x.origenMov===m.id); if (d){ pre.dtipo=d.tipo; pre.cuota=String(d.cuota||''); pre.dia=String(d.diaPago||''); } } nuevoForm(pre); },
  cerrar: () => { cerrarSheet(); if (pinModo==='nuevo'||pinModo==='actual'){ pinModo='unlock'; } },
  fTipo: el => { leerForm(); F.tipo = el.dataset.v; F.catId=''; F.sub=''; F.bolsillo=''; F.bolsilloManual=false; if (F.tipo==='cadena' && !num(F.monto)){ const c = S.bolsillos.find(b=>b.id==='cadena'); if (c) F.monto=String(c.aporte); } renderForm(); },
  fCat: el => { leerForm(); F.catId = el.dataset.v; F.sub=''; autoBolsillo(); renderForm(); },
  fSub: el => { leerForm(); F.sub = F.sub===el.dataset.v ? '' : el.dataset.v; autoBolsillo(); renderForm(); },
  fSet: el => { leerForm(); F[el.dataset.k] = el.dataset.v; if (el.dataset.k==='deudaId' && !num(F.monto)){ const d = S.deudas.find(x=>x.id===el.dataset.v); if (d && d.cuota) F.monto = String(d.cuota); } renderForm(); },
  fGuardar: () => guardarForm(),
  fBorrar: () => borrarMov(),
  mes: el => { const [y,m] = movMes.split('-').map(Number); const d = new Date(y, m-1+Number(el.dataset.d), 1); movMes = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; render(); },
  repartir: () => abrirRepartir(),
  rGuardar: () => guardarRepartir(),
  rCuenta: el => { R.items[+el.dataset.i].cuentaId = el.dataset.v; renderRepartir(); },
  fijo: el => abrirFijo(el.dataset.id),
  fijoGuardar: el => guardarFijo(el.dataset.id||null),
  fijoBorrar: async el => { const id = el.dataset.id; const key='fijo:'+id; const C = calcular(); const b = C.bal[key]||0; if (!confirm(b>0?`Este fijo tiene ${$$(b)} apartados que quedarán libres. ¿Eliminar?`:'¿Eliminar este fijo?')) return; S.fijos = S.fijos.filter(f=>f.id!==id); S.movs.forEach(m=>{ if (m.bolsillo===key){ if (m.tipo==='gasto') delete m.bolsillo; } }); S.movs = S.movs.filter(m=>!((m.tipo==='apartar'||m.tipo==='sacar')&&m.bolsillo===key)); await guardar(); cerrarSheet(); render(); },
  deudaEdit: el => abrirDeuda(el.dataset.id),
  deudaGuardar: el => guardarDeuda(el.dataset.id||null),
  deudaBorrar: async el => { if (!confirm('¿Eliminar esta deuda?')) return; const id = el.dataset.id; S.deudas = S.deudas.filter(d=>d.id!==id); S.movs = S.movs.filter(m=>m.bolsillo!=='deuda:'+id); await guardar(); cerrarSheet(); render(); },
  extracto: el => abrirExtracto(el.dataset.id),
  extractoGuardar: el => guardarExtracto(el.dataset.id),
  bolsillo: el => abrirBolsillo(el.dataset.id),
  bolsilloGuardar: el => guardarBolsillo(el.dataset.id||null),
  bolsilloBorrar: async el => { if (!confirm('¿Eliminar este fondo?')) return; S.bolsillos = S.bolsillos.filter(b=>b.id!==el.dataset.id); await guardar(); cerrarSheet(); render(); },
  editSuperv: () => abrirSuperv(),
  svAdd: () => { const cur = leerSuperv(); S._svTmp = [...cur, { id:uid(), nombre:'', porDia:0, cat:'alimentacion' }]; document.getElementById('svRows').innerHTML = S._svTmp.map((r,i)=>svEditRow(r,i)).join(''); delete S._svTmp; },
  svDel: el => { const cur = leerSuperv(); cur.splice(+el.dataset.i,1); document.getElementById('svRows').innerHTML = cur.map((r,i)=>svEditRow(r,i)).join(''); },
  svGuardar: async () => { const rows = leerSuperv(); if (rows.some(r=>!r.nombre)) { document.getElementById('svErr').textContent='Todos los rubros necesitan nombre.'; return; } S.supervivencia = rows; await guardar(); cerrarSheet(); toast('Supervivencia actualizada'); render(); },
  cuenta: el => abrirCuenta(el.dataset.id),
  cuentaGuardar: async el => { const id = el.dataset.id; const n = document.getElementById('cNombre').value.trim(); if (!n){ document.getElementById('cErr').textContent='Escribe el nombre.'; return; } const s = num(document.getElementById('cSaldo').value); if (id){ Object.assign(S.cuentas.find(c=>c.id===id), { nombre:n, saldoInicial:s }); } else S.cuentas.push({ id:'c_'+uid(), nombre:n, saldoInicial:s }); await guardar(); cerrarSheet(); render(); },
  cuentaBorrar: async el => { if (!confirm('¿Eliminar esta cuenta?')) return; S.cuentas = S.cuentas.filter(c=>c.id!==el.dataset.id); await guardar(); cerrarSheet(); render(); },
  cats: el => abrirCats(el.dataset.t),
  catAdd: () => { leerNombresCats(); const n = document.getElementById('ncat').value.trim(); if (!n) return; S.categorias[catTipo].push({ id:'k_'+uid(), nombre:n, subs:[] }); guardar(); abrirCats(catTipo); },
  catDel: el => { leerNombresCats(); const c = S.categorias[catTipo][+el.dataset.i]; if (S.fijos.some(f=>f.catId===c.id) || S.supervivencia.some(r=>r.cat===c.id)) { alert('Esta categoría la usa un fijo o la supervivencia. Cámbialos primero.'); return; } if (!confirm(`¿Quitar “${c.nombre}”?`)) return; S.categorias[catTipo].splice(+el.dataset.i,1); guardar(); abrirCats(catTipo); },
  subAdd: el => { leerNombresCats(); const i = +el.dataset.i; const n = document.getElementById('nsub'+i).value.trim(); if (!n) return; const c = S.categorias[catTipo][i]; if (!c.subs.includes(n)) c.subs.push(n); guardar(); abrirCats(catTipo); },
  subDel: el => { leerNombresCats(); const c = S.categorias[catTipo][+el.dataset.i]; const s = c.subs[+el.dataset.j]; if (S.fijos.some(f=>f.catId===c.id && f.sub===s)) { alert(`“${s}” la usa un fijo. Cámbialo primero.`); return; } c.subs.splice(+el.dataset.j,1); guardar(); abrirCats(catTipo); },
  catsGuardar: async () => { leerNombresCats(); await guardar(); cerrarSheet(); toast('Categorías guardadas'); render(); },
  backup: () => hacerBackup(),
  csv: () => exportarCSV(),
  restore: () => document.getElementById('fileRestore').click(),
  cierre: async el => { const C = calcular(); const c = C.cierre; if (!c) return; if (el.dataset.d) S.movs.push({ id:uid(), creado:Date.now(), tipo:'apartar', monto:Math.round(c.sobrante), fecha:hoy(), bolsillo:el.dataset.d, nota:`Sobrante supervivencia ${quincenaNombre(c.q).toLowerCase()} (${fcorta(c.q.start)})` }); S.settings.cierres[c.q.start] = el.dataset.d || 'libre'; await guardar(); toast(el.dataset.d?'Sobrante apartado':'Listo'); render(); },
  bloquear: () => { bloqueado = true; pinBuf=''; render(); },
  cambiarPin: () => { pinBuf=''; pinPrimero=''; pinMsg=''; const sh = document.getElementById('sheet'); sh.classList.remove('hidden'); sh.innerHTML = pantallaPin('actual'); },
  pinCancel: () => { pinModo='unlock'; pinBuf=''; pinPrimero=''; cerrarSheet(); },
  pk: el => pinTecla(el.dataset.k),
  ob: el => { obPaso = +el.dataset.d; pinBuf=''; pinPrimero=''; render(); },
  obSaldos: async () => { const faltan = S.cuentas.filter(c=>document.getElementById('ob-'+c.id).value.trim()===''); if (faltan.length){ document.getElementById('obErr').textContent = `Falta: ${faltan.map(c=>c.nombre).join(', ')} (pon 0 si no tienes).`; return; } S.cuentas.forEach(c=>c.saldoInicial = num(document.getElementById('ob-'+c.id).value)); S.settings.onboarded = true; S.creado = hoy(); bloqueado = false; await guardar(); render(); toast('Listo. Ahora carga tus fijos y deudas.'); },
  borrarTodo: async () => { const t = prompt('Esto borra TODO. Escribe BORRAR para confirmar.'); if (t!=='BORRAR') return; S = estadoInicial(); obPaso = 0; bloqueado = true; await guardar(); cerrarSheet(); render(); },
};
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (fn){ e.preventDefault(); fn(el,e); }
});
document.addEventListener('change', e=>{
  const el = e.target;
  if (el.id==='fileRestore' && el.files[0]) { restaurar(el.files[0]); el.value=''; return; }
  const a = el.dataset.aChange; if (!a) { if (el.id==='fBolsillo' && F){ F.bolsillo = el.value; F.bolsilloManual = true; } return; }
  if (a==='filtro'){ movFiltro[el.dataset.k] = el.value; render(); }
  if (a==='lockMin'){ S.settings.lockMin = +el.value; guardar(); toast('Guardado'); }
  if (a==='rOn'){ R.items[+el.dataset.i].on = el.checked; renderRepartir(); }
  if (a==='xCat'){ const cat = S.categorias.gasto.find(c=>c.id===el.value); document.getElementById('xSub').innerHTML = (cat?cat.subs:[]).map(s=>`<option>${esc(s)}</option>`).join(''); }
  if (a==='dTipo'){ document.getElementById('dOblig').style.display = el.value==='obligatoria' ? '' : 'none'; }
});
document.addEventListener('input', e=>{
  const el = e.target;
  if (el.hasAttribute('data-money')){ const n = num(el.value); const pos = el.value.length - el.selectionStart; el.value = n||el.value.replace(/[^\d]/g,'')==='0' ? '$'+miles(n) : ''; try{ const p = Math.max(0, el.value.length - pos); el.setSelectionRange(p,p); }catch(_){} }
  if (el.dataset.aInput==='rMonto'){ R.items[+el.dataset.i].monto = num(el.value); const C = calcular(); const sel = R.items.filter(i=>i.on).reduce((s,i)=>s+ +i.monto,0); const l = document.getElementById('rLibre'); if (l){ l.textContent = $$(C.disponible-sel); l.className = C.disponible-sel<0?'neg':'pos'; } }
});
document.addEventListener('visibilitychange', ()=>{
  if (document.hidden) hiddenAt = Date.now();
  else if (S && S.settings.pinHash && !bloqueado && hiddenAt && Date.now()-hiddenAt > (S.settings.lockMin||3)*60000){ bloqueado = true; pinBuf=''; cerrarSheet(); render(); }
});

// ---------- arranque ----------
(async function init(){
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(_){}
  S = await dbGet('state');
  if (!S){ S = estadoInicial(); await guardar(); }
  bloqueado = !!S.settings.pinHash;
  render();
  if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
